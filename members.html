<style>
/* ── Üyeler (tasarım: Uyeler 1440 / M_Uyeler 390). Kabuk themes.css'ten, bileşenler ui.css'ten.
      Yalnız bu sayfanın yerleşimi ve kart görünümü burada. ── */

/* ── Başlık bölümü: ızgara zemin + süzülen ember ışığı ── */
.mem-hero { position:relative; overflow:hidden; border-bottom:1px solid var(--line-div); }
/* 44px: tasarımdaki alt boşluk (ölçekte karşılığı yok) */
.mem-hero-in { display:flex; justify-content:space-between; align-items:flex-end; gap:var(--s-40); padding-top:var(--s8); padding-bottom:44px; }
/* Tasarım: 700px radial, rgba(212,114,42,.22) → saydam (%75) */
.mem-glow { width:700px; height:700px; left:300px; top:-420px; --glow:rgba(212,114,42,.22); --glow-2:rgba(212,114,42,.06); }
.mem-head { position:relative; flex:0 0 auto; display:flex; flex-direction:column; gap:var(--s4); min-width:0; }
.mem-back { align-self:flex-start; display:inline-flex; align-items:center; gap:6px; min-height:var(--ctl-md); margin:-12px 0; font-family:var(--ff-mono); font-size:12px; letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-muted); }
.mem-back:hover { color:var(--fg); }
/* h1: tasarımda 96px (mobil 56px) — --fs-display'den (88/52) büyük, sayfaya özel akışkan ölçek */
html .mem-title { font-size:clamp(56px, calc(56px + (100vw - 600px) * .0476), 96px); line-height:.92; letter-spacing:var(--tr-display); }
.mem-sub { font-size:16px; line-height:1.5; color:var(--fg-muted); }
.mem-count { font-family:var(--ff-mono); color:var(--fg); }

/* Ünvan yolculuğu = ünvan filtresi (aria-pressed düğmeler) */
.mem-journey-wrap { position:relative; flex:0 1 auto; min-width:0; display:flex; flex-direction:column; gap:var(--s-10); align-items:flex-end; }
.mem-journey-lbl { font-family:var(--ff-mono); font-size:11px; letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-3); }
.mem-journey { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px 6px; }
.mem-jarr { color:var(--fg-off); font-family:var(--ff-mono); font-size:11px; }
.mem-jchip {
  position:relative; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:var(--r-pill); border:1px solid var(--line-ctl); background:transparent;
  font-family:var(--ff-mono); font-size:11px; line-height:1.3; letter-spacing:0; color:var(--fg-muted); white-space:nowrap; cursor:pointer;
  transition:background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.mem-jchip::after { content:''; position:absolute; inset:-9px -3px; }
button.mem-jchip:hover { border-color:var(--line-hi); color:var(--fg); }
/* girişsiz: filtre yok → düğme değil, yalnız ünvan sırası */
span.mem-jchip { cursor:default; }
/* Tasarımdaki sıra renkleri: 3. basamak .18 beyaz kenar (ölçekte yok), 4. turuncu, 5. altın, 6. ember dolgu.
   Ember dolgu akmaz ve ortası (turuncu→altın) görünür: koyu yazının kontrastı ≥4.5 kalsın (kırmızı uçta 3.1) */
.mem-jchip[data-rank="3"] { border-color:rgba(255,255,255,.18); color:var(--fg-soft); }
.mem-jchip[data-rank="4"] { border-color:var(--warn-line); color:var(--warn); }
.mem-jchip[data-rank="5"] { border-color:var(--accent-line-2); color:var(--accent); }
.mem-jchip[data-rank="6"] { border-color:transparent; color:var(--accent-ink); font-weight:700; background:var(--ember-grad); background-size:200% 100%; background-position:50% 0; }
button.mem-jchip[data-rank="4"]:hover { background:var(--warn-soft); }
button.mem-jchip[data-rank="5"]:hover { background:var(--accent-soft); }
.mem-jchip[aria-pressed="true"] { background:var(--fg); border-color:var(--fg); color:var(--bg); }
.mem-jchip[data-rank="6"][aria-pressed="true"] { background:var(--ember-grad); background-size:200% 100%; background-position:50% 0; color:var(--accent-ink); box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }
.mem-jx { font-size:12px; line-height:1; margin-right:-2px; }

/* ── Araç çubuğu: sıralama (radiogroup) + arama ── */
.mem-tools { display:flex; justify-content:space-between; align-items:center; gap:var(--s4); padding-top:var(--s6); }
/* Tasarım: 40px düğmeler, --surface-0 zemin, 500 ağırlık (ortak .seg 44/600) — ortak bileşene .seg--md olarak taşınmalı */
html .mem-sort { background:var(--surface-0); }
html .mem-sort .seg-btn { height:var(--ctl-sm); padding:0 18px; font-weight:500; }
html .mem-sort .seg-btn::after { content:''; position:absolute; inset:-4px 0; }
.mem-search { width:320px; max-width:100%; }
/* Tasarım: 48px arama (ortak .be-search 52px) */
html .mem-search input { height:48px; }
.mem-search input::-webkit-search-cancel-button, .mem-search input::-webkit-search-decoration { -webkit-appearance:none; appearance:none; }

/* ── Filtre satırı: projeye açık + türler ── */
.mem-filters { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); padding-top:var(--s-20); }
.mem-fsep { width:1px; height:20px; margin:0 var(--s1); background:var(--line-strong); flex-shrink:0; }
.mem-flbl { font-family:var(--ff-mono); font-size:11px; letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-3); margin-right:var(--s1); flex-shrink:0; }
.mem-genre-list { display:contents; }
.mem-fchip { position:relative; cursor:pointer; flex-shrink:0; transition:background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast); }
.mem-fchip::after { content:''; position:absolute; inset:-6px -2px; }
.mem-fchip:hover { border-color:var(--accent-line-2); color:var(--fg); }
.mem-fchip[aria-pressed="true"] { background:var(--fg); border-color:var(--fg); color:var(--bg); }
.mem-fchip--collab[aria-pressed="true"] { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
.mem-fmore { border-style:dashed; color:var(--fg-2); font-family:var(--ff-mono); font-size:11px; letter-spacing:var(--tr-mono); }

/* ── Üye ızgarası ── */
.mem-grid { list-style:none; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:var(--s4); padding-top:var(--s-28); padding-bottom:var(--s9); }
.mem-card {
  position:relative; isolation:isolate; overflow:hidden; min-height:250px; padding:28px 24px 20px;
  display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  border-radius:var(--r-20); background:var(--surface); border:1px solid var(--line);
}
/* Üstteki ember yıkaması (opaklık .12); akış yalnız hover'da — 200 kartta sürekli repaint olmasın */
.mem-card::before { content:''; position:absolute; z-index:-1; left:0; right:0; top:0; height:64px; background:var(--ember-grad); background-size:200% 100%; opacity:.12; pointer-events:none; }
.mem-card:hover::before { animation:be-flow 6s linear infinite; }

/* Ember halkalı avatar: halka ::before'da döner, fotoğraf (üstte, konumlu) dönmez */
.mem-ring { position:relative; flex-shrink:0; width:80px; height:80px; padding:3px; border-radius:50%; }
.mem-ring::before { content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, var(--ember-1), var(--ember-2), var(--ember-3), var(--ember-1)); }
.mem-card--sk .mem-ring::before, .mem-card:hover .mem-ring::before { animation:be-spin 6s linear infinite; }
.mem-av { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; border-radius:50%; object-fit:cover; background:var(--surface); font-family:var(--ff-disp); font-size:34px; line-height:1; color:var(--accent); }
/* z-index 2: ipucu (title) gerilmiş bağlantının üstünde görünsün */
.mem-collab { position:absolute; z-index:2; right:1px; bottom:1px; width:16px; height:16px; border-radius:50%; border:3px solid var(--surface); background:var(--ok-strong); }
.mem-collab--busy { background:var(--err-strong); }

.mem-name { display:flex; align-items:center; justify-content:center; gap:var(--s2); max-width:100%; font-family:var(--ff); font-size:17px; font-weight:600; line-height:1.3; letter-spacing:0; }
.mem-link { position:static; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.mem-link:hover { color:var(--fg); }
/* Kartın tamamı profil bağlantısı (iç içe <a> yerine gerilmiş bağlantı) */
.mem-link::after { content:''; position:absolute; inset:0; z-index:1; border-radius:var(--r-20); }
.mem-link:focus-visible { outline:0; }
.mem-link:focus-visible::after { outline:2px solid var(--accent); outline-offset:-2px; }
.mem-admin { flex-shrink:0; font-family:var(--ff-mono); font-size:var(--fs-micro); font-weight:400; letter-spacing:var(--tr-mono); text-transform:uppercase; color:var(--fg-3); padding:3px 7px; border-radius:var(--r-pill); border:1px solid var(--line-strong); }

.mem-tpill { display:inline-flex; align-items:center; justify-content:center; gap:6px; max-width:100%; padding:5px 10px; border-radius:var(--r-pill); border:1px solid var(--line-ctl); font-family:var(--ff-mono); font-size:10px; line-height:1.2; letter-spacing:var(--tr-mono); text-transform:uppercase; color:var(--fg-muted); white-space:nowrap; }
.mem-tpill .icon { width:12px; height:12px; }
.mem-tpill[data-rank="3"] { border-color:rgba(255,255,255,.18); color:var(--fg-soft); }
.mem-tpill[data-rank="4"] { border-color:var(--warn-line); color:var(--warn); }
.mem-tpill[data-rank="5"] { border-color:var(--accent-line-2); color:var(--accent); }
.mem-tpill[data-rank="6"] { border-color:transparent; background:var(--ember-grad); background-size:200% 100%; background-position:50% 0; color:var(--accent-ink); font-weight:700; }

.mem-joined { font-size:12px; line-height:1.4; color:var(--fg-3); }
.mem-joined::first-letter { text-transform:uppercase; }
.mem-genres { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
.mem-genre { padding:3px 8px; border-radius:var(--r-pill); border:1px solid var(--line); font-family:var(--ff-mono); font-size:10px; line-height:1.3; letter-spacing:.04em; color:var(--fg-2); }
.mem-genre--more { position:relative; z-index:2; color:var(--fg-3); cursor:help; }
.mem-socials { position:relative; z-index:2; display:flex; flex-wrap:wrap; justify-content:center; gap:10px 6px; }
/* kısa etiketler (IG/SC/MC) de ≥44px genişlikte: dokunma alanı = 44 × 44 (::after dikeyde tamamlar) */
.mem-socials .be-chip--link { position:relative; height:30px; min-width:44px; justify-content:center; padding:0 10px; font-size:10px; }
.mem-socials .be-chip--link::after { content:''; position:absolute; inset:-8px -2px; }
.mem-stats { align-self:stretch; margin-top:auto; padding-top:14px; border-top:1px solid var(--line-2); display:flex; justify-content:center; gap:var(--s2); font-family:var(--ff-mono); font-size:11px; letter-spacing:var(--tr-mono); text-transform:uppercase; color:var(--fg-3); }
.mem-stats b { font-weight:400; color:var(--fg); }
.mem-stats-sep { color:var(--fg-deco); }

/* İskelet (yükleniyor) — tasarımdaki durum */
.mem-card--sk { height:250px; }
.mem-card--sk .mem-av { background:var(--surface); }
.mem-sk-name { width:var(--w, 60%); height:16px; margin-top:4px; }
.mem-sk-pill { width:90px; height:22px; }
.mem-sk-foot { width:60%; height:11px; margin-top:auto; }

/* Boş / girişsiz / hata durumu */
.mem-empty { grid-column:1 / -1; padding:var(--s8) var(--s5); gap:var(--s4); }
/* ui.css'te .icon (1em) .be-empty-icon'dan sonra geldiği için boyut burada yeniden verilir — ortakta düzeltilmeli */
.mem-empty .be-empty-icon { width:32px; height:32px; }
.mem-empty .btn { margin-top:var(--s1); }
.mem-empty-code { font-family:var(--ff-mono); font-size:11px; letter-spacing:var(--tr-mono); color:var(--fg-faint); }

/* ── Duyarlı ── */
@media (max-width:1279px) {
  .mem-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
}
@media (max-width:1024px) {
  .mem-back { display:none; }
  .mem-hero-in { flex-direction:column; align-items:stretch; gap:var(--s5); padding-top:var(--s7); padding-bottom:var(--s6); }
  .mem-journey-wrap { align-items:stretch; }
  .mem-journey-lbl { display:none; }
  /* Yatay kayan satırlar kenardan kenara; dokunma alanı kırpılmasın diye dikey dolgu */
  .mem-journey, .mem-filters { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .mem-journey::-webkit-scrollbar, .mem-filters::-webkit-scrollbar { display:none; }
  .mem-journey { justify-content:flex-start; margin:-6px calc(-1 * var(--page-x)); padding:10px var(--page-x); }
  .mem-filters { padding-top:var(--s3); padding-bottom:6px; }
}
@media (max-width:600px) {
  .mem-hero { border-bottom:0; background-image:none; }
  .mem-glow { display:none; }
  .mem-hero-in { gap:var(--s3); padding-top:var(--s-28); padding-bottom:0; }
  .mem-sub { font-size:14px; }
  .mem-journey { gap:6px; font-size:10px; }
  .mem-jchip { padding:5px 9px; font-size:10px; }
  .mem-jchip::after { inset:-10px -3px; }
  .mem-tools { flex-direction:column; align-items:stretch; gap:var(--s3); padding-top:var(--s3); }
  .mem-search { order:-1; width:100%; }
  html .mem-search input { padding-left:44px; }
  .mem-search .be-search-icon { left:16px; }
  html .mem-sort { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); }
  html .mem-sort .seg-btn { padding:0 6px; font-size:12px; }
  .mem-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--s-10); padding-top:var(--s4); padding-bottom:var(--s7); }
  .mem-card { min-height:196px; padding:20px 14px 16px; gap:12px; border-radius:var(--r-18); }
  .mem-link::after { border-radius:var(--r-18); }
  .mem-card::before { height:50px; }
  .mem-ring { width:64px; height:64px; }
  .mem-av { font-size:28px; }
  .mem-collab { width:14px; height:14px; }
  .mem-name { font-size:15px; }
  /* Uzun ünvan ("Prodüksiyon Meraklısı") dar kartta iki satıra iner */
  .mem-tpill { white-space:normal; text-align:center; letter-spacing:.04em; line-height:1.3; }
  .mem-joined { font-size:11px; }
  .mem-stats { padding-top:12px; font-size:10px; gap:6px; }
  .mem-card--sk { height:196px; }
  .mem-card--sk:nth-child(n+9) { display:none; }
  .mem-sk-name { height:13px; margin-top:0; }
  .mem-sk-pill { width:72px; height:18px; }
  .mem-sk-foot { display:none; }
  .mem-empty { padding:var(--s7) var(--s4); }
}
</style>

// TR: yıla göre ayrılma eki ("2025'ten", "2026'dan", "2020'den")
function trFromSuffix(year) {
  const ONES = { 1:'den', 2:'den', 3:'ten', 4:'ten', 5:'ten', 6:'dan', 7:'den', 8:'den', 9:'dan' };
  const TENS = { 1:'dan', 2:'den', 3:'dan', 4:'tan', 5:'den', 6:'tan', 7:'ten', 8:'den', 9:'dan' };
  const last = year % 10, tens = Math.floor(year / 10) % 10;
  if (last) return ONES[last];
  if (tens) return TENS[tens];
  return 'den';
}
function fmtJoined(ts) {
  if (!ts) return null;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d)) return null;
  if (lang() === 'en') return tt('mem_joined_since') + ' ' + d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const y = d.getFullYear();
  return `${d.toLocaleDateString('tr-TR', { month:'long' })} ${y}'${trFromSuffix(y)} beri üye`;
}
// Sosyal bağlantılar yalnız http(s) ise basılır (javascript: vb. şemalar atlanır)
function safeUrl(u) {
  if (!u || typeof u !== 'string') return null;
  try { const x = new URL(u.trim(), location.href); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; }
  catch (e) { return null; }
}

function toggleNotifPanel(user) {

  const isOpen = _notifPanelEl.classList.contains('open');

  _notifPanelEl.classList.add('open');

}

// Bağlantılı bildirim satırı klavyeyle de açılsın (profile.html _btnify ile aynı kalıp)
function _notifBtnify(node) {
  node.setAttribute('role', 'button'); node.tabIndex = 0;
  node.addEventListener('keydown', e => { if (e.target === node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); node.click(); } });
  return node;
}
function _mergeNotifs(uid) {
  const all = [
    ..._personalNotifs.map(n => ({...n, _t:'p'})),
    ..._announcements.filter(n => !_dismissedAnns.includes(n._id)).map(n => ({...n, _t:'a'}))
  ].sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
  const annSec = _annSeenAt?.seconds || 0;
  const unread = _personalNotifs.filter(n => !n.read).length
    + _announcements.filter(n => (n.createdAt?.seconds||0) > annSec).length;
  const badge = document.querySelector('.notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.style.display = unread > 0 ? 'block' : 'none'; }
  if (_notifPanelEl) {
    const list = _notifPanelEl.querySelector('.notif-list'); if (!list) return;
    list.innerHTML = '';
    if (!all.length) { list.innerHTML = '<div class="notif-empty">'+tt('ui_no_notifs')+'</div>'; return; }
    all.forEach(n => {
      const isUnread = n._t==='p' ? !n.read : (n.createdAt?.seconds||0) > annSec;
      const item = document.createElement('div'); item.className = 'notif-item' + (isUnread ? ' unread' : '');
      const _loc = lang()==='en'?'en-US':'tr-TR';
      const timeStr = n.createdAt ? n.createdAt.toDate().toLocaleDateString(_loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const _nt=document.createElement('div');_nt.className='notif-item-text';_nt.textContent=(n.text||tt('ui_new_notif'));if(n._t==='a')_nt.insertAdjacentHTML('afterbegin','<svg class="icon notif-ann-icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-info"/></svg> ');const _ni=document.createElement('div');_ni.className='notif-item-time';_ni.textContent=timeStr;item.append(_nt,_ni);
      if (n.postId) { item.onclick = () => { location.href = `post?id=${n.postId}`; }; _notifBtnify(item); }
      else if (n.type === 'lesson_confirm') { item.onclick = () => { location.href = '/booking#derslerim'; }; _notifBtnify(item); }
      if (n._id) {
        const del = document.createElement('button'); del.type = 'button'; del.className = 'notif-del-btn'; del.textContent = '×'; del.title = tt('prof_notif_del'); del.setAttribute('aria-label', del.title);
        del.onclick = e => {
          e.stopPropagation();
          if (n._t === 'p') {
            db.collection('notifications').doc(uid).collection('items').doc(n._id).delete();
          } else {
            if (!_dismissedAnns.includes(n._id)) { _dismissedAnns.push(n._id); }
            db.collection('users').doc(uid).update({ dismissedAnns: firebase.firestore.FieldValue.arrayUnion(n._id) }).catch(() => {});
            _announcements = _announcements.filter(a => a._id !== n._id);
            _mergeNotifs(uid);
          }
        };
        item.append(del);
      }
      list.append(item);
    });
  }
}

function markAllNotifRead(uid) {
  db.collection('notifications').doc(uid).collection('items')
    .where('read', '==', false).get().then(snap => {
      const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { read: true })); batch.commit();
    }).catch(() => {});
  db.collection('users').doc(uid).set({ announcementsSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
  _annSeenAt = { seconds: Date.now() / 1000 };
  _personalNotifs = _personalNotifs.map(n => ({...n, read: true}));
  _mergeNotifs(uid);
}

function initNotifications(user) {
  if (_notifUnsub) { _notifUnsub(); _notifUnsub = null; }
  if (_annUnsub) { _annUnsub(); _annUnsub = null; }
  _personalNotifs = []; _announcements = []; _annSeenAt = null; _dismissedAnns = [];
  if (!user) return;
  db.collection('users').doc(user.uid).get().then(d => {
    _annSeenAt = d.data()?.announcementsSeenAt || null;
    _dismissedAnns = d.data()?.dismissedAnns || [];
    _mergeNotifs(user.uid);
  }).catch(() => {});
  _notifUnsub = db.collection('notifications').doc(user.uid).collection('items')
    .orderBy('createdAt', 'desc').limit(20)
    .onSnapshot(snap => {
      _personalNotifs = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (snap.docs.length > 4) snap.docs.slice(4).forEach(d => d.ref.delete());
      _mergeNotifs(user.uid);
    }, () => {});
  _annUnsub = db.collection('announcements').orderBy('createdAt', 'desc').limit(15)
    .onSnapshot(snap => { _announcements = snap.docs.map(d => ({...d.data(), _id: d.id})); _mergeNotifs(user.uid); }, () => {});
}

function filtersActive() { return _titleFilter !== 'all' || _collabOnly || !!_genreFilter || !!_search; }
function clearFilters() {
  _titleFilter = 'all'; _collabOnly = false; _genreFilter = ''; _search = '';
  document.getElementById('searchInput').value = '';
  buildJourney(); syncCollab(); buildGenreFilter(); renderGrid();

// Ünvan yolculuğu = ünvan filtresi (tek seçim; seçili olana tekrar basınca tümü)
function buildJourney() {
  const box = document.getElementById('titleFilter'); box.innerHTML = '';
  // Girişsizken liste yok: çipler filtre düğmesi değil, yalnız ünvan sırasını gösteren etiketler
  const locked = _state === 'out';
  box.setAttribute('data-mem-aria', locked ? 'mem_journey' : 'mem_title_filter');
  box.setAttribute('aria-label', tt(locked ? 'mem_journey' : 'mem_title_filter'));
  Object.entries(TITLES).forEach(([key, td], i) => {
    if (i) { const a = el('span', 'mem-jarr', '→'); a.setAttribute('aria-hidden', 'true'); box.append(a); }
    if (locked) {
      const sp = el('span', 'mem-jchip', titleLabel(key));
      sp.dataset.rank = td.rank; sp.dataset.title = key;
      box.append(sp);
      return;
    }
    const on = _titleFilter === key;
    const b = el('button', 'mem-jchip', titleLabel(key));
    b.type = 'button'; b.dataset.rank = td.rank; b.dataset.title = key;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) { const x = el('span', 'mem-jx', '×'); x.setAttribute('aria-hidden', 'true'); b.append(x); }
    b.onclick = () => {
      _titleFilter = on ? 'all' : key;
      buildJourney(); renderGrid();
      box.querySelector(`[data-title="${key}"]`)?.focus();
    };
    box.append(b);
  });
}

function syncCollab() {
  document.getElementById('collabToggle').setAttribute('aria-pressed', _collabOnly ? 'true' : 'false');
}

function buildGenreFilter() {
  const bar = document.getElementById('genreFilter');
  // Üyelerin türlerinden: en çok kullanılan önce (eşitse alfabetik)
  const freq = new Map();
  _allMembers.forEach(m => new Set((m.genres||[]).filter(Boolean)).forEach(g => freq.set(g, (freq.get(g)||0) + 1)));
  if (_genreFilter && !freq.has(_genreFilter)) _genreFilter = '';
  const has = freq.size > 0;
  bar.hidden = !has;
  document.getElementById('genreSep').hidden = !has;
  document.getElementById('genreLbl').hidden = !has;
  bar.innerHTML = '';
  if (!has) return;
  const all = [...freq.keys()].sort((a, b) => (freq.get(b) - freq.get(a)) || a.localeCompare(b, 'tr'));
  let shown = _genresOpen ? all : all.slice(0, GENRE_LIMIT);
  if (_genreFilter && !shown.includes(_genreFilter)) shown = [...shown, _genreFilter];
  shown.forEach(g => {
    const on = _genreFilter === g;
    const b = el('button', 'be-chip mem-fchip', g);
    b.type = 'button'; b.dataset.genre = g;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.onclick = () => {
      _genreFilter = on ? '' : g;
      buildGenreFilter(); renderGrid();
      [...bar.children].find(x => x.dataset.genre === g)?.focus();
    };
    bar.append(b);
  });
  if (all.length > GENRE_LIMIT) {
    const rest = all.length - shown.length;
    const t = el('button', 'be-chip mem-fchip mem-fmore', _genresOpen ? tt('mem_genres_less') : tt('mem_genres_more').replace('{n}', rest));
    t.type = 'button'; t.dataset.more = '1';
    t.setAttribute('aria-expanded', _genresOpen ? 'true' : 'false');
    t.onclick = () => { _genresOpen = !_genresOpen; buildGenreFilter(); bar.querySelector('[data-more]')?.focus(); };
    if (_genresOpen || rest > 0) bar.append(t);
  }
}

function getVisible() {
  let list = [..._allMembers];
  if (_collabOnly) list = list.filter(m => m.collabStatus === 'open');
  if (_titleFilter !== 'all') list = list.filter(m => m.title === _titleFilter);
  if (_genreFilter) list = list.filter(m => (m.genres||[]).includes(_genreFilter));
  if (_search) {
    const q = _search;
    list = list.filter(m => {
      if ((m.displayName||'').toLowerCase().includes(q)) return true;
      if (m.title && TITLES[m.title] && titleLabel(m.title).toLowerCase().includes(q)) return true;
      if ((m.genres||[]).some(g => String(g).toLowerCase().includes(q))) return true;
      return false;
    });
  }
  const _ts = m => { const j = m.joinedAt; if (!j) return 0; if (typeof j.toMillis==='function') return j.toMillis(); if (typeof j.seconds==='number') return j.seconds*1000; return 0; };
  if (_sort === 'old') list.sort((a,b) => (_ts(a)||Infinity) - (_ts(b)||Infinity));
  else if (_sort === 'az') list.sort((a,b) => (a.displayName||'').localeCompare(b.displayName||'','tr'));
  else list.sort((a,b) => (_ts(b)||0) - (_ts(a)||0));
  return list;
}

  // Ad (kartın tamamını kaplayan profil bağlantısı) + admin etiketi
  const h = el('h2', 'mem-name');
  const a = el('a', 'mem-link', firstName); a.href = `profile?uid=${encodeURIComponent(m._uid)}`;
  h.append(a);
  if (m.email === ADMIN_EMAIL) h.append(el('span', 'mem-admin', tt('mem_admin')));
  li.append(h);

  // Ünvan rozeti
  if (m.title && TITLES[m.title]) {
    const td = TITLES[m.title];
    const p = el('span', 'mem-tpill'); p.dataset.rank = td.rank;
    p.insertAdjacentHTML('beforeend', ic(td.icon));
    p.append(document.createTextNode(titleLabel(m.title)));
    li.append(p);
  }

  const joined = fmtJoined(m.joinedAt);
  if (joined) li.append(el('span', 'mem-joined', joined));

  // Türler (ilk 4 + "+n")
  const genres = (m.genres || []).filter(Boolean);
  if (genres.length) {
    const gw = el('div', 'mem-genres');
    genres.slice(0, 4).forEach(g => gw.append(el('span', 'mem-genre', g)));
    if (genres.length > 4) {
      const more = el('span', 'mem-genre mem-genre--more', `+${genres.length - 4}`);
      more.title = genres.slice(4).join(', ');
      more.setAttribute('aria-label', `${tt('mem_more_genres')}: ${genres.slice(4).join(', ')}`);
      gw.append(more);
    }
    li.append(gw);
  }

  // Sosyal bağlantılar (yeni sekme; karttaki profil bağlantısının üstünde)
  const links = SOCIALS.map(([f, label, full]) => [safeUrl(m[f]), label, full]).filter(x => x[0]);
  if (links.length) {
    const sw = el('div', 'mem-socials');
    links.forEach(([href, label, full]) => {
      const s = el('a', 'be-chip be-chip--link', label);
      s.href = href; s.target = '_blank'; s.rel = 'noopener noreferrer';
      s.setAttribute('aria-label', `${full} — ${firstName} (${tt('mem_social_new')})`);
      sw.append(s);
    });
    li.append(sw);
  }

  // Sayaçlar
  const st = el('div', 'mem-stats');
  const stat = (key, n) => { const s = el('span', '', tt(key) + ' '); s.append(el('b', '', String(n || 0))); return s; };
  const sep = el('span', 'mem-stats-sep', '·'); sep.setAttribute('aria-hidden', 'true');
  st.append(stat('prof_topics', m.postCount), sep, stat('prof_replies', m.replyCount));
  li.append(st);
  return li;
}

function renderGrid() {
  if (!_user) { renderSignedOut(); return; }
  if (_state === 'loading' || _state === 'error') return;
  $grid.removeAttribute('aria-busy');
  $grid.innerHTML = '';
  const visible = getVisible();

  if (!visible.length) {
    const e = el('li', 'be-empty mem-empty');
    e.insertAdjacentHTML('beforeend', '<svg class="icon be-empty-icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-' + (_search ? 'search' : 'users') + '"/></svg>');
    const msg = _search ? `"${_search}" ${tt('mem_no_results')}` : tt('mem_no_filter');
    e.append(el('p', '', msg));
    if (filtersActive()) {
      const b = el('button', 'btn btn-ghost btn-sm', tt('mem_clear_filters')); b.type = 'button';
      b.onclick = () => { clearFilters(); document.getElementById('searchInput').focus(); };
      e.append(b);
    }
    $grid.append(e);
    $status.textContent = msg;
    return;
  }
  const frag = document.createDocumentFragment();
  visible.forEach(m => frag.append(memberCard(m)));
  $grid.append(frag);
  $status.textContent = tt('mem_showing').replace('{n}', visible.length);
}

async function loadMembers() {
  showSkeletons();
  if (_unsubMembers) { _unsubMembers(); _unsubMembers = null; }

  // Konu/yanıt sayıları bir kez (üye ızgarası için gerçek zamanlı gerekmez)
  const [postsSnap, repliesSnap] = await Promise.all([
    db.collection('forum').limit(2000).get().catch(() => null),
    db.collectionGroup('replies').limit(5000).get().catch(() => null),
  ]);
  if (!_user) return;
  _postCounts = {}; _replyCounts = {};
  postsSnap?.docs.forEach(d => { const a = d.data().authorId; if (a) _postCounts[a] = (_postCounts[a]||0)+1; });
  repliesSnap?.docs.forEach(d => { const a = d.data().authorId; if (a) _replyCounts[a] = (_replyCounts[a]||0)+1; });

  _unsubMembers = db.collection('users').limit(200).onSnapshot(snap => {
    _allMembers = snap.docs.map(d => { const obj = d.data(); obj._uid = d.id; obj.postCount = _postCounts[d.id]||0; obj.replyCount = _replyCounts[d.id]||0; return obj; });
    _allMembers.sort((a,b) => (b.joinedAt?.toMillis?.()??0) - (a.joinedAt?.toMillis?.()??0));
    _state = 'ready';
    $count.textContent = snap.size;
    $filters.hidden = false;
    buildJourney();
    buildGenreFilter();
    renderGrid();
  }, err => {
    _errCode = errId();
    console.warn('[members] ' + _errCode, err && err.code);
    renderError();
  });
}

// ── Kontroller ──
const $search = document.getElementById('searchInput');
$search.addEventListener('input', e => { _search = e.target.value.trim().toLowerCase(); renderGrid(); });
$search.addEventListener('keydown', e => { if (e.key === 'Escape' && $search.value) { e.preventDefault(); $search.value = ''; _search = ''; renderGrid(); } });

const sortBtns = [...document.querySelectorAll('#sortSeg [role="radio"]')];
function setSort(v, focus) {
  _sort = v;
  sortBtns.forEach(b => {
    const on = b.dataset.sort === v;
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    if (on && focus) b.focus();
  });
  renderGrid();
}
sortBtns.forEach(b => b.addEventListener('click', () => setSort(b.dataset.sort)));
document.getElementById('sortSeg').addEventListener('keydown', e => {
  const i = sortBtns.findIndex(b => b.dataset.sort === _sort);
  let n = -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (i + 1) % sortBtns.length;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i - 1 + sortBtns.length) % sortBtns.length;
  else if (e.key === 'Home') n = 0;
  else if (e.key === 'End') n = sortBtns.length - 1;
  if (n < 0) return;
  e.preventDefault(); setSort(sortBtns[n].dataset.sort, true);
});

document.getElementById('collabToggle').addEventListener('click', () => { _collabOnly = !_collabOnly; syncCollab(); renderGrid(); });

// Dil değişince JS ile üretilen metinler de yenilenir (eski kanca modül kapsamı yüzünden çalışmıyordu)
if (window._i18n && typeof window._i18n.setLang === 'function') {
  const _origSetLang = window._i18n.setLang;
  window._i18n.setLang = function (l) {
    _origSetLang(l);
    applyPageI18n();
    buildJourney();
    if (_state === 'ready') { buildGenreFilter(); renderGrid(); }
    else if (_state === 'out') renderSignedOut();
    else if (_state === 'error') renderError();
    else $status.textContent = tt('members_loading');
  };
}

applyPageI18n();
buildJourney();
showSkeletons();
window.beShell?.observeAnim?.(document.getElementById('membersMain'));

window.bkAuth.handleRedirectResult();
auth.onAuthStateChanged(user => {
  _user = user;
  updateAuthBar(user);
  initNotifications(user);
  if (user) loadMembers();
  else {
    if (_unsubMembers) { _unsubMembers(); _unsubMembers = null; }
    _allMembers = []; _titleFilter = 'all'; _collabOnly = false; _genreFilter = '';
    syncCollab();
    renderSignedOut(); buildJourney();   // _state 'out' olduktan sonra: çipler düz etiket
  }
});
</script>

<footer class="be-footer" id="beFooter" data-be-footer="compact"></footer>
