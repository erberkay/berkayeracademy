/* ── Members: page layout only. Controls/inputs come from ui.css; nav shell from themes.css. ── */

/* ── Page top bar (<1024; theme-init.js mounts the hamburger inside it) ── */
.topnav { position:fixed; top:0; left:0; right:0; z-index:var(--z-nav); height:var(--topbar-h); display:flex; align-items:center; padding:0 16px; background:var(--bg); border-bottom:1px solid var(--line); }
.topnav-left { display:flex; align-items:center; gap:12px; min-width:0; }

.topnav-sep { color:var(--line); }
.topnav-brand { font-family:var(--ff-mono); font-size:var(--fs-label); letter-spacing:.2em; text-transform:uppercase; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (min-width:1024px) { .topnav { display:none; } }

/* header */
.banner { padding-top:calc(var(--topbar-h) + var(--s5)); border-bottom:1px solid var(--line); }
.banner-inner { max-width:var(--maxw-wide); margin:0 auto; padding:0 var(--gutter) var(--s5); display:flex; align-items:flex-end; gap:var(--s5); }
.banner-info h1 { font-family:var(--ff-disp); font-size:var(--fs-h2); font-weight:400; line-height:var(--lh-tight); color:var(--fg); margin-bottom:6px; }
.banner-info p { font-family:var(--ff-mono); font-size:var(--fs-label); letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); }
.banner-count-wrap { padding-left:var(--s5); border-left:1px solid var(--line); opacity:0; transition:opacity .3s; }
.banner-count-wrap.loaded { opacity:1; }
.banner-count { font-family:var(--ff-disp); font-size:32px; line-height:1; color:var(--accent); }
.banner-count-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); margin-top:4px; }

/* layout + filters */
.layout { max-width:var(--maxw-wide); margin:0 auto; padding:var(--s5) var(--gutter) var(--s8); }
.top-row { display:flex; gap:var(--s3); align-items:center; margin-bottom:var(--s3); flex-wrap:wrap; }
.search-wrap { position:relative; flex:1; min-width:220px; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--fg-3); pointer-events:none; display:flex; }
.search-icon .icon { width:16px; height:16px; }
.search-wrap .search-input { padding-left:38px; }
.top-row .sort-select { width:auto; flex:0 0 auto; min-width:180px; }
.filter-bar { display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
.filter-bar .fbtn.collab-active { border-color:var(--ok); color:var(--ok); background:var(--ok-soft); }

/* member cards */
.members-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(260px,100%), 1fr)); gap:var(--s4); }
.mcard { background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; text-decoration:none; color:inherit; transition:border-color .15s; }
.mcard:hover { border-color:var(--fg-3); }
.mcard-cover { height:56px; background:var(--surface-2); border-bottom:1px solid var(--line); position:relative; }
.mcard-av-wrap { position:absolute; bottom:-28px; left:var(--s4); }
.mcard-av, .mcard-av-ph { width:56px; height:56px; border-radius:50%; object-fit:cover; border:3px solid var(--surface); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:var(--ff-mono); font-size:var(--fs-body); color:var(--accent); }
.mcard-body { padding:36px var(--s4) var(--s3); flex:1; display:flex; flex-direction:column; gap:4px; }
.mcard-name-row { display:flex; align-items:center; gap:8px; }
.mcard-name { font-size:var(--fs-body); font-weight:600; color:var(--fg); }
.is-admin::after { content:'admin'; margin-left:6px; font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); }
.mcard-collab { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mcard-collab.open { background:var(--ok); }
.mcard-collab.busy { background:var(--err); }
.mcard-title { display:flex; align-items:center; gap:5px; font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; }
.mcard-title .icon { width:12px; height:12px; }
.mcard-joined { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--fg-3); margin-top:2px; }
.mcard-genres { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.mcard-genre { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line); color:var(--fg-2); }
.mcard-genre.more { color:var(--fg-3); }
.mcard-socials { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.mcard-social { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--line); color:var(--fg-2); text-decoration:none; transition:color .15s, border-color .15s; }
.mcard-social:hover { border-color:var(--fg); color:var(--fg); }
.mcard-footer { display:flex; gap:var(--s5); padding:var(--s3) var(--s4); border-top:1px solid var(--line); margin-top:auto; }
.mcard-stat { display:flex; flex-direction:column-reverse; font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); }
.mcard-stat span { font-family:var(--ff-disp); font-size:20px; color:var(--fg); line-height:1.1; margin-bottom:2px; }
.empty-state { text-align:center; padding:var(--s8) var(--s4); color:var(--fg-3); font-size:var(--fs-small); grid-column:1/-1; }

/* skeleton */
@keyframes skelPulse { 50% { opacity:.45; } }
.skel { background:var(--surface-2); animation:skelPulse 1.2s ease-in-out infinite; }
.mcard-skel { background:var(--surface); border:1px solid var(--line); overflow:hidden; }
.mcard-skel-cover { height:56px; background:var(--surface-2); border-bottom:1px solid var(--line); position:relative; }
.skel-av { position:absolute; bottom:-20px; left:16px; width:40px; height:40px; border-radius:50%; border:3px solid var(--surface); }
.skel-body { padding:30px 16px 16px; display:flex; flex-direction:column; gap:8px; }
.skel-line { height:12px; width:60%; }
.skel-line.w40 { width:40%; }
.skel-line.w75 { width:75%; }

@media (max-width:600px) {
  .banner-inner { padding-bottom:var(--s4); }
  .search-wrap { min-width:0; flex:1 1 100%; }
  .top-row .sort-select { flex:1; min-width:0; }
}
@media (min-width:1024px) { .banner { padding-top:var(--s6); } }

<script type="module">
'use strict';
const ADMIN_EMAIL = 'berkayer032@gmail.com';

firebase.initializeApp({
  apiKey:            "AIzaSyDX8AkwDejrkh5L4xUXQcmzKq-DYvc2E8A",
  authDomain:        "ableton-tutorial.firebaseapp.com",
  projectId:         "ableton-tutorial",
  storageBucket:     "ableton-tutorial.firebasestorage.app",
  messagingSenderId: "677640687230",
  appId:             "1:677640687230:web:8c6a2dfefbf55c69ffd22f",
});
const auth = firebase.auth();
const db   = firebase.firestore();
let _user = null;

function errId() { return '#' + Math.random().toString(36).slice(2,5).toUpperCase(); }
const ic = n => '<svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-' + n + '"/></svg>';
function doSignIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/internal-error') { auth.signInWithRedirect(provider); }
  });
}

const TITLES = {
  acemi:   { label: window._i18n?.t('mem_acemi')||'Acemi',                 icon:'seed',       color:'var(--ok)' },
  merakli: { label: window._i18n?.t('mem_merakli')||'Prodüksiyon Meraklısı', icon:'headphones', color:'var(--info)' },
  uretici: { label: window._i18n?.t('mem_uretici')||'Üretici',               icon:'knobs',      color:'var(--accent)' },
  veteran: { label: window._i18n?.t('mem_veteran')||'Veteran',               icon:'flame',      color:'var(--warn)' },
  usta:    { label: window._i18n?.t('mem_usta')||'Usta',                  icon:'bolt',       color:'var(--err)' },
  efsane:  { label: window._i18n?.t('mem_efsane')||'Efsane',               icon:'crown',      color:'var(--accent)' },
};

function fmtJoined(ts) {
  if (!ts) return null;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  var lang = window._i18n ? window._i18n.getLang() : 'tr';
  if (lang === 'en') return (window._i18n?.t('mem_joined_since')||'member since') + ' ' + d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  return d.toLocaleDateString('tr-TR', { month:'long', year:'numeric' }) + "'dan beri üye";
}

let _notifUnsub = null, _annUnsub = null;
let _notifPanelEl = null;
let _personalNotifs = [], _announcements = [], _annSeenAt = null, _dismissedAnns = [];

function updateAuthBar(user) {
  const bar = document.getElementById('authBar'); bar.innerHTML = '';
  _notifPanelEl = null;
  if (user) {
    const wrap = document.createElement('div'); wrap.className = 'auth-user-wrap';
    const img  = document.createElement('img');  img.className = 'auth-avatar';
      const _bnavAv = document.getElementById('bnavProfileAv');
      const _bnavAdmin = document.getElementById('bnavAdminItem');
      if (_bnavAdmin) _bnavAdmin.style.display = 'flex';
      if (_bnavAv) { if (user.photoURL) { const _ai=document.createElement('img');_ai.src=user.photoURL;_ai.alt='';_bnavAv.innerHTML='';_bnavAv.append(_ai); } else { _bnavAv.textContent='👤'; } }
    img.src = user.photoURL || ''; img.alt = '';
    const name = document.createElement('span'); name.className = 'auth-name';
    name.textContent = user.email === ADMIN_EMAIL ? 'Admin' : (user.displayName?.split(' ')[0] || (window._i18n?.t('ui_member')||'Üye'));
    const out = document.createElement('button'); out.className = 'auth-out-btn';
    out.textContent = '✕'; out.onclick = () => auth.signOut();
    wrap.append(img, name, out);

    const bellWrap = document.createElement('div'); bellWrap.className = 'notif-bell-wrap';
    const bell = document.createElement('button'); bell.className = 'notif-bell'; bell.innerHTML = ic('bell'); bell.title = window._i18n?.t('ui_notifications')||'Bildirimler';
    const badge = document.createElement('span'); badge.className = 'notif-badge'; badge.style.display = 'none';
    _notifPanelEl = document.createElement('div'); _notifPanelEl.className = 'notif-panel';
    _notifPanelEl.innerHTML = '<div class="notif-panel-head"><span class="notif-panel-title">'+(window._i18n?.t('ui_notifications')||'Bildirimler')+'</span><button class="notif-read-all">'+(window._i18n?.t('ui_read_all')||'Tümünü Oku')+'</button></div><div class="notif-list"></div>';
    _notifPanelEl.querySelector('.notif-read-all').onclick = () => markAllNotifRead(user.uid);
    bell.onclick = e => { e.stopPropagation(); toggleNotifPanel(user); };
    bellWrap.append(bell, badge, _notifPanelEl);
    bar.append(bellWrap, wrap);
    document.addEventListener('click', () => { if (_notifPanelEl) _notifPanelEl.classList.remove('open'); }, { once: true });
  } else {
    const btn = document.createElement('button'); btn.className = 'auth-sign-btn';
    btn.textContent = window._i18n?.t('ui_signin')||'Google ile Giriş'; btn.onclick = doSignIn;
    bar.append(btn);
  }
}

function toggleNotifPanel(user) {
  if (!_notifPanelEl) return;
  const isOpen = _notifPanelEl.classList.contains('open');
  if (isOpen) { _notifPanelEl.classList.remove('open'); return; }
  _notifPanelEl.classList.add('open');
  setTimeout(() => document.addEventListener('click', () => { if (_notifPanelEl) _notifPanelEl.classList.remove('open'); }, { once: true }), 0);
  markAllNotifRead(user.uid);
}

function _mergeNotifs(uid) {
  const all = [
    ..._personalNotifs.map(n => ({...n, _t:'p'})),
    ..._announcements.filter(n => !_dismissedAnns.includes(n._id)).map(n => ({...n, _t:'a'}))
  ].sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
  const annSec = _annSeenAt?.seconds || 0;
  const unread = _personalNotifs.filter(n => !n.read).length
    + _announcements.filter(n => (n.createdAt?.seconds||0) > annSec).length;
  const badge = document.querySelector('.notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.style.display = unread > 0 ? 'block' : 'none'; }
  if (_notifPanelEl) {
    const list = _notifPanelEl.querySelector('.notif-list'); if (!list) return;
    list.innerHTML = '';
    if (!all.length) { list.innerHTML = '<div class="notif-empty">'+(window._i18n?.t('ui_no_notifs')||'Bildirim yok')+'</div>'; return; }
    all.forEach(n => {
      const isUnread = n._t==='p' ? !n.read : (n.createdAt?.seconds||0) > annSec;
      const item = document.createElement('div'); item.className = 'notif-item' + (isUnread ? ' unread' : '');
      const icon = n._t==='a' ? '📢 ' : '';
      const _loc = window._i18n?.getLang()==='en'?'en-US':'tr-TR';
      const timeStr = n.createdAt ? n.createdAt.toDate().toLocaleDateString(_loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const _nt=document.createElement('div');_nt.className='notif-item-text';_nt.textContent=icon+(n.text||(window._i18n?.t('ui_new_notif')||'Yeni bildirim'));const _ni=document.createElement('div');_ni.className='notif-item-time';_ni.textContent=timeStr;item.append(_nt,_ni);
      if (n.postId) item.onclick = () => { location.href = `post?id=${n.postId}`; };
      if (n._id) {
        const del = document.createElement('button'); del.className = 'notif-del-btn'; del.textContent = '×'; del.title = 'Sil';
        del.onclick = e => {
          e.stopPropagation();
          if (n._t === 'p') {
            db.collection('notifications').doc(uid).collection('items').doc(n._id).delete();
          } else {
            if (!_dismissedAnns.includes(n._id)) { _dismissedAnns.push(n._id); }
            db.collection('users').doc(uid).update({ dismissedAnns: firebase.firestore.FieldValue.arrayUnion(n._id) }).catch(() => {});
            _announcements = _announcements.filter(a => a._id !== n._id);
            _mergeNotifs(uid);
          }
        };
        item.append(del);
      }
      list.append(item);
    });
  }
}

function markAllNotifRead(uid) {
  db.collection('notifications').doc(uid).collection('items')
    .where('read', '==', false).get().then(snap => {
      const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { read: true })); batch.commit();
    }).catch(() => {});
  db.collection('users').doc(uid).set({ announcementsSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
  _annSeenAt = { seconds: Date.now() / 1000 };
  _personalNotifs = _personalNotifs.map(n => ({...n, read: true}));
  _mergeNotifs(uid);
}

function initNotifications(user) {
  if (_notifUnsub) { _notifUnsub(); _notifUnsub = null; }
  if (_annUnsub) { _annUnsub(); _annUnsub = null; }
  _personalNotifs = []; _announcements = []; _annSeenAt = null; _dismissedAnns = [];
  if (!user) return;
  db.collection('users').doc(user.uid).get().then(d => {
    _annSeenAt = d.data()?.announcementsSeenAt || null;
    _dismissedAnns = d.data()?.dismissedAnns || [];
    _mergeNotifs(user.uid);
  }).catch(() => {});
  _notifUnsub = db.collection('notifications').doc(user.uid).collection('items')
    .orderBy('createdAt', 'desc').limit(20)
    .onSnapshot(snap => {
      _personalNotifs = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (snap.docs.length > 4) snap.docs.slice(4).forEach(d => d.ref.delete());
      _mergeNotifs(user.uid);
    }, () => {});
  _annUnsub = db.collection('announcements').orderBy('createdAt', 'desc').limit(15)
    .onSnapshot(snap => { _announcements = snap.docs.map(d => ({...d.data(), _id: d.id})); _mergeNotifs(user.uid); }, () => {});
}

let _allMembers = [];
let _titleFilter = 'all';
let _genreFilter = '';
let _unsubMembers = null;
let _postCounts = {}, _replyCounts = {};
let _search = '';
let _sort = 'new';

function showSkeletons() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div'); s.className = 'mcard-skel';
    s.innerHTML = `
      <div class="mcard-skel-cover"><div class="skel skel-av"></div></div>
      <div class="skel-body">
        <div class="skel skel-line"></div>
        <div class="skel skel-line w40"></div>
        <div class="skel skel-line w75"></div>
      </div>`;
    grid.append(s);
  }
}

function buildFilters() {
  const bar = document.getElementById('titleFilter'); bar.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'fbtn' + (_titleFilter === 'all' ? ' active' : '');
  all.textContent = window._i18n?.t('mem_all')||'Tümü';
  all.onclick = () => { _titleFilter = 'all'; buildFilters(); renderGrid(); };
  bar.append(all);

  Object.entries(TITLES).forEach(([key, td]) => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (_titleFilter === key ? ' active' : '');
    b.innerHTML = ic(td.icon) + ' ' + (window._i18n?.t('mem_' + key) || td.label);
    b.onclick = () => { _titleFilter = key; buildFilters(); renderGrid(); };
    bar.append(b);
  });

  const openBtn = document.createElement('button');
  openBtn.className = 'fbtn' + (_titleFilter === 'collab_open' ? ' collab-active' : '');
  openBtn.textContent = window._i18n?.t('mem_collab_open')||'Projeye Açık';
  openBtn.onclick = () => { _titleFilter = 'collab_open'; buildFilters(); renderGrid(); };
  bar.append(openBtn);
}

function buildGenreFilter() {
  const bar = document.getElementById('genreFilter');
  const genreSet = new Set();
  _allMembers.forEach(m => (m.genres||[]).forEach(g => genreSet.add(g)));
  if (genreSet.size === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex'; bar.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'fbtn' + (_genreFilter === '' ? ' active' : '');
  allBtn.textContent = window._i18n?.t('mem_all_genres')||'Tüm Genreler';
  allBtn.onclick = () => { _genreFilter = ''; buildGenreFilter(); renderGrid(); };
  bar.append(allBtn);
  [...genreSet].sort().forEach(g => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (_genreFilter === g ? ' active' : '');
    b.textContent = g;
    b.onclick = () => { _genreFilter = g; buildGenreFilter(); renderGrid(); };
    bar.append(b);
  });
}

function getVisible() {
  let list = [..._allMembers];
  if (_titleFilter === 'collab_open') list = list.filter(m => m.collabStatus === 'open');
  else if (_titleFilter !== 'all') list = list.filter(m => m.title === _titleFilter);
  if (_genreFilter) list = list.filter(m => (m.genres||[]).includes(_genreFilter));
  if (_search) {
    list = list.filter(m => {
      const q = _search;
      if ((m.displayName||'').toLowerCase().includes(q)) return true;
      if (m.title && TITLES[m.title]?.label.toLowerCase().includes(q)) return true;
      if ((m.genres||[]).some(g => g.toLowerCase().includes(q))) return true;
      return false;
    });
  }
  const _ts = m => { const j = m.joinedAt; if (!j) return 0; if (typeof j.toMillis==='function') return j.toMillis(); if (typeof j.seconds==='number') return j.seconds*1000; return 0; };
  if (_sort === 'old') list.sort((a,b) => (_ts(a)||Infinity) - (_ts(b)||Infinity));
  else if (_sort === 'az') list.sort((a,b) => (a.displayName||'').localeCompare(b.displayName||'','tr'));
  else list.sort((a,b) => (_ts(b)||0) - (_ts(a)||0));
  return list;
}

function renderGrid() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  const visible = getVisible();

  if (!visible.length) {
    const e = document.createElement('div'); e.className = 'empty-state';
    if (_search) {
      const msg = document.createElement('div');
      msg.textContent = '"' + _search + '" ' + (window._i18n?.t('mem_no_results')||'için sonuç bulunamadı.');
      e.append(msg);
    } else {
      e.textContent = window._i18n?.t('mem_no_filter')||'Bu kriterlerde üye yok.';
    }
    grid.append(e); return;
  }

  visible.forEach(m => {
    const card = document.createElement('a'); card.className = 'mcard'; card.href = `profile?uid=${m._uid}`;

    // Cover + avatar
    const cover = document.createElement('div'); cover.className = 'mcard-cover';
    const avWrap = document.createElement('div'); avWrap.className = 'mcard-av-wrap';
    const cardPhoto = m.customPhotoURL || m.photoURL;
    if (cardPhoto) {
      const img = document.createElement('img'); img.className = 'mcard-av'; img.src = cardPhoto; img.alt = '';
      avWrap.append(img);
    } else {
      const ph = document.createElement('div'); ph.className = 'mcard-av-ph';
      ph.textContent = (m.displayName?.trim() || m.email?.split('@')[0] || '?')[0].toUpperCase();
      avWrap.append(ph);
    }
    cover.append(avWrap); card.append(cover);

    // Body
    const body = document.createElement('div'); body.className = 'mcard-body';

    // Name + collab dot
    const nameRow = document.createElement('div'); nameRow.className = 'mcard-name-row';
    const nm = document.createElement('div');
    nm.className = 'mcard-name' + (m.email === ADMIN_EMAIL ? ' is-admin' : '');
    nm.textContent = (m.displayName?.trim() || m.email?.split('@')[0] || (window._i18n?.t('ui_member')||'Üye')).split(' ')[0];
    nameRow.append(nm);
    if (m.collabStatus === 'open' || m.collabStatus === 'busy') {
      const dot = document.createElement('div');
      dot.className = 'mcard-collab ' + m.collabStatus;
      dot.title = m.collabStatus === 'open' ? (window._i18n?.t('mem_collab_open')||'Projeye Açık') : (window._i18n?.t('mem_collab_busy')||'Meşgul');
      nameRow.append(dot);
    }
    body.append(nameRow);

    // Title
    if (m.title && TITLES[m.title]) {
      const td = TITLES[m.title];
      const ts = document.createElement('div'); ts.className = 'mcard-title';
      ts.style.color = td.color;
      ts.innerHTML = ic(td.icon) + '<span>' + (window._i18n?.t('mem_' + m.title) || td.label) + '</span>';
      body.append(ts);
    }

    // Join date
    const joined = fmtJoined(m.joinedAt);
    if (joined) {
      const jd = document.createElement('div'); jd.className = 'mcard-joined';
      jd.textContent = joined;
      body.append(jd);
    }

    // Genres
    if (m.genres?.length) {
      const gw = document.createElement('div'); gw.className = 'mcard-genres';
      m.genres.slice(0,4).forEach(g => {
        const tag = document.createElement('span'); tag.className = 'mcard-genre'; tag.textContent = g;
        gw.append(tag);
      });
      if (m.genres.length > 4) {
        const more = document.createElement('span'); more.className = 'mcard-genre more';
        more.textContent = `+${m.genres.length - 4}`; gw.append(more);
      }
      body.append(gw);
    }

    // Social links
    if (m.instagram || m.spotify || m.soundcloudUrl || m.mixcloudUrl) {
      const sw = document.createElement('div'); sw.className = 'mcard-socials';
      if (m.instagram) {
        const ig = document.createElement('a'); ig.className = 'mcard-social ig';
        ig.href = m.instagram; ig.target = '_blank'; ig.rel = 'noopener';
        ig.textContent = 'IG'; ig.onclick = e => e.stopPropagation();
        sw.append(ig);
      }
      if (m.spotify) {
        const sp = document.createElement('a'); sp.className = 'mcard-social sp';
        sp.href = m.spotify; sp.target = '_blank'; sp.rel = 'noopener';
        sp.textContent = 'Spotify'; sp.onclick = e => e.stopPropagation();
        sw.append(sp);
      }
      if (m.soundcloudUrl) {
        const sc = document.createElement('a'); sc.className = 'mcard-social sc';
        sc.href = m.soundcloudUrl; sc.target = '_blank'; sc.rel = 'noopener';
        sc.textContent = 'SC'; sc.onclick = e => e.stopPropagation();
        sw.append(sc);
      }
      if (m.mixcloudUrl) {
        const mc = document.createElement('a'); mc.className = 'mcard-social mc';
        mc.href = m.mixcloudUrl; mc.target = '_blank'; mc.rel = 'noopener';
        mc.textContent = 'MC'; mc.onclick = e => e.stopPropagation();
        sw.append(mc);
      }
      body.append(sw);
    }

    card.append(body);

    // Footer
    const footer = document.createElement('div'); footer.className = 'mcard-footer';
    const ps = document.createElement('div'); ps.className = 'mcard-stat';
    ps.innerHTML = `${window._i18n?.t('prof_topics')||'Konu'} <span>${m.postCount||0}</span>`;
    const rs = document.createElement('div'); rs.className = 'mcard-stat';
    rs.innerHTML = `${window._i18n?.t('prof_replies')||'Yanıt'} <span>${m.replyCount||0}</span>`;
    footer.append(ps, rs); card.append(footer);

    grid.append(card);
  });
}

async function loadMembers() {
  showSkeletons();
  if (_unsubMembers) { _unsubMembers(); _unsubMembers = null; }

  // Fetch counts once (posts/replies don't need real-time for member grid)
  const [postsSnap, repliesSnap] = await Promise.all([
    db.collection('forum').limit(2000).get().catch(() => null),
    db.collectionGroup('replies').limit(5000).get().catch(() => null),
  ]);
  _postCounts = {}; _replyCounts = {};
  postsSnap?.docs.forEach(d => { const a = d.data().authorId; if (a) _postCounts[a] = (_postCounts[a]||0)+1; });
  repliesSnap?.docs.forEach(d => { const a = d.data().authorId; if (a) _replyCounts[a] = (_replyCounts[a]||0)+1; });

  _unsubMembers = db.collection('users').limit(200).onSnapshot(snap => {
    _allMembers = snap.docs.map(d => { const obj = d.data(); obj._uid = d.id; obj.postCount = _postCounts[d.id]||0; obj.replyCount = _replyCounts[d.id]||0; return obj; });
    _allMembers.sort((a,b) => (b.joinedAt?.toMillis?.()??0) - (a.joinedAt?.toMillis?.()??0));

    document.getElementById('memberCount').textContent = snap.size;
    document.getElementById('memberCountWrap').classList.add('loaded');

    buildFilters();
    buildGenreFilter();
    renderGrid();
  });
}

document.getElementById('searchInput').oninput = e => {
  _search = e.target.value.trim().toLowerCase();
  renderGrid();
};
document.getElementById('sortSelect').onchange = e => {
  _sort = e.target.value;
  renderGrid();
};

auth.getRedirectResult().catch(e => console.error("redirectResult:", e));
auth.onAuthStateChanged(user => {
  _user = user;
  updateAuthBar(user);
  initNotifications(user);
  if (user) loadMembers();
});
</script>

<script>
(function() {
  function init() {
    if (window._i18n) {
      var _orig = window._i18n.setLang;
      window._i18n.setLang = function(l) {
        _orig(l);
        if (typeof buildFilters === 'function') buildFilters();
        if (typeof buildGenreFilter === 'function') buildGenreFilter();
        if (typeof renderGrid === 'function') renderGrid();
      };
    }
  }
  // membersLangHook
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
