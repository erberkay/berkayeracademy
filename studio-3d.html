<style>
html, body { height: 100%; }
@supports (height: 100dvh) { body.s3d-page { height: 100dvh; } }
body.s3d-page { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg-ink); }
.s3d { position: relative; flex: 1 1 auto; min-height: 0; background: var(--bg-ink); }
.s3d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }

.s3d-tags { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.s3d-tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: var(--s2); pointer-events: auto; cursor: pointer; padding: 0; border: 0; background: none; color: var(--fg); font: inherit; opacity: 0; transition: opacity .25s; will-change: transform; }
.s3d-tag.is-on { opacity: 1; }
.s3d-tag-dot { width: 10px; height: 10px; border: 2px solid var(--accent); background: var(--bg-ink); flex: 0 0 auto; }
.s3d-tag-txt { font-size: var(--fs-label); letter-spacing: .04em; padding: var(--s1) var(--s2); background: var(--bg-ink); border: 1px solid var(--line); white-space: nowrap; }
.s3d-tag:hover .s3d-tag-txt, .s3d-tag:focus-visible .s3d-tag-txt { border-color: var(--accent); color: var(--accent); }
.s3d.no-tags .s3d-tags { display: none; }
.s3d-tag--track .s3d-tag-dot { border-color: #1db954; }
.s3d-player { position: absolute; right: var(--page-x); bottom: calc(var(--s4) + 96px); width: min(380px, calc(100% - 2 * var(--page-x))); z-index: 4; background: var(--bg-ink); border: 1px solid var(--line); padding: var(--s2); }
.s3d-player iframe { display: block; border: 0; width: 100%; }
.s3d-player-close { margin: 0; }
/* küçük oynatıcı: müzik çalarken yalnız başlık + Durdur/Büyüt; gömülü oynatıcı görünmez ama çalışır */
.s3d-mini { display: none; align-items: center; gap: var(--s2); }
.s3d-player.is-mini { width: auto; max-width: calc(100% - 2 * var(--page-x)); padding: var(--s1) var(--s1) var(--s1) var(--s3); }
.s3d-player.is-mini .s3d-mini { display: flex; }
.s3d-player.is-mini .s3d-player-close, .s3d-player.is-mini .s3d-player-hint { display: none; }

.s3d-player.is-mini .s3d-mini-full { display: none; }
.s3d-mini-t { font-size: var(--fs-small); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch; }
.s3d-eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.s3d-eq i { width: 3px; height: 4px; background: var(--accent); }
.s3d-player.is-playing .s3d-eq i { animation: s3dEq .9s ease-in-out infinite; }
.s3d-player.is-playing .s3d-eq i:nth-child(2) { animation-delay: -.3s; }
.s3d-player.is-playing .s3d-eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes s3dEq { 0%, 100% { height: 4px; } 50% { height: 14px; } }

.s3d-player-hint { margin: 0 0 var(--s2); font-size: var(--fs-micro); color: var(--fg-2); }
/* dokunmatik yürüme kolu: başparmakla sürükle, kol yönünde yürür */
.s3d-joy { position: absolute; left: var(--page-x); bottom: calc(var(--s4) + 104px); z-index: 3; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg-ink); opacity: .9; touch-action: none; }
.s3d-joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--accent); pointer-events: none; }

.s3d-joy b:nth-of-type(1) { top: 8px; left: 50%; transform: translateX(-50%); }

.s3d-joy b:nth-of-type(3) { left: 9px; top: 50%; transform: translateY(-50%); }
.s3d-joy b:nth-of-type(4) { right: 9px; top: 50%; transform: translateY(-50%); }
.s3d-joy span { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); font-size: var(--fs-label); letter-spacing: .08em; color: var(--fg); white-space: nowrap; pointer-events: none; }
.s3d-joy.is-on { opacity: 1; }

.s3d-top { position: absolute; left: var(--page-x); right: var(--page-x); top: var(--s4); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4); pointer-events: none; }
.s3d-top > * { pointer-events: auto; }
.s3d-title { margin: 0; font-family: var(--font-serif, 'Instrument Serif', serif); font-weight: 400; font-size: var(--fs-h3); line-height: 1.1; color: var(--fg); }
.s3d-sub { margin: var(--s1) 0 0; font-size: var(--fs-small); color: var(--fg-2); max-width: 34ch; }
.s3d-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); }
.s3d-leds { display: inline-flex; align-items: center; gap: var(--s2); }
.s3d-led { width: var(--ctl-md); height: var(--ctl-md); padding: 0; border: 1px solid var(--line); background: var(--bg-ink); display: inline-grid; place-items: center; cursor: pointer; }
.s3d-led i { width: 14px; height: 14px; display: block; background: var(--c); }
.s3d-led[aria-pressed="true"] { border-color: var(--fg); }

.s3d-bottom { position: absolute; left: var(--page-x); right: var(--page-x); bottom: var(--s4); display: flex; flex-direction: column; align-items: center; gap: var(--s3); pointer-events: none; }
.s3d-bottom > * { pointer-events: auto; }
.s3d-wps { display: flex; flex-wrap: wrap; justify-content: center; max-width: 100%; background: var(--bg-ink); }
.s3d-hint { margin: 0; font-size: var(--fs-micro); letter-spacing: .06em; color: var(--fg-3); text-align: center; }

.s3d-load { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg-ink); z-index: 5; transition: opacity .6s; }
.s3d-load.is-done { opacity: 0; pointer-events: none; }
.s3d-load-in { text-align: center; padding: var(--s6); }
.s3d-load-bar { width: 220px; height: 2px; margin: var(--s4) auto 0; background: var(--line); overflow: hidden; }
.s3d-load-bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: s3dBar 1.1s ease-in-out infinite; }
@keyframes s3dBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.s3d-err { max-width: 36ch; color: var(--fg-2); }

@media (max-width: 600px) {
  .s3d-player { left: calc(var(--page-x) + 112px + var(--s3)); right: var(--page-x); width: auto; }
  .s3d-sub { display: none; }
  .s3d-top { flex-direction: column; align-items: flex-start; gap: var(--s2); }
  .s3d-tools { justify-content: flex-start; }
  .s3d-wps { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .s3d-load-bar i { animation: none; width: 100%; } .s3d-tag { transition: none; } }
