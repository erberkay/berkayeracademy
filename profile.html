<script type="module">
'use strict';
const ADMIN_EMAIL = 'berkayer032@gmail.com';
const profileUid  = new URLSearchParams(location.search).get('uid');

firebase.initializeApp({
  apiKey:            "AIzaSyDX8AkwDejrkh5L4xUXQcmzKq-DYvc2E8A",
  authDomain:        "berkayeracademy.com",
  projectId:         "ableton-tutorial",
  storageBucket:     "ableton-tutorial.firebasestorage.app",
  messagingSenderId: "677640687230",
  appId:             "1:677640687230:web:8c6a2dfefbf55c69ffd22f",
});
const auth = firebase.auth();
const db   = firebase.firestore();
let _user = null;

function doSignIn() { window.bkAuth.openLogin(); }
function isAdmin(u) { return u?.email === ADMIN_EMAIL; }

function _getTitleLabel(key) {
  return window._i18n?.t('prof_title_' + key) || key;
}
const TITLES = [
  { key:'none',    labelTr:'Ünvan Yok',             labelEn:'No Title',                  icon:'',           color:'var(--fg-3)' },
  { key:'acemi',   labelTr:'Acemi',                 labelEn:'Beginner',                  icon:'seed',       color:'var(--ok)' },
  { key:'merakli', labelTr:'Prodüksiyon Meraklısı', labelEn:'Production Enthusiast',     icon:'headphones', color:'var(--info)' },
  { key:'uretici', labelTr:'Üretici',               labelEn:'Producer',                  icon:'knobs',      color:'var(--accent)' },
  { key:'veteran', labelTr:'Veteran',               labelEn:'Veteran',                   icon:'flame',      color:'var(--warn)' },
  { key:'usta',    labelTr:'Usta',                  labelEn:'Master',                    icon:'bolt',       color:'var(--err)' },
  { key:'efsane',  labelTr:'Efsane',                labelEn:'Legend',                    icon:'crown',      color:'var(--accent)' },
];

function showToast(msg, type='success', ms=3000) {
  let c = document.getElementById('toastCt');
  if (!c) { c = document.createElement('div'); c.id='toastCt'; c.className='toast-container'; document.body.append(c); }
  const t = document.createElement('div'); t.className='toast'+(type!=='success'?' '+type:''); t.textContent=msg;
  c.append(t);
  setTimeout(() => { t.style.cssText='opacity:0;transform:translateY(8px);transition:.2s;'; setTimeout(()=>t.remove(),200); }, ms);
}
function errId() { return '#' + Math.random().toString(36).slice(2,5).toUpperCase(); }
const ic = n => '<svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-' + n + '"/></svg>';
function fmtDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const loc = window._i18n?.getLang() === 'en' ? 'en-US' : 'tr-TR';
  return d.toLocaleDateString(loc, {month:'long', year:'numeric'});
}
function fmtDateTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const loc = window._i18n?.getLang() === 'en' ? 'en-US' : 'tr-TR';
  return d.toLocaleDateString(loc, {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

// ── Chat Panel ─────────────────────────────────────────────────────
function _chatId(a, b) { return [a, b].sort().join('_'); }
// Sohbet paneli 1400px altinda cekmece olarak acilir (CSS ile ayni esik)
const _chatOverlay = () => window.matchMedia('(max-width:1399px)').matches;

function _playMsgSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

let _chatListUnsub = null, _msgUnsub = null;
let _activeChatId = null, _activeChatOther = null;
let _chatPanelEl = null, _chatThreadsEl = null, _chatMsgsEl = null, _chatMainEl = null;

async function _sendMsg(fromUid, fromName, fromPhoto, toUid, toName, toPhoto, text) {
  if (fromUid === toUid) throw new Error(window._i18n?.getLang()==='en' ? 'You cannot message yourself.' : 'Kendinize mesaj gönderemezsiniz.');
  const cid = _chatId(fromUid, toUid);
  const chatRef = db.collection('chats').doc(cid);
  const msgRef = chatRef.collection('messages').doc();
  const batch = db.batch();
  batch.set(chatRef, {
    participants:[fromUid,toUid],
    names:{[fromUid]:fromName,[toUid]:toName},
    photos:{[fromUid]:fromPhoto||'',[toUid]:toPhoto||''},
    lastMessage:text.slice(0,100),
    lastAt:firebase.firestore.FieldValue.serverTimestamp(),
    unreadBy:firebase.firestore.FieldValue.arrayUnion(toUid),
  }, { merge:true });
  batch.set(msgRef, {
    fromUid,
    text:text.slice(0,2000),
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
  await batch.commit();
  db.collection('notifications').doc(toUid).collection('items').add({
    text:`${fromName}: ${text.slice(0,60)}${text.length>60?'…':''}`,
    read:false, fromUid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(()=>{});
}

function _mkAvEl(photo, name, cls) {
  const av = document.createElement('div'); av.className = cls;
  if (photo) { const i = document.createElement('img'); i.src = photo; av.append(i); }
  else av.textContent = (name||'?')[0].toUpperCase();
  return av;
}

function _openThread(cid, otherId, otherName, otherPhoto) {
  if (!_chatMainEl || !_chatMsgsEl) return;
  _activeChatId = cid; _activeChatOther = { uid:otherId, name:otherName, photo:otherPhoto||null };
  // Mark sidebar active
  _chatThreadsEl?.querySelectorAll('.chat-thread').forEach(t => t.classList.toggle('active', t.dataset.cid===cid));
  // Header
  _chatMainEl.querySelector('.chat-main-hdr').innerHTML = '';
  const hdr = _chatMainEl.querySelector('.chat-main-hdr');
  hdr.append(_mkAvEl(otherPhoto, otherName, 'chat-main-av'));
  const nm = document.createElement('div'); nm.className = 'chat-main-name'; nm.textContent = otherName; hdr.append(nm);
  // Collab button in header (only when chatting with another user, not self)
  if (_user && otherId && otherId !== _user.uid) {
    const collabHdrBtn = document.createElement('button');
    collabHdrBtn.className = 'btn btn-sm btn-ghost chat-collab-btn';
    collabHdrBtn.textContent = 'Collab';
    collabHdrBtn.title = window._i18n?.t('prof_collab_tooltip')||'Collab isteği gönder';
    collabHdrBtn.onclick = async () => {
      collabHdrBtn.disabled = true; collabHdrBtn.textContent = '…';
      try {
        const fromName = _user.displayName?.split(' ')[0] || 'Biri';
        const fromPhoto = _user.photoURL || '';
        const chatRef = db.collection('chats').doc(cid);
        // Check for existing pending collab request
        const existingSnap = await chatRef.collection('messages').where('type','==','collab_request').where('status','==','pending').limit(1).get();
        if (!existingSnap.empty) {
          showToast(window._i18n?.t('prof_collab_exists')||'Zaten bekleyen bir collab isteği var.', 'info');
          collabHdrBtn.disabled = false; collabHdrBtn.textContent = 'Collab';
          return;
        }
        const batch = db.batch();
        batch.set(chatRef, {
          participants:[_user.uid, otherId], names:{[_user.uid]:fromName,[otherId]:otherName},
          photos:{[_user.uid]:fromPhoto,[otherId]:otherPhoto||''},
          lastMessage:'Collab isteği', lastAt:firebase.firestore.FieldValue.serverTimestamp(),
          unreadBy:firebase.firestore.FieldValue.arrayUnion(otherId),
        }, { merge:true });
        const msgRef = chatRef.collection('messages').doc();
        batch.set(msgRef, { fromUid:_user.uid, type:'collab_request', status:'pending', text:'Collab isteği gönderdi', createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        await batch.commit();
        db.collection('notifications').doc(otherId).collection('items').add({
          text:`${fromName} sana collab isteği gönderdi`, fromUid:_user.uid, type:'collab', read:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        }).catch(()=>{});
        collabHdrBtn.textContent = '✓ '+(window._i18n?.getLang()==='en'?'Sent':'Gönderildi');
        setTimeout(() => { collabHdrBtn.disabled = false; collabHdrBtn.textContent = 'Collab'; }, 4000);
      } catch(e) {
        const c=errId(); showToast(`${window._i18n?.t('prof_collab_send_err')||'Gönderilemedi'} (${c}): `+(e.message||e.code), 'error');
        collabHdrBtn.disabled = false; collabHdrBtn.textContent = 'Collab';
      }
    };
    hdr.append(collabHdrBtn);
  }
  // Messages area
  _chatMsgsEl.innerHTML = `<div class="chat-empty-state">${window._i18n?.t('prof_msg_load')||'Yükleniyor…'}</div>`;
  // Mark as read
  if (_user) db.collection('chats').doc(cid).update({ unreadBy:firebase.firestore.FieldValue.arrayRemove(_user.uid) }).catch(()=>{});
  // Subscribe real-time
  function _playMsgSound() {
    const a = new Audio('assets/audio/bildirim sesi.wav');
    a.volume = 0.5;
    a.play().catch(() => {});
  }
  if (_msgUnsub) { _msgUnsub(); _msgUnsub = null; }
  let _msgInitialized = false;
  _msgUnsub = db.collection('chats').doc(cid).collection('messages').orderBy('createdAt','asc').limit(60)
    .onSnapshot(snap => {
      const prevCount = _chatMsgsEl.querySelectorAll('.chat-msg').length;
      _chatMsgsEl.innerHTML = '';
      if (snap.empty) { _chatMsgsEl.innerHTML = `<div class="chat-empty-state"><div class="chat-empty-state-icon">${ic('chat')}</div><div>${window._i18n?.t('prof_msg_empty')||'Henüz mesaj yok.'}<br>${window._i18n?.t('prof_msg_first')||'İlk mesajı sen gönder.'}</div></div>`; _msgInitialized = true; return; }
      const _mkSenderAv = (fromUid) => {
        const av = document.createElement('a'); av.className = 'chat-msg-sender-av';
        av.href = `profile?uid=${fromUid}`;
        av.onclick = e => { e.stopPropagation(); };
        const p = _activeChatOther?.photo;
        if (p) { const i = document.createElement('img'); i.src = p; i.alt = ''; av.append(i); }
        else av.textContent = (_activeChatOther?.name||'?')[0].toUpperCase();
        return av;
      };
      snap.docs.forEach(d => {
        const m = d.data(); const myMsg = m.fromUid === _user?.uid;
        const wrap = document.createElement('div'); wrap.className = 'chat-msg' + (myMsg ? ' mine' : '');
        if (m.type === 'collab_request') {
          const card = document.createElement('div'); card.className = 'collab-req-card';
          const label = document.createElement('div'); label.className = 'collab-req-card-label';
          label.textContent = myMsg ? (window._i18n?.t('prof_collab_req_sent')||'Collab isteği gönderdin') : (window._i18n?.t('prof_collab_req_recv')||'Collab isteği aldın');
          card.append(label);
          if (m.status === 'pending' && !myMsg) {
            const btns = document.createElement('div'); btns.className = 'collab-req-card-btns';
            const acceptBtn = document.createElement('button'); acceptBtn.className = 'collab-req-accept'; acceptBtn.textContent = window._i18n?.t('prof_collab_accept')||'Kabul Et';
            const rejectBtn = document.createElement('button'); rejectBtn.className = 'collab-req-reject'; rejectBtn.textContent = window._i18n?.t('prof_collab_reject')||'Reddet';
            acceptBtn.onclick = async () => {
              try {
                await d.ref.update({ status: 'accepted' });
                db.collection('notifications').doc(m.fromUid).collection('items').add({
                  text: `${_user.displayName?.split(' ')[0]||'Biri'} collab isteğini kabul etti!`,
                  fromUid: _user.uid, type: 'collab_accepted', read: false,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                }).catch(()=>{});
              } catch(e) { alert('Hata: ' + (e.message || e.code)); }
            };
            rejectBtn.onclick = async () => { await d.ref.update({ status: 'rejected' }).catch(e => alert('Hata: ' + (e.message || e.code))); };
            btns.append(acceptBtn, rejectBtn); card.append(btns);
          } else if (m.status === 'accepted') {
            const s = document.createElement('div'); s.className = 'collab-req-card-status accepted'; s.textContent = window._i18n?.t('prof_collab_accepted_s')||'✓ Kabul edildi'; card.append(s);
          } else if (m.status === 'rejected') {
            const s = document.createElement('div'); s.className = 'collab-req-card-status rejected'; s.textContent = window._i18n?.t('prof_collab_rejected_s')||'✕ Reddedildi'; card.append(s);
          }
          const time2 = document.createElement('div'); time2.className = 'chat-msg-time'; time2.textContent = fmtDateTime(m.createdAt);
          if (!myMsg) {
            const cnt = document.createElement('div'); cnt.className = 'chat-msg-content';
            cnt.append(card, time2); wrap.append(_mkSenderAv(m.fromUid), cnt);
          } else {
            wrap.append(card, time2);
          }
        } else {
          const txt = document.createElement('div'); txt.className = 'chat-msg-text'; txt.textContent = m.text;
          const time = document.createElement('div'); time.className = 'chat-msg-time'; time.textContent = fmtDateTime(m.createdAt);
          if (!myMsg) {
            const cnt = document.createElement('div'); cnt.className = 'chat-msg-content';
            cnt.append(txt, time); wrap.append(_mkSenderAv(m.fromUid), cnt);
          } else {
            wrap.append(txt, time);
          }
        }
        _chatMsgsEl.append(wrap);
      });
      _chatMsgsEl.scrollTop = _chatMsgsEl.scrollHeight;
      // Play sound on new incoming message (not on initial load)
      if (_msgInitialized && snap.docs.length > prevCount) {
        const last = snap.docs[snap.docs.length - 1].data();
        if (last.fromUid !== _user?.uid) _playMsgSound();
      }
      _msgInitialized = true;
    }, err => {
      console.error('messages snapshot:', err);
      if (_chatMsgsEl) _chatMsgsEl.innerHTML = `<div class="chat-empty-state">${window._i18n?.t('prof_msg_err')||'Mesajlar yüklenemedi.'}</div>`;
    });
}

function _buildChatThread(chatDoc, myUid) {
  const chat = chatDoc.data();
  const adminViewing = chat.participants && !chat.participants.includes(myUid);
  let otherId, otherName;
  if (adminViewing) {
    otherId = chat.participants?.[0] || '';
    otherName = (chat.participants || []).map(p => chat.names?.[p] || (window._i18n?.t('ui_member')||'Üye')).join(' ↔ ');
  } else {
    otherId = chat.participants?.find(p => p !== myUid) || '';
    otherName = chat.names?.[otherId] || (window._i18n?.t('ui_member')||'Üye');
  }
  const otherPhoto = chat.photos?.[otherId] || null;
  const isUnread = chat.unreadBy?.includes(myUid);
  const el = document.createElement('div');
  el.className = 'chat-thread' + (isUnread ? ' unread' : '');
  el.dataset.cid = chatDoc.id;
  el.append(_mkAvEl(otherPhoto, otherName, 'chat-thread-av'));
  const info = document.createElement('div'); info.className = 'chat-thread-info';
  const nm = document.createElement('div'); nm.className = 'chat-thread-name'; nm.textContent = otherName;
  const prev = document.createElement('div'); prev.className = 'chat-thread-prev'; prev.textContent = chat.lastMessage || '';
  info.append(nm, prev); el.append(info);
  const dot = document.createElement('div'); dot.className = 'chat-thread-dot'; el.append(dot);
  el.onclick = () => { (_chatPanelEl?._openThread || _openThread)(chatDoc.id, otherId, otherName, otherPhoto); if (_chatOverlay()) _chatPanelEl?.classList.add('mobile-open'); };
  return el;
}

function initChatPanel(user) {
  if (!user) { document.querySelector('.chat-panel')?.remove(); document.querySelector('.chat-mobile-btn')?.remove(); _chatPanelEl=null; if(_chatListUnsub){_chatListUnsub();_chatListUnsub=null;} if(_msgUnsub){_msgUnsub();_msgUnsub=null;} return; }
  if (_chatPanelEl) return; // already initialized
  // Build panel
  const panel = document.createElement('div'); panel.className = 'chat-panel'; _chatPanelEl = panel;
  // Header
  const hdr = document.createElement('div'); hdr.className = 'chat-panel-hdr';
  const title = document.createElement('div'); title.className = 'chat-panel-title'; title.textContent = window._i18n?.t('prof_chat_title')||'Mesajlar';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-sm btn-icon btn-ghost chat-close';
  closeBtn.textContent = '✕';
  closeBtn.title = window._i18n?.t('prof_close')||'Kapat';
  closeBtn.setAttribute('aria-label', closeBtn.title);
  closeBtn.onclick = () => { panel.classList.remove('mobile-open'); if (typeof mobileBtn !== 'undefined') mobileBtn.style.display = 'flex'; };
  hdr.append(title, closeBtn); panel.append(hdr);
  const body = document.createElement('div'); body.className = 'chat-body'; panel.append(body);
  // Sidebar
  const sidebar = document.createElement('div'); sidebar.className = 'chat-sidebar'; body.append(sidebar);
  const searchWrap = document.createElement('div'); searchWrap.className = 'chat-search-wrap'; sidebar.append(searchWrap);
  const searchInput = document.createElement('input'); searchInput.className = 'chat-search'; searchInput.placeholder = window._i18n?.t('prof_search_ph')||'Üye ara…'; searchWrap.append(searchInput);
  _chatThreadsEl = document.createElement('div'); _chatThreadsEl.className = 'chat-threads'; sidebar.append(_chatThreadsEl);
  // All users cache for combined list
  let _allUsers = {}, _chatDocs = [], _searchTerm = '';
  db.collection('users').orderBy('displayName').limit(150).get().then(snap => {
    snap.docs.forEach(d => {
      if (d.id === user.uid) return;
      const u = d.data();
      _allUsers[d.id] = { name: u.displayName?.split(' ')[0] || (window._i18n?.t('ui_member')||'Üye'), photo: u.customPhotoURL || u.photoURL || '' };
    });
    _renderMemberList();
  }).catch(() => {});
  function _renderMemberList() {
    _chatThreadsEl.innerHTML = '';
    const q = _searchTerm.toLowerCase();
    const chattedUids = new Set();
    // Chatted users first (sorted by lastAt from snapshot)
    _chatDocs.forEach(chatDoc => {
      const chat = chatDoc.data();
      const adminViewing = chat.participants && !chat.participants.includes(user.uid);
      let otherId, otherName, otherPhoto;
      if (adminViewing) { otherId = chat.participants?.[0] || ''; otherName = (chat.participants||[]).map(p => chat.names?.[p]||(window._i18n?.t('ui_member')||'Üye')).join(' ↔ '); }
      else { otherId = chat.participants?.find(p => p !== user.uid) || ''; otherName = chat.names?.[otherId] || _allUsers[otherId]?.name || (window._i18n?.t('ui_member')||'Üye'); }
      otherPhoto = chat.photos?.[otherId] || _allUsers[otherId]?.photo || null;
      if (q && !otherName.toLowerCase().includes(q)) return;
      chattedUids.add(otherId);
      _chatThreadsEl.append(_buildChatThread(chatDoc, user.uid));
    });
    // Non-chatted users — only show when searching
    if (!q) return;
    Object.entries(_allUsers)
      .filter(([uid]) => !chattedUids.has(uid))
      .filter(([, u]) => u.name.toLowerCase().includes(q))
      .sort(([, a], [, b]) => a.name.localeCompare(b.name, 'tr'))
      .forEach(([uid, u]) => {
        const item = document.createElement('div'); item.className = 'chat-thread';
        item.append(_mkAvEl(u.photo, u.name, 'chat-thread-av'));
        const info = document.createElement('div'); info.className = 'chat-thread-info';
        const nm = document.createElement('div'); nm.className = 'chat-thread-name'; nm.textContent = u.name;
        const sub = document.createElement('div'); sub.className = 'chat-thread-prev'; sub.textContent = window._i18n?.t('prof_msg_hint')||'Mesaj gönder';
        info.append(nm, sub); item.append(info);
        item.onclick = () => { const cid = _chatId(user.uid, uid); panel._openThread(cid, uid, u.name, u.photo); if (_chatOverlay()) { panel.classList.add('mobile-open'); mobileBtn.style.display='none'; } };
        _chatThreadsEl.append(item);
      });
  }
  // Main area
  const main = document.createElement('div'); main.className = 'chat-main'; body.append(main); _chatMainEl = main;
  const mainHdr = document.createElement('div'); mainHdr.className = 'chat-main-hdr'; main.append(mainHdr);
  const emptyState = document.createElement('div'); emptyState.className = 'chat-empty-state';
  emptyState.innerHTML = `<div class="chat-empty-state-icon">${ic('chat')}</div><div>${window._i18n?.t('prof_chat_empty1')||'Bir sohbet seç'}<br>${window._i18n?.t('prof_chat_empty2')||'veya üye ara'}</div>`;
  main.append(emptyState);
  _chatMsgsEl = document.createElement('div'); _chatMsgsEl.className = 'chat-msgs'; _chatMsgsEl.style.display='none'; main.append(_chatMsgsEl);
  const inputWrap = document.createElement('div'); inputWrap.className = 'chat-input-wrap'; main.append(inputWrap);
  const chatInput = document.createElement('textarea'); chatInput.className = 'chat-input'; chatInput.placeholder = window._i18n?.t('prof_msg_ph')||'Mesaj yaz…'; chatInput.rows = 1; inputWrap.append(chatInput);
  const sendBtn = document.createElement('button'); sendBtn.className = 'chat-send-btn'; sendBtn.innerHTML = ic('arrow-right'); sendBtn.setAttribute('aria-label', 'Gönder'); inputWrap.append(sendBtn);
  let _msgQueue = Promise.resolve();
  const doSend = () => {
    const txt = chatInput.value.trim();
    if (!txt || !_activeChatOther) return;
    if (txt.length > 2000) { showToast(window._i18n?.t('prof_msg_max_err')||'Mesaj en fazla 2000 karakter.', 'error'); return; }
    chatInput.value = '';
    chatInput.style.height = 'auto';
    chatInput.focus();
    const myName = _user?.displayName?.split(' ')[0] || (window._i18n?.t('ui_member')||'Üye');
    const myPhoto = _user?.photoURL || '';
    _msgQueue = _msgQueue.then(() =>
      _sendMsg(user.uid, myName, myPhoto, _activeChatOther.uid, _activeChatOther.name, _activeChatOther.photo||'', txt)
      .catch(e => { const c=errId(); showToast(`${window._i18n?.t('prof_msg_send_err')||'Mesaj gönderilemedi'} (${c}): `+(e.message||e.code||(window._i18n?.getLang()==='en'?'Connection error':'Bağlantı hatası')), 'error'); })
    );
  };
  sendBtn.onclick = doSend;

function _mergeNotifs(uid) {
  const all = [
    ..._personalNotifs.map(n => ({...n, _t:'p'})),
    ..._announcements.filter(n => !_dismissedAnns.includes(n._id)).map(n => ({...n, _t:'a'}))
  ].sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
  const annSec = _annSeenAt?.seconds || 0;
  const unread = _personalNotifs.filter(n => !n.read).length
    + _announcements.filter(n => (n.createdAt?.seconds||0) > annSec).length;
  const badge = document.querySelector('.notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.style.display = unread > 0 ? 'block' : 'none'; }
  if (unread > _prevUnreadCount) {
    const bell = document.querySelector('.notif-bell');
    if (bell) { bell.classList.remove('ringing'); void bell.offsetWidth; bell.classList.add('ringing'); setTimeout(() => bell.classList.remove('ringing'), 1800); }
  }
  _prevUnreadCount = unread;
  if (_notifPanelEl) {
    const list = _notifPanelEl.querySelector('.notif-list'); if (!list) return;
    list.innerHTML = '';
    if (!all.length) { list.innerHTML = '<div class="notif-empty">Bildirim yok</div>'; return; }
    all.forEach(n => {
      const isUnread = n._t==='p' ? !n.read : (n.createdAt?.seconds||0) > annSec;
      const item = document.createElement('div'); item.className = 'notif-item' + (isUnread ? ' unread' : '');
      const icon = n._t==='a' ? '📢 ' : '';
      const timeStr = n.createdAt ? n.createdAt.toDate().toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const _nt=document.createElement('div');_nt.className='notif-item-text';_nt.textContent=icon+(n.text||'Yeni bildirim');const _ni=document.createElement('div');_ni.className='notif-item-time';_ni.textContent=timeStr;item.append(_nt,_ni);
      if (n.type === 'collab' && n.fromUid) item.onclick = () => { location.href = `profile?uid=${n.fromUid}`; };
      else if (n.fromUid) item.onclick = () => { _closePanels(); openChatWith(n.fromUid); };
      else if (n.postId) item.onclick = () => { location.href = `post?id=${n.postId}`; };
      if (n._id) {
        const del = document.createElement('button'); del.className = 'notif-del-btn'; del.textContent = '×'; del.title = 'Sil';
        del.onclick = e => {
          e.stopPropagation();
          if (n._t === 'p') {
            db.collection('notifications').doc(uid).collection('items').doc(n._id).delete().catch(() => {});
          } else {
            if (!_dismissedAnns.includes(n._id)) { _dismissedAnns.push(n._id); }
            db.collection('users').doc(uid).update({ dismissedAnns: firebase.firestore.FieldValue.arrayUnion(n._id) }).catch(() => {});
            _announcements = _announcements.filter(a => a._id !== n._id);
            _mergeNotifs(uid);
          }
        };
        item.append(del);
      }
      list.append(item);
    });
  }
}

function markAllNotifRead(uid) {
  db.collection('notifications').doc(uid).collection('items')
    .where('read', '==', false).get().then(snap => {
      const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { read: true })); batch.commit();
    }).catch(() => {});
  db.collection('users').doc(uid).set({ announcementsSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
  _annSeenAt = { seconds: Date.now() / 1000 };
  _personalNotifs = _personalNotifs.map(n => ({...n, read: true}));
  _mergeNotifs(uid);
}

function initNotifications(user) {
  if (_notifUnsub) { _notifUnsub(); _notifUnsub = null; }
  if (_annUnsub) { _annUnsub(); _annUnsub = null; }
  _personalNotifs = []; _announcements = []; _annSeenAt = null; _dismissedAnns = [];
  if (!user) return;
  db.collection('users').doc(user.uid).get().then(d => {
    _annSeenAt = d.data()?.announcementsSeenAt || null;
    _dismissedAnns = d.data()?.dismissedAnns || [];
    _mergeNotifs(user.uid);
  }).catch(() => {});
  _notifUnsub = db.collection('notifications').doc(user.uid).collection('items')
    .orderBy('createdAt', 'desc').limit(20)
    .onSnapshot(snap => {
      _personalNotifs = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (snap.docs.length > 4) { const b = db.batch(); snap.docs.slice(4).forEach(d => b.delete(d.ref)); b.commit().catch(() => {}); }
      _mergeNotifs(user.uid);
    }, () => {});
  _annUnsub = db.collection('announcements').orderBy('createdAt', 'desc').limit(15)
    .onSnapshot(snap => { _announcements = snap.docs.map(d => ({...d.data(), _id: d.id})); _mergeNotifs(user.uid); }, () => {});
}

    editForm.append(photoLabel);
    const photoWrap = document.createElement('div'); photoWrap.className = 'ef-photo-row';
    const curPhoto = prof.customPhotoURL || prof.photoURL || _user?.photoURL || '';
    const photoPreview = document.createElement('img'); photoPreview.className = 'ef-photo-preview'; photoPreview.alt = '';
    if (curPhoto) photoPreview.src = curPhoto; else photoPreview.style.display = 'none';
    const uploadBtn = document.createElement('label'); uploadBtn.className = 'btn btn-sm btn-ghost';
    uploadBtn.textContent = window._i18n?.t('prof_photo_btn')||'Fotoğraf Seç';
    const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
    uploadBtn.append(fileInput);
    const photoHint = document.createElement('div'); photoHint.className = 'ef-hint';
    photoHint.textContent = window._i18n?.t('prof_photo_hint')||'Google fotoğrafın otomatik kullanılır. Değiştirmek için seç.';
    // Hidden field to hold processed data URL
    let _customPhotoData = prof.customPhotoURL || '';
    fileInput.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image(); img.onload = () => {
          const MAX = 200;
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } } else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          _customPhotoData = canvas.toDataURL('image/jpeg', 0.65);
          photoPreview.src = _customPhotoData; photoPreview.style.display = '';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    photoWrap.append(photoPreview, uploadBtn);
    editForm.append(photoWrap, photoHint);
    // Dummy photoInput object to keep save logic working
    const photoInput = { get value() { return _customPhotoData; }, trim() { return _customPhotoData; } };

    const aboutLabel2 = document.createElement('div'); aboutLabel2.className = 'ef-label'; aboutLabel2.textContent = window._i18n?.t('prof_about_label')||'Hakkında';
    editForm.append(aboutLabel2);
    const aboutInput = document.createElement('textarea'); aboutInput.className = 'ef-ta'; aboutInput.maxLength = 300; aboutInput.rows = 4;
    aboutInput.placeholder = window._i18n?.t('prof_about_ph')||'Kendinden, müzik tarzından bahset...'; aboutInput.value = prof.about || '';
    editForm.append(aboutInput);

    const genresLabel = document.createElement('div'); genresLabel.className = 'ef-label'; genresLabel.textContent = window._i18n?.t('prof_genres_label')||'Genreler';
    editForm.append(genresLabel);
    const genresWrap = document.createElement('div'); genresWrap.className = 'ef-genres-wrap';
    function rebuildGenreChips() {
      genresWrap.innerHTML = '';
      editGenres.forEach((g, i) => {
        const chip = document.createElement('div'); chip.className = 'ef-genre-chip';
        const span = document.createElement('span'); span.textContent = g;
        const del = document.createElement('button'); del.textContent = '✕';
        del.onclick = () => { editGenres.splice(i,1); rebuildGenreChips(); };
        chip.append(span, del); genresWrap.append(chip);
      });
    }
    rebuildGenreChips(); editForm.append(genresWrap);

    const addRow = document.createElement('div'); addRow.className = 'ef-genre-add';
    const gInput = document.createElement('input'); gInput.className = 'ef-genre-input'; gInput.placeholder = 'Techno, House, Ambient...'; gInput.maxLength = 30;
    const addBtn = document.createElement('button'); addBtn.className = 'ef-genre-add-btn'; addBtn.textContent = window._i18n?.t('prof_genres_add')||'+ Ekle';
    addBtn.onclick = () => {
      const v = gInput.value.trim(); if (!v || editGenres.length >= 8) return;
      editGenres.push(v); gInput.value = ''; rebuildGenreChips();
    };
    gInput.onkeydown = e => { if (e.key==='Enter') { e.preventDefault(); addBtn.click(); } };
    addRow.append(gInput, addBtn); editForm.append(addRow);

    const igLabel = document.createElement('div'); igLabel.className = 'ef-label'; igLabel.textContent = 'Instagram URL';
    editForm.append(igLabel);
    const igInput = document.createElement('input'); igInput.className = 'ef-input'; igInput.type = 'url';
    igInput.placeholder = 'https://instagram.com/kullaniciadi'; igInput.value = prof.instagram || '';
    editForm.append(igInput);

    const spLabel = document.createElement('div'); spLabel.className = 'ef-label'; spLabel.textContent = 'Spotify URL';
    editForm.append(spLabel);
    const spInput = document.createElement('input'); spInput.className = 'ef-input'; spInput.type = 'url';
    spInput.placeholder = 'https://open.spotify.com/artist/...'; spInput.value = prof.spotify || '';
    editForm.append(spInput);

    const scLabel = document.createElement('div'); scLabel.className = 'ef-label'; scLabel.textContent = 'SoundCloud URL';
    editForm.append(scLabel);
    const scInput = document.createElement('input'); scInput.className = 'ef-input'; scInput.type = 'url';
    scInput.placeholder = 'https://soundcloud.com/kullaniciadi'; scInput.value = prof.soundcloudUrl || '';
    editForm.append(scInput);

    const mcLabel = document.createElement('div'); mcLabel.className = 'ef-label'; mcLabel.textContent = 'Mixcloud URL';
    editForm.append(mcLabel);
    const mcInput = document.createElement('input'); mcInput.className = 'ef-input'; mcInput.type = 'url';
    mcInput.placeholder = 'https://www.mixcloud.com/kullaniciadi'; mcInput.value = prof.mixcloudUrl || '';
    editForm.append(mcInput);

    const collabLabel = document.createElement('div'); collabLabel.className = 'ef-label'; collabLabel.textContent = window._i18n?.t('prof_collab_label')||'İşbirliği Durumu';
    editForm.append(collabLabel);
    const collabWrap = document.createElement('div'); collabWrap.className = 'ef-collab-row';
    const collabOpts = [
      { val:'open',  textKey:'prof_open',        textFallback:'Projeye Açık' },
      { val:'busy',  textKey:'prof_busy',        textFallback:'Meşgul' },
      { val:'none',  textKey:'prof_collab_none', textFallback:'Belirtme' },
    ];
    let selCollab = prof.collabStatus || 'none';
    function rebuildCollabBtns() {
      collabWrap.innerHTML = '';
      collabOpts.forEach(o => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-sm btn-ghost' + (selCollab===o.val ? ' is-on' : '');
        b.textContent = window._i18n?.t(o.textKey)||o.textFallback;
        b.onclick = () => { selCollab = o.val; rebuildCollabBtns(); };
        collabWrap.append(b);
      });
    }
    rebuildCollabBtns(); editForm.append(collabWrap);

    const saveBtn = document.createElement('button'); saveBtn.className = 'ef-save-btn'; saveBtn.textContent = window._i18n?.t('prof_save')||'Kaydet';
    saveBtn.onclick = async () => {
      saveBtn.disabled = true; saveBtn.textContent = '…';
      try {
        const update = {
          displayName: _user?.displayName || displayName,
          photoURL:    _user?.photoURL    || photoURL,
          about:   aboutInput.value.trim(),
          genres:  editGenres,
          email:   _user?.email || '',
          instagram:     igInput.value.trim(),
          spotify:       spInput.value.trim(),
          soundcloudUrl: scInput.value.trim(),
          mixcloudUrl:   mcInput.value.trim(),
          customPhotoURL: _customPhotoData || '',
          collabStatus:  selCollab,
        };
        if (!prof.joinedAt) update.joinedAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('users').doc(uid).set(update, { merge: true });
        // Immediately update avatar in DOM without waiting for re-render
        if (_customPhotoData) {
          const avWrap = document.querySelector('.profile-avatar-wrap');
          if (avWrap) { const ex = avWrap.querySelector('img'); if (ex) { ex.src = _customPhotoData; } else { avWrap.innerHTML = ''; const ni = document.createElement('img'); ni.className = 'profile-avatar'; ni.src = _customPhotoData; avWrap.append(ni); } }
        }
        saveBtn.textContent = window._i18n?.t('prof_saved')||'✓ Kaydedildi';
        showToast(window._i18n?.t('prof_saved_toast')||'✓ Profil güncellendi!');
        setTimeout(async () => {
          // Force server read after save to reflect latest data
          await db.collection('users').doc(uid).get({ source: 'server' }).catch(() => {});
          await renderProfile().catch(console.error);
          // Re-open edit form so user can see saved values
          document.querySelector('.edit-btn')?.click();
        }, 1000);
      } catch(e) { const c=errId(); console.error('[save]',c,e); saveBtn.disabled=false; saveBtn.textContent=`${window._i18n?.t('prof_save_err')||'Kayıt başarısız'} (${c})`; }
    };
    editForm.append(saveBtn);

    editBtn.onclick = () => {
      editForm.classList.toggle('open');
      editBtn.textContent = editForm.classList.contains('open') ? '✕ '+(window._i18n?.t('post_cancel')||'Kapat') : (window._i18n?.t('prof_edit_btn')||'Profili Düzenle');
    };

    // Settings button (own profile)
    const settingsBtn = document.createElement('button'); settingsBtn.className = 'settings-btn'; settingsBtn.textContent = window._i18n?.t('prof_settings_btn')||'Görünüm Ayarları';
    info.append(settingsBtn);
    const settingsPanel = document.createElement('div'); settingsPanel.className = 'settings-panel';
    // Theme row
    const themeLabel = document.createElement('div'); themeLabel.className = 'settings-label'; themeLabel.textContent = window._i18n?.t('prof_theme_label')||'Tema';
    const themeRow = document.createElement('div'); themeRow.className = 'settings-row';
    const themeInfo = document.createElement('div'); themeInfo.className = 'settings-row-info';
    themeInfo.innerHTML = `<div class="settings-row-label">${window._i18n?.t('prof_theme_title')||'Renk Teması'}</div><div class="settings-row-sub">${window._i18n?.t('prof_theme_sub')||'Koyu veya açık arka plan'}</div>`;
    const themeBtns = document.createElement('div'); themeBtns.className = 'theme-btns';
    const darkBtn = document.createElement('button'); darkBtn.className = 'btn btn-sm btn-ghost theme-btn dark-btn'; darkBtn.textContent = window._i18n?.t('prof_dark_btn')||'Koyu';
    const lightBtn = document.createElement('button'); lightBtn.className = 'btn btn-sm btn-ghost theme-btn light-btn'; lightBtn.textContent = window._i18n?.t('prof_light_btn')||'Açık';
    const curTheme = localStorage.getItem('site-theme') || 'dark';
    if (curTheme === 'dark') darkBtn.classList.add('active'); else lightBtn.classList.add('active');
    darkBtn.onclick = () => { localStorage.setItem('site-theme','dark'); document.documentElement.classList.remove('theme-light'); darkBtn.classList.add('active'); lightBtn.classList.remove('active'); };
    lightBtn.onclick = () => { localStorage.setItem('site-theme','light'); document.documentElement.classList.add('theme-light'); lightBtn.classList.add('active'); darkBtn.classList.remove('active'); };
    themeBtns.append(darkBtn, lightBtn); themeRow.append(themeInfo, themeBtns);
    // Font clear row
    const fontRow = document.createElement('div'); fontRow.className = 'settings-row';
    const fontInfo = document.createElement('div'); fontInfo.className = 'settings-row-info';
    fontInfo.innerHTML = `<div class="settings-row-label">${window._i18n?.t('prof_font_label')||'Font Netleştir'}</div><div class="settings-row-sub">${window._i18n?.t('prof_font_sub')||'Yazıları daha büyük ve okunaklı gösterir'}</div>`;
    const toggleWrap = document.createElement('label'); toggleWrap.className = 'toggle';
    const toggleInput = document.createElement('input'); toggleInput.type = 'checkbox';
    toggleInput.checked = localStorage.getItem('site-font-clear') === '1';
    const toggleTrack = document.createElement('div'); toggleTrack.className = 'toggle-track';
    const toggleThumb = document.createElement('div'); toggleThumb.className = 'toggle-thumb';
    toggleInput.onchange = () => {
      if (toggleInput.checked) { localStorage.setItem('site-font-clear','1'); document.documentElement.classList.add('font-clear'); }
      else { localStorage.setItem('site-font-clear','0'); document.documentElement.classList.remove('font-clear'); }
    };
    toggleWrap.append(toggleInput, toggleTrack, toggleThumb); fontRow.append(fontInfo, toggleWrap);
    settingsPanel.append(themeLabel, themeRow, fontRow);
    settingsBtn.onclick = () => { settingsPanel.classList.toggle('open'); settingsBtn.textContent = settingsPanel.classList.contains('open') ? ('✕ '+(window._i18n?.t('prof_close')||'Kapat')) : (window._i18n?.t('prof_settings_btn')||'Görünüm Ayarları'); };
    pCard.append(info, settingsPanel, editForm);
  } else {
    pCard.append(info);
  }

  // Admin title assignment panel (visible when admin views other profiles)
  if (isAdmin(_user) && !isOwn) {
    const panel = document.createElement('div'); panel.className = 'admin-title-panel';
    const lbl = document.createElement('div'); lbl.className = 'admin-title-label'; lbl.textContent = 'Ünvan Ata';
    const grid = document.createElement('div'); grid.className = 'title-grid';
    let selKey = prof.title || 'none';
    TITLES.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm btn-ghost title-opt' + (selKey === t.key ? ' sel' : '');
      btn.innerHTML = (t.icon ? ic(t.icon) : '') + '<span>' + t.labelTr + '</span>';
      btn.onclick = () => {
        selKey = t.key;
        grid.querySelectorAll('.title-opt').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
      };
      grid.append(btn);
    });
    const saveBtn = document.createElement('button'); saveBtn.className = 'title-save-btn';
    saveBtn.textContent = 'Ünvanı Kaydet';
    saveBtn.onclick = async () => {
      saveBtn.disabled = true; saveBtn.textContent = '…';
      try {
        await db.collection('users').doc(uid).set({ title: selKey }, { merge: true });
        showToast('✓ Ünvan güncellendi');
        renderProfile();
      } catch(e) {
        showToast('Kayıt başarısız: ' + (e.code || e.message || 'Bilinmeyen hata'), 'error');
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Ünvanı Kaydet';
    };
    panel.append(lbl, grid, saveBtn);
    pCard.append(panel);

    // Admin email panel
    const emailPanel = document.createElement('div'); emailPanel.className = 'admin-announce-panel';
    const emailLbl = document.createElement('div'); emailLbl.className = 'admin-title-label'; emailLbl.textContent = 'Mail Gönder';
    const emailSubject = document.createElement('input'); emailSubject.type = 'text';
    emailSubject.className = 'input';
    emailSubject.placeholder = 'Konu (opsiyonel)';
    const emailTa = document.createElement('textarea'); emailTa.className = 'admin-announce-ta';
    emailTa.placeholder = 'Mesaj içeriği...';
    const emailRow = document.createElement('div'); emailRow.className = 'admin-row';
    const emailSend = document.createElement('button'); emailSend.className = 'admin-announce-send'; emailSend.textContent = 'Gönder';
    const emailStatus = document.createElement('span'); emailStatus.className = 'admin-status';
    emailSend.onclick = async () => {
      const msg = emailTa.value.trim();
      if (!msg) { emailTa.focus(); return; }
      const toEmail = prof.email;
      if (!toEmail) { emailStatus.style.color='var(--crimson)'; emailStatus.textContent='Bu üyenin email adresi bulunamadı'; return; }
      emailSend.disabled = true; emailSend.textContent = '…';
      try {
        const fn = firebase.app().functions('europe-west1').httpsCallable('sendCustomEmail');
        await fn({ toEmail, toName: displayName, subject: emailSubject.value.trim() || 'Berkay Er Academy', message: msg });
        emailTa.value = ''; emailSubject.value = '';
        emailStatus.style.color = 'var(--green)'; emailStatus.textContent = '✓ Mail gönderildi: ' + toEmail;
        setTimeout(() => { emailStatus.textContent = ''; }, 4000);
      } catch(e) {
        emailStatus.style.color = 'var(--crimson)'; emailStatus.textContent = 'Hata: ' + (e.code || e.message);
      }
      emailSend.disabled = false; emailSend.textContent = 'Gönder';
    };
    emailRow.append(emailSend, emailStatus);
    emailPanel.append(emailLbl, emailSubject, emailTa, emailRow);
    pCard.append(emailPanel);
  }

  // Admin announcement panel (own profile only)
  if (isAdmin(_user) && isOwn) {
    const annPanel = document.createElement('div'); annPanel.className = 'admin-announce-panel';
    const annLbl = document.createElement('div'); annLbl.className = 'admin-title-label'; annLbl.textContent = 'Tüm Üyelere Duyuru Gönder';
    const annTa = document.createElement('textarea'); annTa.className = 'admin-announce-ta';
    annTa.placeholder = 'Yeni özellik, güncelleme veya duyuru metni...';
    const annRow = document.createElement('div'); annRow.className = 'admin-row';
    const annSend = document.createElement('button'); annSend.className = 'admin-announce-send'; annSend.textContent = 'Gönder';
    const annDelAll = document.createElement('button'); annDelAll.className = 'btn btn-danger';
    annDelAll.textContent = 'Tümünü Sil';
    const annStatus = document.createElement('span'); annStatus.className = 'admin-status';
    annSend.onclick = async () => {
      const txt = annTa.value.trim();
      if (!txt) { annTa.focus(); return; }
      annSend.disabled = true; annSend.textContent = '…';
      try {
        await db.collection('announcements').add({
          text: txt,
          fromName: _user.displayName?.split(' ')[0] || 'Admin',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          type: 'update',
        });
        annTa.value = '';
        annStatus.style.color = 'var(--green)'; annStatus.textContent = '✓ Duyuru gönderildi';
        setTimeout(() => { annStatus.textContent = ''; }, 3000);
      } catch(e) {
        annStatus.style.color = 'var(--crimson)'; annStatus.textContent = 'Hata: ' + (e.code || e.message);
      }
      annSend.disabled = false; annSend.textContent = 'Gönder';
    };
    annDelAll.onclick = async () => {
      if (!confirm('Tüm duyuruları silmek istediğine emin misin?')) return;
      annDelAll.disabled = true; annDelAll.textContent = '…';
      try {
        const snap = await db.collection('announcements').get();
        const batch = db.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        annStatus.style.color = 'var(--green)'; annStatus.textContent = '✓ Tüm duyurular silindi';
        setTimeout(() => { annStatus.textContent = ''; }, 3000);
      } catch(e) {
        annStatus.style.color = 'var(--crimson)'; annStatus.textContent = 'Hata: ' + (e.code || e.message);
      }
      annDelAll.disabled = false; annDelAll.textContent = 'Tümünü Sil';
    };
    annRow.append(annSend, annDelAll, annStatus);
    annPanel.append(annLbl, annTa, annRow);
    pCard.append(annPanel);

    // Delete all chats panel
    const msgPanel = document.createElement('div'); msgPanel.className = 'admin-announce-panel';
    const msgLbl = document.createElement('div'); msgLbl.className = 'admin-title-label'; msgLbl.textContent = 'Mesaj Yönetimi';
    const msgDelAll = document.createElement('button'); msgDelAll.className = 'btn btn-danger';
    msgDelAll.textContent = 'Tüm Mesajları Sil';
    const msgStatus = document.createElement('span'); msgStatus.className = 'admin-status block';
    msgDelAll.onclick = async () => {
      if (!confirm('Tüm sohbet mesajlarını silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
      msgDelAll.disabled = true; msgDelAll.textContent = 'Siliniyor…';
      try {
        const chatSnap = await db.collection('chats').get();
        for (const chatDoc of chatSnap.docs) {
          const msgSnap = await chatDoc.ref.collection('messages').get();
          const batch = db.batch();
          msgSnap.docs.forEach(m => batch.delete(m.ref));
          batch.delete(chatDoc.ref);
          await batch.commit();
        }
        msgStatus.style.color = 'var(--green)'; msgStatus.textContent = '✓ Tüm mesajlar silindi (' + chatSnap.size + ' sohbet)';
        setTimeout(() => { msgStatus.textContent = ''; }, 4000);
      } catch(e) {
        msgStatus.style.color = 'var(--crimson)'; msgStatus.textContent = 'Hata: ' + (e.code || e.message);
      }
      msgDelAll.disabled = false; msgDelAll.textContent = 'Tüm Mesajları Sil';
    };
    msgPanel.append(msgLbl, msgDelAll, msgStatus);
    pCard.append(msgPanel);
  }

  layout.append(pCard);

  // ── Activity column ──
  const actCol = document.createElement('div'); actCol.className = 'activity-col';

  // Recent posts
  const postsSec = document.createElement('div'); postsSec.className = 'activity-section';
  const postTitle = document.createElement('div'); postTitle.className = 'activity-title';
  postTitle.textContent = window._i18n?.t('prof_recent_topics')||'Son Konular';
  postsSec.append(postTitle);
  if (posts.length === 0) {
    const e = document.createElement('div'); e.className = 'activity-empty'; e.textContent = window._i18n?.t('prof_no_topics')||'Henüz konu açılmamış.';
    postsSec.append(e);
  } else {
    posts.forEach(p => {
      const item = document.createElement('div'); item.className = 'activity-item';
      item.onclick = () => location.href = `post?id=${p.id}`;
      const t = document.createElement('div'); t.className = 'activity-item-title';
      t.textContent = p.title || (p.text?.slice(0,60)+'…') || '';
      const m = document.createElement('div'); m.className = 'activity-item-meta';
      const dateEl = document.createElement('span'); dateEl.textContent = fmtDate(p.createdAt);
      const rcEl   = document.createElement('span'); rcEl.textContent = `${p.replyCount||0}`;
      m.append(dateEl, rcEl);
      item.append(t, m); postsSec.append(item);
    });
  }
  actCol.append(postsSec);

  // Recent replies
  const repliesSec = document.createElement('div'); repliesSec.className = 'activity-section';
  const repliesTitle = document.createElement('div'); repliesTitle.className = 'activity-title';
  repliesTitle.textContent = window._i18n?.t('prof_recent_replies')||'Son Yorumlar';
  repliesSec.append(repliesTitle);
  console.log('[render] replies.length at render:', replies.length);
  if (replies.length === 0) {
    const e = document.createElement('div'); e.className = 'activity-empty';
    const _en = window._i18n?.getLang()==='en';
    e.textContent = isOwn
      ? (_en ? 'No replies yet. Forum replies will appear here after your first post.' : 'Henüz yorum yapılmamış. Forum\'da ilk yorumunu yaptıktan sonra burada görünür.')
      : (window._i18n?.t('prof_no_replies')||'Henüz yanıt verilmemiş.');
    repliesSec.append(e);
  } else {
    replies.forEach(r => {
      console.log('[render] reply item:', r.id, 'text:', (r.text||'').slice(0,30), 'postId:', r.postId);
      const item = document.createElement('div'); item.className = 'activity-item';
      item.onclick = () => location.href = `post?id=${r.postId}`;
      const t = document.createElement('div'); t.className = 'activity-item-title';
      const rtxt = r.text || r.content || '';
      t.textContent = rtxt.length > 80 ? rtxt.slice(0,80) + '…' : rtxt;
      const m = document.createElement('div'); m.className = 'activity-item-meta';
      const dateEl = document.createElement('span'); dateEl.textContent = fmtDate(r.createdAt);
      m.append(dateEl); item.append(t, m); repliesSec.append(item);
    });
  }
  actCol.append(repliesSec);

  layout.append(actCol);

  // Chat panel goes last → right column (3rd)
  if (_chatPanelEl) layout.append(_chatPanelEl);
}

window.bkAuth.handleRedirectResult();
auth.onAuthStateChanged(async user => {
  _user = user;
  updateAuthBar(user);
  initNotifications(user);
  initChatPanel(user);
  if (user) {
    const uref = db.collection('users').doc(user.uid);
    const snap = await uref.get({ source: 'server' }).catch(() => uref.get().catch(() => null));
    const update = { displayName: user.displayName?.trim() || user.email?.split('@')[0] || '', photoURL: user.photoURL || '', email: user.email };
    if (!snap?.data()?.joinedAt) update.joinedAt = firebase.firestore.FieldValue.serverTimestamp();
    await uref.set(update, { merge: true }).catch(console.error);
  }
  await renderProfile();
});
</script>

<script>(function(){
  var act=document.querySelector('.bottom-nav')?.dataset.active;
  if(act){document.querySelectorAll('.lnav-item[data-page]').forEach(function(e){if(act===e.dataset.page)e.classList.add('active');});var pl=document.querySelector('.lnav-profile-link');if(pl&&act==='profile')pl.classList.add('active');}
  var bAv=document.getElementById('bnavProfileAv'),lAv=document.getElementById('lnavProfileAv');
  if(bAv&&lAv){lAv.innerHTML=bAv.innerHTML;new MutationObserver(function(){lAv.innerHTML=bAv.innerHTML;}).observe(bAv,{childList:true,subtree:true});}
  var bAdm=document.getElementById('bnavAdminItem'),lAdm=document.getElementById('lnavAdminItem');
  if(bAdm&&lAdm){new MutationObserver(function(m){m.forEach(function(x){if(x.attributeName==='style')lAdm.style.display=bAdm.style.display;});}).observe(bAdm,{attributes:true,attributeFilter:['style']});}
})();</script>
