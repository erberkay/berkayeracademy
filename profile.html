/* ── Profil — tasarım: Profil (1440) + M_Profil (390). Bileşenler ui.css'ten, kabuk themes.css'ten. ── */

/* Kapak şeridi: sıcak koyu zemin + süzülen iki ışık + ekolayzer (statik HTML; kabuk ekran dışında duraklatır) */
.pf { position:relative; padding-bottom:var(--s8); }
.pf-hero { position:relative; height:300px; overflow:hidden; background:#120d0c; /* tasarım: kapak zemini (tek seferlik) */ }
.pf-glow { position:absolute; width:900px; height:600px; border-radius:50%; pointer-events:none; --drift-x:60px; --drift-y:-20px; animation-duration:12s; }
.pf-glow--a { left:-100px; top:-250px; background:radial-gradient(closest-side, rgba(184,45,69,.55), transparent 75%); /* ember-1 %55 */ }
.pf-glow--b { right:-200px; top:-200px; background:radial-gradient(closest-side, var(--accent-line), transparent 75%); animation-delay:-6s; }
.pf-eq { position:absolute; left:0; right:0; bottom:0; height:180px; padding:0 var(--page-x); gap:4px; }
.pf-eq i { flex:1 1 0; width:auto; animation-duration:1.6s; }
.pf-eq i:nth-child(2n) { animation-duration:1.1s; }
.pf-eq i:nth-child(3n) { animation-duration:2s; animation-delay:-.6s; }
.pf-eq i:nth-child(5n) { animation-duration:.8s; animation-delay:-.3s; }
.pf-hero-fade { position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, var(--bg)); }

/* Kimlik satırı (kapağın üstüne biner) */
.pf-layout { position:relative; z-index:1; }
.pf-id { width:100%; max-width:var(--page-max); margin:-110px auto 0; padding:0 var(--page-x); display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; }
.pf-id-main { display:flex; align-items:flex-end; gap:32px; min-width:0; }
.pf-ava { position:relative; flex-shrink:0; width:184px; height:184px; }
.pf-ring { position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, var(--ember-1), var(--ember-2), var(--accent), var(--ember-1)); --spin-dur:8s; }
.pf-ava-in { position:absolute; inset:5px; border-radius:50%; background:var(--surface-2); border:5px solid var(--bg); overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:var(--ff-disp); font-size:64px; line-height:1; color:var(--accent); }
.pf-ava-in img { width:100%; height:100%; object-fit:cover; display:block; }
.pf-ava-sk { position:absolute; inset:5px; }
.pf-id-text { display:flex; flex-direction:column; gap:10px; padding-bottom:12px; min-width:0; }
.pf-badges { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.pf-rank { display:inline-flex; align-items:center; padding:6px 12px; border-radius:var(--r-pill); border:1px solid var(--accent-line-2); font-family:var(--ff-mono); font-size:var(--fs-label); line-height:1.3; letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--accent); }
.pf-status { position:relative; display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px; border-radius:var(--r-pill); border:1px solid var(--line-strong); background:transparent; color:var(--fg-soft); font-family:var(--ff); font-size:var(--fs-small); line-height:1; white-space:nowrap; }
button.pf-status { cursor:pointer; transition:border-color var(--dur-fast), color var(--dur-fast); }
button.pf-status:hover { border-color:var(--accent-line-2); color:var(--fg); }
button.pf-status::after { content:''; position:absolute; inset:-7px -2px; } /* 44px dokunma alanı */
button.pf-status:disabled { opacity:.6; cursor:progress; }
.pf-status .be-live--err { background:var(--err-strong); }
.pf-name { font-size:clamp(44px, calc(44px + (100vw - 600px) * .0333), 72px); /* tasarım: 72 masaüstü / 44 mobil */ line-height:.95; letter-spacing:0; overflow-wrap:anywhere; }
.pf-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; font-size:var(--fs-ui); color:var(--fg-muted); }
.pf-meta-sep { color:var(--fg-deco); }
.pf-soc { position:relative; }
.pf-soc::after { content:''; position:absolute; inset:-12px -4px; } /* 44px dokunma alanı */
.pf-actions { display:flex; gap:10px; padding-bottom:16px; flex-shrink:0; }
html .pf-actions .btn { height:48px; } /* tasarım: 48px eylem düğmeleri */
html .pf-actions .btn-primary { padding:0 22px; }
.pf-btn-short { display:none; }
html .btn.is-following { border-color:var(--accent-line-2); color:var(--accent); background:var(--accent-wash); }
.pf-sk-badge { width:120px; height:28px; }
.pf-sk-name { width:min(360px, 60vw); height:60px; }
.pf-sk-line { width:200px; height:16px; }
.pf-notfound { max-width:520px; margin:-60px auto 0; background:var(--bg); }
.pf-notfound .icon { width:32px; height:32px; }

/* Gövde: ana sütun + 400px yan sütun */
.pf-body { width:100%; max-width:var(--page-max); margin:0 auto; padding:48px var(--page-x) 0; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:24px; align-items:start; }
.pf-col { display:flex; flex-direction:column; gap:20px; min-width:0; }
.pf-side { display:flex; flex-direction:column; gap:14px; min-width:0; }

.pf-stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
.pf-stat { display:flex; flex-direction:column; gap:4px; padding:24px; border-radius:var(--r-20); background:var(--surface); border:1px solid var(--line); }
.pf-stat-val { font-family:var(--ff-disp); font-size:48px; /* tasarım 48 / mobil 30 */ line-height:1; color:var(--fg); }
.pf-stat-lbl { font-family:var(--ff-mono); font-size:var(--fs-label); letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-3); }

.pf-box { border-radius:var(--r-24); background:var(--surface-0); border:1px solid var(--line); }
.pf-rankbox { padding:28px; display:flex; flex-direction:column; gap:12px; }
.pf-row-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
html .pf-lbl { font-family:var(--ff-mono); font-size:var(--fs-label); font-weight:400; line-height:1.4; letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-muted); }
.pf-rank-step { font-family:var(--ff-mono); font-size:var(--fs-label); color:var(--accent); white-space:nowrap; }
.pf-steps { list-style:none; display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px; }
.pf-steps li { position:relative; display:flex; flex-direction:column; gap:8px; min-width:0; }
.pf-step-bar { display:block; height:6px; border-radius:3px; background:var(--track-2); transition:background .4s; }
.pf-steps li.is-done .pf-step-bar { background:var(--accent); }
.pf-steps li.is-done:last-child .pf-step-bar { background:linear-gradient(90deg, var(--ember-1), var(--accent)); }
.pf-step-lbl { font-size:12px; line-height:1.35; color:var(--fg-faint); }
.pf-steps li.is-past .pf-step-lbl { color:var(--fg-muted); }
.pf-steps li[aria-current] .pf-step-lbl { color:var(--fg); }
.pf-rank-note { font-size:12px; line-height:1.5; color:var(--fg-3); }

.pf-tabsbox { overflow:hidden; }
.pf-tablist { display:flex; gap:4px; padding:8px; border-bottom:1px solid var(--line-div); }
.pf-tab { position:relative; height:44px; padding:0 18px; border:0; border-radius:var(--r-12); background:transparent; color:var(--fg-muted); font-family:var(--ff); font-size:var(--fs-ui); font-weight:500; line-height:1; white-space:nowrap; cursor:pointer; transition:background var(--dur-fast), color var(--dur-fast); }
.pf-tab:hover { color:var(--fg); }
.pf-tab[aria-selected="true"] { background:var(--surface-4); color:var(--fg); }
.pf-tl-short { display:none; }
.pf-panel:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.pf-empty { padding:64px 32px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
.pf-empty-icon { width:40px; height:40px; color:var(--fg-deco); }
.pf-empty p { max-width:440px; font-size:16px; line-height:1.5; color:var(--fg-muted); }
.pf-empty-links { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 24px; }
.pf-empty .btn-link { position:relative; }
.pf-empty .btn-link::after { content:''; position:absolute; inset:-12px -4px; }
.pf-list { list-style:none; padding:8px; display:flex; flex-direction:column; gap:2px; }
a.pf-item { display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:var(--r-16); color:var(--fg); transition:background var(--dur-fast); }
a.pf-item:hover { background:var(--surface-hi); color:var(--fg); }
.pf-item-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.pf-item-title { font-size:var(--fs-body); font-weight:500; line-height:1.45; overflow-wrap:anywhere; }
.pf-item-meta { display:flex; flex-wrap:wrap; gap:4px 12px; font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); }
.pf-item-go { flex-shrink:0; width:16px; height:16px; color:var(--fg-3); transition:color var(--dur-fast), transform var(--dur-fast); }
a.pf-item:hover .pf-item-go { color:var(--accent); transform:translateX(2px); }

/* Yan sütun kartları */
.pf-card { padding:28px; border-radius:var(--r-24); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:18px; }
.pf-card--sunk { background:var(--surface-0); padding:24px 28px; gap:14px; }
html .pf-card-title { font-family:var(--ff-disp); font-weight:400; font-size:30px; /* tasarım */ line-height:1.05; letter-spacing:0; }
html .pf-card-h { font-family:var(--ff); font-size:var(--fs-h3); font-weight:600; line-height:1.35; letter-spacing:0; }
.pf-about-text { font-size:var(--fs-body); line-height:var(--lh-body); color:var(--fg-2); white-space:pre-wrap; overflow-wrap:anywhere; }
.pf-about-text.is-empty { color:var(--fg-3); }
.pf-genres { list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
.pf-set { display:flex; flex-direction:column; gap:10px; }
.pf-set-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.pf-set-name { display:block; font-size:var(--fs-ui); font-weight:600; }
.pf-set-sub { display:block; margin-top:2px; font-size:var(--fs-small); line-height:1.45; color:var(--fg-3); }
.pf-preview { height:120px; border-radius:var(--r-16); background:var(--bg); border:1px solid var(--line); padding:18px; display:flex; flex-direction:column; justify-content:space-between; }
.pf-preview-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:var(--tr-label); text-transform:uppercase; color:var(--fg-3); }
.pf-preview-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.pf-preview-text { font-family:var(--ff-disp); font-size:26px; line-height:1.1; color:var(--accent); }
.pf-preview-btn { flex-shrink:0; height:36px; padding:0 14px; border-radius:var(--r-pill); background:var(--accent); color:var(--accent-ink); font-size:var(--fs-small); font-weight:600; display:inline-flex; align-items:center; }
.pf-link-btn { position:relative; background:none; border:0; padding:6px 0; color:var(--accent); font-family:var(--ff); font-size:var(--fs-small); font-weight:600; cursor:pointer; white-space:nowrap; transition:color var(--dur-fast); }
.pf-link-btn::after { content:''; position:absolute; inset:-8px -6px; }
.pf-link-btn:hover { color:var(--accent-hover); }
.pf-notif-none { font-size:var(--fs-ui); color:var(--fg-3); }
.pf-notif-list { margin:0 -28px -24px; border-top:1px solid var(--line-2); }
.pf-notif-list:empty { display:none; }
html .pf-notif-list .notif-item:last-child { border-bottom:0; border-radius:0 0 var(--r-24) var(--r-24); }
.pf-admin-grid { display:flex; flex-wrap:wrap; gap:8px; }
html .pf-admin-grid .be-tab { height:var(--ctl-sm); padding:0 14px; font-size:var(--fs-small); }
.pf-admin-grid .be-tab .icon { width:14px; height:14px; }
.pf-form-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.pf-note { width:100%; font-size:12px; line-height:1.5; color:var(--fg-3); }
.pf-note:empty { display:none; }
.pf-note.is-ok { color:var(--ok); }
.pf-note.is-err { color:var(--err); }

/* Profili düzenle paneli (ana sütunun başında; "Profili düzenle" açar) */
.pf-edit { padding:28px; border-radius:var(--r-24); background:var(--surface-0); border:1px solid var(--accent-line); display:flex; flex-direction:column; gap:20px; scroll-margin-top:calc(var(--be-sticky-top) + 16px); }
.pf-edit-head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.pf-edit-title { outline:0; }
.pf-edit .field { margin:0; }
.pf-edit-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
.pf-photo-row { display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
.pf-photo-prev { width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1px solid var(--line-ctl); }
.pf-file-btn:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
.pf-edit .pf-genres { margin-bottom:10px; }
.pf-edit .pf-genres:empty { display:none; }
.pf-chip-x { position:relative; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin:-4px -6px -4px 0; border:0; border-radius:50%; background:transparent; color:var(--fg-3); cursor:pointer; transition:color var(--dur-fast), background var(--dur-fast); }
.pf-chip-x::after { content:''; position:absolute; inset:-12px; }
.pf-chip-x:hover { color:var(--err); background:var(--err-soft); }
.pf-chip-x .icon { width:12px; height:12px; }
.pf-genre-add { display:flex; gap:8px; }
.pf-genre-add .input { flex:1; min-width:0; }
.pf-edit .seg { display:flex; width:100%; }
html .pf-edit .seg-btn { flex:1; padding:0 10px; }
.pf-edit-actions { display:flex; flex-wrap:wrap; gap:10px; }

/* ── Mesajlar çekmecesi: her genişlikte sağdan açılır ("Mesajlar" / "Mesaj gönder", mobilde yüzen düğme) ── */
.chat-scrim { position:fixed; inset:0; z-index:calc(var(--z-modal) - 1); background:var(--overlay); opacity:0; visibility:hidden; transition:opacity var(--dur) ease, visibility 0s linear var(--dur); }
html.pf-chat-open .chat-scrim { opacity:1; visibility:visible; transition:opacity var(--dur) ease; }
.chat-panel { position:fixed; top:0; right:0; bottom:0; z-index:var(--z-modal); width:520px; max-width:100vw; display:flex; flex-direction:column; overflow:hidden; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lift); transform:translateX(100%); visibility:hidden; transition:transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); }
.chat-panel.mobile-open { transform:none; visibility:visible; transition:transform var(--dur-slow) var(--ease-out); }
.chat-panel::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--ember-grad); }
.chat-resize-grip { position:absolute; top:0; bottom:0; left:0; width:10px; cursor:ew-resize; z-index:3; }
.chat-resize-grip::after { content:''; position:absolute; left:3px; top:50%; width:3px; height:44px; margin-top:-22px; border-radius:var(--r-pill); background:var(--line-strong); transition:background var(--dur-fast); }
.chat-resize-grip:hover::after { background:var(--accent-line-2); }
.chat-panel-hdr { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; padding:20px 20px 16px 24px; border-bottom:1px solid var(--line-div); }
.chat-panel-title { font-family:var(--ff-disp); font-size:var(--fs-panel); line-height:1.05; color:var(--fg); }
.chat-body { display:flex; flex:1; min-height:0; overflow:hidden; }
.chat-sidebar { width:184px; flex-shrink:0; display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line-div); background:var(--surface-0); }
.chat-search-wrap { flex-shrink:0; padding:12px; border-bottom:1px solid var(--line-div); }
.chat-threads { flex:1; overflow-y:auto; overscroll-behavior:contain; }
.chat-thread { display:flex; align-items:center; gap:10px; padding:12px 12px 12px 10px; border-left:2px solid transparent; border-bottom:1px solid var(--line-2); cursor:pointer; transition:background var(--dur-fast); }
.chat-thread:hover { background:var(--surface-hi); }
.chat-thread:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.chat-thread.active { background:var(--surface-hi); border-left-color:var(--accent); }
.chat-thread-av, .chat-main-av { width:36px; height:36px; flex-shrink:0; border-radius:50%; overflow:hidden; background:var(--surface-4); display:flex; align-items:center; justify-content:center; font-family:var(--ff); font-size:var(--fs-small); font-weight:700; color:var(--accent); }
.chat-main-av { width:32px; height:32px; }
.chat-thread-av img, .chat-main-av img, .chat-msg-sender-av img { width:100%; height:100%; object-fit:cover; display:block; }
.chat-thread-info { flex:1; min-width:0; }
.chat-thread-name { font-size:var(--fs-small); font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-thread.unread .chat-thread-name { color:var(--accent); }
.chat-thread-prev { margin-top:2px; font-size:12px; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-thread-dot { display:none; width:8px; height:8px; flex-shrink:0; border-radius:50%; background:var(--accent); }
.chat-thread.unread .chat-thread-dot { display:block; }
.chat-main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
.chat-main-hdr { display:flex; align-items:center; gap:10px; flex-shrink:0; min-height:60px; padding:10px 16px; border-bottom:1px solid var(--line-div); }
.chat-main-hdr:empty { display:none; }
.chat-main-name { min-width:0; font-size:var(--fs-ui); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-collab-btn { margin-left:auto; flex-shrink:0; }
.chat-msgs { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:16px; display:flex; flex-direction:column; gap:10px; }
.chat-msg { display:flex; max-width:82%; }
.chat-msg.mine { align-self:flex-end; flex-direction:column; align-items:flex-end; }
.chat-msg:not(.mine) { align-self:flex-start; flex-direction:row; align-items:flex-end; gap:8px; }
.chat-msg:has(.collab-req-card) { max-width:100%; }
.chat-msg-content { display:flex; flex-direction:column; min-width:0; }
.chat-msg-sender-av { width:28px; height:28px; flex-shrink:0; border-radius:50%; overflow:hidden; background:var(--surface-4); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--accent); text-decoration:none; }
.chat-msg-text { padding:10px 14px; font-size:var(--fs-ui); line-height:1.5; color:var(--fg); white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-16) var(--r-16) var(--r-16) var(--r-6); }
.chat-msg.mine .chat-msg-text { background:var(--accent-soft); border-color:var(--accent-line); border-radius:var(--r-16) var(--r-16) var(--r-6) var(--r-16); }
.chat-msg-time { margin-top:4px; padding:0 4px; font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.04em; color:var(--fg-faint); }

  if (!ts) return '';

async function _sendMsg(fromUid, fromName, fromPhoto, toUid, toName, toPhoto, text) {
  if (fromUid === toUid) throw new Error(window._i18n?.getLang()==='en' ? 'You cannot message yourself.' : `Kendinize mesaj gönderemezsiniz.`);
  const cid = _chatId(fromUid, toUid);
  const chatRef = db.collection('chats').doc(cid);
  const msgRef = chatRef.collection('messages').doc();
  const batch = db.batch();
  batch.set(chatRef, {
    participants:[fromUid,toUid],
    names:{[fromUid]:fromName,[toUid]:toName},
    photos:{[fromUid]:fromPhoto||'',[toUid]:toPhoto||''},
    lastMessage:text.slice(0,100),
    lastAt:firebase.firestore.FieldValue.serverTimestamp(),
    unreadBy:firebase.firestore.FieldValue.arrayUnion(toUid),
  }, { merge:true });
  batch.set(msgRef, {
    fromUid,
    text:text.slice(0,2000),
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
  await batch.commit();
  db.collection('notifications').doc(toUid).collection('items').add({
    text:`${fromName}: ${text.slice(0,60)}${text.length>60?'…':''}`,
    read:false, fromUid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(()=>{});
}

function _buildChatThread(chatDoc, myUid) {

    otherId = chat.participants?.[0] || '';

  return _btnify(el);
}

  // Patch: show/hide empty state when a thread is opened

  // Load chat list real-time — admin sees all, others see own

    ? db.collection('chats').orderBy('lastAt','desc').limit(100)

  _chatListUnsub = chatQuery.onSnapshot(snap => {

}

// Bildirim satırı — zil paneli ve profildeki "Bildirimler" kartı aynı satırı kullanır
function _notifItem(n, uid, annSec) {
  const isUnread = n._t==='p' ? !n.read : (n.createdAt?.seconds||0) > annSec;
  const item = document.createElement('div'); item.className = 'notif-item' + (isUnread ? ' unread' : '');
  const timeStr = n.createdAt ? n.createdAt.toDate().toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  const _nt=document.createElement('div');_nt.className='notif-item-text';_nt.textContent=(n.text||L('prof_notif_new', 'Yeni bildirim', 'New notification'));if(n._t==='a')_nt.insertAdjacentHTML('afterbegin','<svg class="icon notif-ann-icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-info"/></svg> ');const _ni=document.createElement('div');_ni.className='notif-item-time';_ni.textContent=timeStr;item.append(_nt,_ni);
  let act = null;
  // Sıra: collab isteği → gönderenin profili; konu bildirimi (yanıt, takip edilenin yeni konusu) → konu;
  // yalnız gönderen taşıyan (DM, collab kabulü) → sohbet çekmecesi
  if (n.type === 'collab' && n.fromUid) act = () => { location.href = `profile?uid=${n.fromUid}`; };
  else if (n.postId) act = () => { location.href = `post?id=${n.postId}`; };
  else if (n.fromUid) { act = () => { _closePanels(); openChatWith(n.fromUid, n.fromName); }; item.setAttribute('data-pf-chat', ''); }
  if (act) { item.onclick = act; _btnify(item); }
  if (n._id) {
    const del = document.createElement('button'); del.type = 'button'; del.className = 'notif-del-btn'; del.textContent = '×'; del.title = 'Sil'; del.setAttribute('aria-label', L('prof_notif_del', 'Bildirimi sil', 'Delete notification'));
    del.onclick = e => {
      e.stopPropagation();
      if (n._t === 'p') {
        db.collection('notifications').doc(uid).collection('items').doc(n._id).delete().catch(() => {});
      } else {
        if (!_dismissedAnns.includes(n._id)) { _dismissedAnns.push(n._id); }
        db.collection('users').doc(uid).update({ dismissedAnns: firebase.firestore.FieldValue.arrayUnion(n._id) }).catch(() => {});
        _announcements = _announcements.filter(a => a._id !== n._id);
        _mergeNotifs(uid);
      }
    };
    item.append(del);
  }
  return item;
}

function _renderSideNotifs(uid) {
  const list = document.getElementById('pfNotifList');
  const none = document.getElementById('pfNotifNone');
  if (!list || !none) return;
  list.innerHTML = '';
  none.hidden = _lastNotifAll.length > 0;
  _lastNotifAll.slice(0, 6).forEach(n => list.append(_notifItem(n, uid, _lastAnnSec)));
}

function _mergeNotifs(uid) {
  const all = [
    ..._personalNotifs.map(n => ({...n, _t:'p'})),
    ..._announcements.filter(n => !_dismissedAnns.includes(n._id)).map(n => ({...n, _t:'a'}))
  ].sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
  const annSec = _annSeenAt?.seconds || 0;
  _lastNotifAll = all; _lastAnnSec = annSec;
  const unread = _personalNotifs.filter(n => !n.read).length
    + _announcements.filter(n => (n.createdAt?.seconds||0) > annSec).length;
  const badge = document.querySelector('.notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.style.display = unread > 0 ? 'block' : 'none'; }
  if (unread > _prevUnreadCount) {
    const bell = document.querySelector('.notif-bell');
    if (bell) { bell.classList.remove('ringing'); void bell.offsetWidth; bell.classList.add('ringing'); setTimeout(() => bell.classList.remove('ringing'), 1800); }
  }
  _prevUnreadCount = unread;
  const list = _notifPanelEl?.querySelector('.notif-list');
  if (list) {
    list.innerHTML = '';
    if (!all.length) list.append(el('div', 'notif-empty', L('prof_notif_empty', 'Bildirim yok', 'No notifications')));
    else all.forEach(n => list.append(_notifItem(n, uid, annSec)));
  }
  _renderSideNotifs(uid);
}

function markAllNotifRead(uid) {
  db.collection('notifications').doc(uid).collection('items')
    .where('read', '==', false).get().then(snap => {
      const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { read: true })); batch.commit();
    }).catch(() => {});
  db.collection('users').doc(uid).set({ announcementsSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
  _annSeenAt = { seconds: Date.now() / 1000 };
  _personalNotifs = _personalNotifs.map(n => ({...n, read: true}));
  _mergeNotifs(uid);
}

  }).catch(() => {});
  _notifUnsub = db.collection('notifications').doc(user.uid).collection('items')
    .orderBy('createdAt', 'desc').limit(20)
    .onSnapshot(snap => {
      _personalNotifs = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (snap.docs.length > 4) { const b = db.batch(); snap.docs.slice(4).forEach(d => b.delete(d.ref)); b.commit().catch(() => {}); }
      _mergeNotifs(user.uid);
    }, () => {});
  _annUnsub = db.collection('announcements').orderBy('createdAt', 'desc').limit(15)
    .onSnapshot(snap => { _announcements = snap.docs.map(d => ({...d.data(), _id: d.id})); _mergeNotifs(user.uid); }, () => {});
}

let _fnLoad = null;
function _loadFunctions() {
  if (typeof firebase.functions === 'function') return Promise.resolve();
  if (_fnLoad) return _fnLoad;
  _fnLoad = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js';
    s.onload = () => res();
    s.onerror = () => { _fnLoad = null; rej(new Error('functions-sdk')); };
    document.head.append(s);
  });
  return _fnLoad;
}

          const MAX = 200;

          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;

          instagram:     igInput.value.trim(),
          spotify:       spInput.value.trim(),
          soundcloudUrl: scInput.value.trim(),
          mixcloudUrl:   mcInput.value.trim(),
          customPhotoURL: _customPhotoData || '',
          collabStatus:  selCollab,
        };
        if (!prof.joinedAt) update.joinedAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('users').doc(uid).set(update, { merge: true });
        // Immediately update avatar in DOM without waiting for re-render
        if (_customPhotoData) { const av = document.querySelector('.pf-ava-in'); if (av) setAva(av, _customPhotoData, displayName); }
        saveBtn.textContent = window._i18n?.t('prof_saved')||'✓ Kaydedildi';
        showToast(window._i18n?.t('prof_saved_toast')||'✓ Profil güncellendi!');
        setTimeout(async () => {
          // Force server read after save to reflect latest data
          await db.collection('users').doc(uid).get({ source: 'server' }).catch(() => {});
          _pfEditOpen = true; // form yeniden açık gelsin ki kaydedilen değerler görünsün
          await renderProfile().catch(console.error);
        }, 1000);
      } catch(e) { const c=errId(); console.error('[save]',c,e); saveBtn.disabled=false; saveBtn.textContent=`${window._i18n?.t('prof_save_err')||'Kayıt başarısız'} (${c})`; }
    };
    acts.append(saveBtn, cancelBtn);
    editPanel.append(acts);
    col.append(editPanel);
    if (editBtn) editBtn.onclick = () => setEdit(editPanel.hidden, true);
    setEdit(_pfEditOpen, false);
  }

  // İstatistikler
  const stats = el('section', 'pf-stats');
  stats.setAttribute('aria-label', L('prof_stats', 'İstatistikler', 'Stats'));
  const stat = (val, label) => {
    const s = el('div', 'pf-stat');
    const v = el('span', 'pf-stat-val', String(val));
    s.append(v, el('span', 'pf-stat-lbl', label));
    stats.append(s);
    return v;
  };
  stat(posts.length, window._i18n?.t('prof_topics')||'Konu');
  stat(prof.replyCount || replyDocs.length || 0, window._i18n?.t('prof_replies')||'Yanıt');
  followValRef.el = stat(followerCount, window._i18n?.t('prof_followers')||'Takipçi');
  col.append(stats);

  // Ünvan ilerlemesi (ünvanı yalnız admin verir; burada yalnız gösterilir)
  const rankBox = el('section', 'pf-box pf-rankbox');
  rankBox.setAttribute('aria-labelledby', 'pfRankLbl');
  const rHead = el('div', 'pf-row-head');
  const rLbl = el('h2', 'pf-lbl', L('prof_rank_progress', 'Ünvan ilerlemesi', 'Title progress')); rLbl.id = 'pfRankLbl';
  rHead.append(rLbl, el('span', 'pf-rank-step', `${rankIdx + 1} / ${RANK_KEYS.length}`));
  const steps = el('ol', 'pf-steps');
  RANK_KEYS.forEach((k, i) => {
    const li = el('li', [i <= rankIdx ? 'is-done' : '', i < rankIdx ? 'is-past' : ''].join(' ').trim());
    if (i === rankIdx) li.setAttribute('aria-current', 'step');
    const bar = el('span', 'pf-step-bar'); bar.setAttribute('aria-hidden', 'true');
    li.append(bar, el('span', 'pf-step-lbl', _getTitleLabel(k)));
    steps.append(li);
  });
  rankBox.append(rHead, steps);
  if (rankIdx < 0 && _user) rankBox.append(el('p', 'pf-rank-note', L('prof_rank_none', 'Henüz ünvan yok. Ünvanları Berkay Er verir.', 'No title yet. Titles are given by Berkay Er.')));
  col.append(rankBox);

  // Etkinlik sekmeleri: Son konular · Son yorumlar · Collab
  const tabsBox = el('section', 'pf-box pf-tabsbox');
  const tabsH = el('h2', 'sr-only', L('prof_activity', 'Etkinlik', 'Activity')); tabsH.id = 'pfActH';
  const tl = el('div', 'pf-tablist'); tl.setAttribute('role', 'tablist'); tl.setAttribute('aria-labelledby', 'pfActH');
  const TABS = [
    { id:'konular',  long:L('prof_tab_topics', 'Son konular', 'Recent topics'),   short:L('prof_tab_topics_s', 'Konular', 'Topics') },
    { id:'yorumlar', long:L('prof_tab_replies', 'Son yorumlar', 'Recent replies'), short:L('prof_tab_replies_s', 'Yorumlar', 'Replies') },
    { id:'collab',   long:'Collab', short:'Collab' },
  ];
  const panels = {}, tabBtns = [];
  TABS.forEach(t => {
    const b = el('button', 'pf-tab'); b.type = 'button'; b.id = 'pfTab-' + t.id;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'pfPanel-' + t.id);
    b.append(el('span', 'pf-tl-long', t.long), el('span', 'pf-tl-short', t.short));
    b.onclick = () => selectTab(t.id, false);
    tl.append(b); tabBtns.push(b);
    const p = el('div', 'pf-panel'); p.id = 'pfPanel-' + t.id; p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id); p.tabIndex = 0;
    panels[t.id] = p;
  });
  function selectTab(id, focus) {
    _pfTab = id;
    TABS.forEach((t, i) => {
      const on = t.id === id;
      tabBtns[i].setAttribute('aria-selected', String(on));
      tabBtns[i].tabIndex = on ? 0 : -1;
      panels[t.id].hidden = !on;
    });
    if (focus) tabBtns[TABS.findIndex(t => t.id === id)]?.focus();
  }
  tl.addEventListener('keydown', e => {
    const i = tabBtns.indexOf(document.activeElement); if (i < 0) return;
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % TABS.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = TABS.length - 1;
    if (j === null) return;
    e.preventDefault(); selectTab(TABS[j].id, true);
  });
  const emptyBox = (text, links) => {
    const w = el('div', 'pf-empty be-rv');
    w.insertAdjacentHTML('beforeend', '<svg class="pf-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg>');
    w.append(el('p', null, text));
    const row = el('div', 'pf-empty-links');
    (links || []).forEach(l => row.append(l));
    if (row.childElementCount) w.append(row);
    return w;
  };
  const itemRow = (href, title, metaParts) => {
    const li = el('li');
    const a = el('a', 'pf-item'); a.href = href;
    const b = el('span', 'pf-item-body');
    b.append(el('span', 'pf-item-title', title));
    const m = el('span', 'pf-item-meta');
    metaParts.filter(Boolean).forEach(t => m.append(el('span', null, t)));
    b.append(m);
    a.append(b);
    a.insertAdjacentHTML('beforeend', '<svg class="icon pf-item-go" aria-hidden="true"><use href="/assets/img/icons.svg#i-arrow-right"/></svg>');
    li.append(a);
    return li;
  };
  // Son konular
  if (posts.length === 0) {
    panels.konular.append(emptyBox(window._i18n?.t('prof_no_topics')||'Henüz konu açılmamış.', [linkTo('forum', L('prof_go_forum', 'Foruma git', 'Go to forum'))]));
  } else {
    const ul = el('ul', 'pf-list');
    posts.forEach(p => {
      const rc = p.replyCount || 0;
      ul.append(itemRow(`post?id=${p.id}`, p.title || (p.text?.slice(0,60)+'…') || '', [fmtDate(p.createdAt), L('prof_n_replies', '{n} yanıt', '{n} replies').replace('{n}', rc)]));
    });
    panels.konular.append(ul);
  }
  // Son yorumlar (yanıtlar)
  if (replies.length === 0) {
    const txt = isOwn
      ? L('prof_no_replies_own', `Henüz yorum yapılmamış. Forum'da ilk yorumunu yaptıktan sonra burada görünür.`, 'No replies yet. Forum replies will appear here after your first post.')
      : (window._i18n?.t('prof_no_replies')||'Henüz yanıt verilmemiş.');
    panels.yorumlar.append(emptyBox(txt, [linkTo('forum', L('prof_browse_topics', 'Konulara göz at', 'Browse topics'))]));
  } else {
    const ul = el('ul', 'pf-list');
    replies.forEach(r => {
      const rtxt = r.text || r.content || '';
      ul.append(itemRow(`post?id=${r.postId}`, rtxt.length > 80 ? rtxt.slice(0,80) + '…' : rtxt, [fmtDate(r.createdAt)]));
    });
    panels.yorumlar.append(ul);
  }
  // Collab: gerçek işbirliği durumuna göre
  const renderCollabPanel = () => {
    const p = panels.collab; p.innerHTML = '';
    const nameFill = s => s.replace('{ad}', first);
    const links = [];
    let text;
    if (isOwn) {
      text = collab === 'open' ? L('prof_collab_own_open', 'Projelere açık görünüyorsun. Collab istekleri Mesajlar panelinde görünür.', 'You appear open to projects. Collab requests show up in Messages.')
        : collab === 'busy' ? L('prof_collab_own_busy', 'Şu an meşgul görünüyorsun. Gelen collab istekleri yine Mesajlar panelinde görünür.', 'You appear busy. Incoming collab requests still show up in Messages.')
        : L('prof_collab_own_none', 'İşbirliği durumunu belirtmedin. Yukarıdaki durum düğmesinden seçebilirsin.', 'You have not set a collab status. Pick one with the status button above.');
      if (_user) {
        const open = el('button', 'btn-link'); open.type = 'button'; open.setAttribute('data-pf-chat', ''); open.setAttribute('aria-controls', 'pfChat');
        open.append(el('span', null, L('prof_open_messages', 'Mesajları aç', 'Open messages')), arrow());
        open.onclick = e => { e.stopPropagation(); openChatPanel(open); };
        links.push(open);
      }
      links.push(linkTo('members', L('prof_explore_members', 'Üyeleri keşfet', 'Explore members')));
    } else if (!_user) {
      text = L('prof_collab_signin', 'İşbirliği durumunu görmek ve collab isteği göndermek için giriş yap.', 'Sign in to see the collab status and send a collab request.');
      const si = el('button', 'btn btn-primary btn-sm', window._i18n?.t('auth_signin')||'Giriş Yap'); si.type = 'button'; si.onclick = doSignIn;
      links.push(si);
    } else {
      text = nameFill(collab === 'open' ? L('prof_collab_other_open', '{ad} yeni projelere açık.', '{ad} is open to new projects.')
        : collab === 'busy' ? L('prof_collab_other_busy', '{ad} şu an meşgul; yine de istek gönderebilirsin.', '{ad} is busy right now; you can still send a request.')
        : L('prof_collab_other_none', '{ad} işbirliği durumunu belirtmemiş.', '{ad} has not set a collab status.'));
      const cb = el('button', 'btn btn-primary btn-sm', L('prof_btn_collab', 'Collab isteği gönder', 'Send collab request')); cb.type = 'button';
      cb.onclick = () => sendCollab(cb);
      links.push(cb, linkTo('members', L('prof_explore_members', 'Üyeleri keşfet', 'Explore members')));
    }
    const box = emptyBox(text, links);
    box.classList.remove('be-rv');
    p.append(box);
  };
  renderCollabPanel();
  collabListeners.push(() => renderCollabPanel());
  tabsBox.append(tabsH, tl, panels.konular, panels.yorumlar, panels.collab);
  col.append(tabsBox);
  selectTab(TABS.some(t => t.id === _pfTab) ? _pfTab : 'konular', false);

  // ── Yan sütun ─────────────────────────────────────────────────
  // Hakkında + türler
  const about = el('section', 'pf-card pf-about'); about.setAttribute('aria-labelledby', 'pfAboutH');
  const aboutH = el('h2', 'pf-card-title', window._i18n?.t('prof_about_label')||'Hakkında'); aboutH.id = 'pfAboutH';
  about.append(aboutH);
  const aboutTxt = prof.about || (isOwn ? (window._i18n?.t('prof_about_empty')||'Kendinden bahset...') : '');
  const genres = prof.genres || [];
  if (aboutTxt) { const p = el('p', 'pf-about-text' + (prof.about ? '' : ' is-empty'), aboutTxt); about.append(p); }
  if (genres.length) {
    const ul = el('ul', 'pf-genres');
    genres.forEach(g => ul.append(el('li', 'be-chip', g)));
    about.append(ul);
  }
  if (!aboutTxt && !genres.length) {
    about.append(el('p', 'pf-about-text is-empty', _user ? L('prof_about_none', 'Henüz bilgi eklenmemiş.', 'Nothing added yet.')
      : L('prof_about_signin', 'Profil ayrıntılarını görmek için giriş yap.', 'Sign in to see profile details.')));
  }
  side.append(about);

  // Görünüm ayarları (kendi profili; yalnız bu tarayıcıda saklanır)
  if (isOwn && _user) {
    const set = el('section', 'pf-card pf-settings'); set.setAttribute('aria-labelledby', 'pfSetH');
    const setH = el('h2', 'pf-card-title', L('prof_appearance', 'Görünüm ayarları', 'Appearance')); setH.id = 'pfSetH';
    const blk = el('div', 'pf-set');
    blk.append(el('span', 'pf-lbl', L('prof_set_text', 'Yazı', 'Text')));
    const row = el('div', 'pf-set-row');
    const info = el('div');
    const nm = el('span', 'pf-set-name', window._i18n?.t('prof_font_label')||'Font Netleştir'); nm.id = 'pfFontLbl';
    const sub = el('span', 'pf-set-sub', window._i18n?.t('prof_font_sub')||'Yazıları daha büyük ve okunaklı gösterir'); sub.id = 'pfFontSub';
    info.append(nm, sub);
    const sw = el('button', 'be-switch'); sw.type = 'button';
    sw.setAttribute('role', 'switch'); sw.setAttribute('aria-labelledby', 'pfFontLbl'); sw.setAttribute('aria-describedby', 'pfFontSub');
    let fontOn = false; try { fontOn = localStorage.getItem('site-font-clear') === '1'; } catch (e) {}
    sw.setAttribute('aria-checked', String(fontOn));
    sw.onclick = () => {
      const on = sw.getAttribute('aria-checked') !== 'true';
      sw.setAttribute('aria-checked', String(on));
      try { localStorage.setItem('site-font-clear', on ? '1' : '0'); } catch (e) {}
      document.documentElement.classList.toggle('font-clear', on);
    };
    row.append(info, sw);
    blk.append(row);
    const prev = el('div', 'pf-preview'); prev.setAttribute('aria-hidden', 'true');
    const prow = el('div', 'pf-preview-row');
    prow.append(el('span', 'pf-preview-text', L('prof_preview_text', 'Yazı önizlemesi', 'Text preview')), el('span', 'pf-preview-btn', L('prof_preview_btn', 'Buton', 'Button')));
    prev.append(el('span', 'pf-preview-lbl', L('prof_preview', 'Önizleme', 'Preview')), prow);
    set.append(setH, blk, prev);
    side.append(set);

    // Bildirimler (zil panelindekiyle aynı veri)
    const nc = el('section', 'pf-card pf-card--sunk pf-notifs'); nc.setAttribute('aria-labelledby', 'pfNotifH');
    const nh = el('div', 'pf-row-head');
    const nTitle = el('h2', 'pf-card-h', window._i18n?.t('ui_notifications')||'Bildirimler'); nTitle.id = 'pfNotifH';
    const ra = el('button', 'pf-link-btn', L('prof_read_all', 'Tümünü oku', 'Mark all read')); ra.type = 'button';
    ra.onclick = () => markAllNotifRead(_user.uid);
    nh.append(nTitle, ra);
    const none = el('p', 'pf-notif-none', L('prof_notif_empty', 'Bildirim yok', 'No notifications')); none.id = 'pfNotifNone';
    const list = el('div', 'pf-notif-list'); list.id = 'pfNotifList';
    nc.append(nh, none, list);
    side.append(nc);
  }

  // Admin: başkasının profilinde ünvan ata + mail gönder
  const adminCard = (title) => {
    const c = el('section', 'pf-card pf-card--sunk pf-admin');
    const tag = el('span', 'be-label be-label--sm', 'Admin'); tag.lang = 'en';
    c.append(tag, el('h2', 'pf-card-h', title));
    return c;
  };
  if (isAdmin(_user) && !isOwn) {
    const panel = adminCard('Ünvan Ata');
    const grid = el('div', 'pf-admin-grid'); grid.setAttribute('role', 'group'); grid.setAttribute('aria-label', 'Ünvan Ata');
    let selKey = prof.title || 'none';
    TITLES.forEach(t => {
      const btn = el('button', 'be-tab title-opt'); btn.type = 'button';
      btn.setAttribute('aria-pressed', String(selKey === t.key));
      if (t.icon) btn.insertAdjacentHTML('beforeend', ic(t.icon));
      btn.append(el('span', null, t.labelTr));
      btn.onclick = () => {
        selKey = t.key;
        grid.querySelectorAll('.title-opt').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      };
      grid.append(btn);
    });
    const saveBtn = el('button', 'btn btn-primary btn-sm', 'Ünvanı Kaydet'); saveBtn.type = 'button';
    saveBtn.onclick = async () => {
      saveBtn.disabled = true; saveBtn.textContent = '…';
      try {
        await db.collection('users').doc(uid).set({ title: selKey }, { merge: true });
        showToast('✓ Ünvan güncellendi');
        renderProfile();
      } catch(e) {
        showToast('Kayıt başarısız: ' + (e.code || e.message || 'Bilinmeyen hata'), 'error');
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Ünvanı Kaydet';
    };
    const saveRow = el('div', 'pf-form-row'); saveRow.append(saveBtn);
    panel.append(grid, saveRow);
    side.append(panel);

    // Admin email panel
    const emailPanel = adminCard('Mail Gönder');
    const emailSubject = el('input', 'input input-sm'); emailSubject.type = 'text';
    emailSubject.placeholder = 'Konu (opsiyonel)'; emailSubject.setAttribute('aria-label', emailSubject.placeholder);
    const emailTa = el('textarea', 'textarea');
    emailTa.placeholder = 'Mesaj içeriği...'; emailTa.setAttribute('aria-label', emailTa.placeholder);
    const emailRow = el('div', 'pf-form-row');
    const emailSend = el('button', 'btn btn-primary btn-sm', 'Gönder'); emailSend.type = 'button';
    const emailStatus = el('p', 'pf-note'); emailStatus.setAttribute('role', 'status');
    emailSend.onclick = async () => {
      const msg = emailTa.value.trim();
      if (!msg) { emailTa.focus(); return; }
      const toEmail = prof.email;
      if (!toEmail) { setNote(emailStatus, 'Bu üyenin email adresi bulunamadı', 'err'); return; }
      emailSend.disabled = true; emailSend.textContent = '…';
      try {
        await _loadFunctions();
        const fn = firebase.app().functions('europe-west1').httpsCallable('sendCustomEmail');
        await fn({ toEmail, toName: displayName, subject: emailSubject.value.trim() || 'Berkay Er Academy', message: msg });
        emailTa.value = ''; emailSubject.value = '';
        setNote(emailStatus, '✓ Mail gönderildi: ' + toEmail, 'ok');
        setTimeout(() => { setNote(emailStatus, ''); }, 4000);
      } catch(e) {
        setNote(emailStatus, 'Hata: ' + (e.code || e.message), 'err');
      }
      emailSend.disabled = false; emailSend.textContent = 'Gönder';
    };
    emailRow.append(emailSend, emailStatus);
    emailPanel.append(emailSubject, emailTa, emailRow);
    side.append(emailPanel);
  }

  // Admin: kendi profilinde duyuru + mesaj yönetimi
  if (isAdmin(_user) && isOwn) {
    const annPanel = adminCard('Tüm Üyelere Duyuru Gönder');
    const annTa = el('textarea', 'textarea');
    annTa.placeholder = 'Yeni özellik, güncelleme veya duyuru metni...'; annTa.setAttribute('aria-label', 'Duyuru metni');
    const annRow = el('div', 'pf-form-row');
    const annSend = el('button', 'btn btn-primary btn-sm', 'Gönder'); annSend.type = 'button';
    const annDelAll = el('button', 'btn btn-danger btn-sm', 'Tümünü Sil'); annDelAll.type = 'button';
    const annStatus = el('p', 'pf-note'); annStatus.setAttribute('role', 'status');
    annSend.onclick = async () => {
      const txt = annTa.value.trim();
      if (!txt) { annTa.focus(); return; }
      annSend.disabled = true; annSend.textContent = '…';
      try {
        await db.collection('announcements').add({
          text: txt,
          fromName: _user.displayName?.split(' ')[0] || 'Admin',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          type: 'update',
        });
        annTa.value = '';
        setNote(annStatus, '✓ Duyuru gönderildi', 'ok');
        setTimeout(() => { setNote(annStatus, ''); }, 3000);
      } catch(e) {
        setNote(annStatus, 'Hata: ' + (e.code || e.message), 'err');
      }
      annSend.disabled = false; annSend.textContent = 'Gönder';
    };
    annDelAll.onclick = async () => {
      if (!confirm(`Tüm duyuruları silmek istediğine emin misin?`)) return;
      annDelAll.disabled = true; annDelAll.textContent = '…';
      try {
        const snap = await db.collection('announcements').get();
        const batch = db.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        setNote(annStatus, '✓ Tüm duyurular silindi', 'ok');
        setTimeout(() => { setNote(annStatus, ''); }, 3000);
      } catch(e) {
        setNote(annStatus, 'Hata: ' + (e.code || e.message), 'err');
      }
      annDelAll.disabled = false; annDelAll.textContent = 'Tümünü Sil';
    };
    annRow.append(annSend, annDelAll, annStatus);
    annPanel.append(annTa, annRow);
    side.append(annPanel);

    // Delete all chats panel
    const msgPanel = adminCard('Mesaj Yönetimi');
    const msgRow = el('div', 'pf-form-row');
    const msgDelAll = el('button', 'btn btn-danger btn-sm', 'Tüm Mesajları Sil'); msgDelAll.type = 'button';
    const msgStatus = el('p', 'pf-note'); msgStatus.setAttribute('role', 'status');
    msgDelAll.onclick = async () => {
      if (!confirm(`Tüm sohbet mesajlarını silmek istediğine emin misin? Bu işlem geri alınamaz.`)) return;
      msgDelAll.disabled = true; msgDelAll.textContent = 'Siliniyor…';
      try {
        const chatSnap = await db.collection('chats').get();
        for (const chatDoc of chatSnap.docs) {
          const msgSnap = await chatDoc.ref.collection('messages').get();
          const batch = db.batch();
          msgSnap.docs.forEach(m => batch.delete(m.ref));
          batch.delete(chatDoc.ref);
          await batch.commit();
        }
        setNote(msgStatus, '✓ Tüm mesajlar silindi (' + chatSnap.size + ' sohbet)', 'ok');
        setTimeout(() => { setNote(msgStatus, ''); }, 4000);
      } catch(e) {
        setNote(msgStatus, 'Hata: ' + (e.code || e.message), 'err');
      }
      msgDelAll.disabled = false; msgDelAll.textContent = 'Tüm Mesajları Sil';
    };
    msgRow.append(msgDelAll, msgStatus);
    msgPanel.append(msgRow);
    side.append(msgPanel);
  }

  bodyGrid.append(col, side);
  layout.append(bodyGrid);
  window.beShell?.observeAnim?.(layout);
  if (isOwn && _user) _renderSideNotifs(_user.uid);
}

window.bkAuth.handleRedirectResult();
auth.onAuthStateChanged(async user => {
  _user = user;
  updateAuthBar(user);
  initNotifications(user);
  initChatPanel(user);
  if (user) {
    const uref = db.collection('users').doc(user.uid);
    const snap = await uref.get({ source: 'server' }).catch(() => uref.get().catch(() => null));
    const update = { displayName: user.displayName?.trim() || user.email?.split('@')[0] || '', photoURL: user.photoURL || '', email: user.email };
    if (!snap?.data()?.joinedAt) update.joinedAt = firebase.firestore.FieldValue.serverTimestamp();
    await uref.set(update, { merge: true }).catch(console.error);
  }
  await renderProfile();
  _pfReady = true;
});

// Dil değişince (i18n.js <html lang>'ı günceller) profil yeni dille yeniden çizilir; düzenleme açıkken dokunulmaz
let _pfLang = document.documentElement.lang;
new MutationObserver(() => {
  const l = document.documentElement.lang;
  if (l === _pfLang) return;
  _pfLang = l;
  if (_pfReady && !_pfEditOpen) renderProfile();
}).observe(document.documentElement, { attributes:true, attributeFilter:['lang'] });
</script>

</body>
</html>
