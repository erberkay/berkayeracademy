<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkay Er Academy — Uygulama Girişi</title>
<meta name="theme-color" content="#0b0b0e">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/ui.css?v=202610062100">
<style>
  /* ═══════════════════════════════════════════════════════════════
     UYGULAMA GİRİŞİ (app-bridge) — tasarımı yok; TASARIM.md token'ları.
     Yerel uygulamanın açtığı tek amaçlı sayfa: site kabuğu (başlık,
     sekme çubuğu) bilerek yok. Marka işareti = kabuktaki .be-mark'ın
     büyük hâli (themes.css bu sayfada yüklenmez).
     ═══════════════════════════════════════════════════════════════ */
  .ab {
    position:relative; isolation:isolate; overflow:hidden;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:var(--s5); padding:var(--s7) var(--page-x);
    text-align:center;
  }
  /* sabit radial ışık (animasyonsuz) + 80px ızgara */
  .ab::before {
    content:''; position:absolute; z-index:-1; left:50%; top:-340px;
    width:880px; height:880px; transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(212,114,42,.16), rgba(184,45,69,.06) 55%, transparent);
    pointer-events:none;
  }
  .ab::after {
    content:''; position:absolute; z-index:-2; inset:0;
    background-image:linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:80px 80px; background-position:center top;
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%);
            mask-image:radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%);
    pointer-events:none;
  }

  /* Marka */
  .ab-brand { display:flex; flex-direction:column; align-items:center; gap:var(--s-14); }
  .ab-mark {
    position:relative; overflow:hidden; width:56px; height:56px; border-radius:var(--r-14);
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-ink); border:1px solid var(--line-ctl);
    font-family:var(--ff); font-weight:700; font-size:20px; letter-spacing:-.5px; color:var(--accent);
  }
  .ab-mark::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--ember-grad); background-size:200% 100%; animation:be-flow 6s linear infinite; }
  .ab-brand-text { font-family:var(--ff-mono); font-size:var(--fs-label); letter-spacing:var(--tr-brand); text-transform:uppercase; color:var(--fg-3); }

  /* Kart (ana panel dili: surface-0, radius 28, üstte ember şeridi) */
  .ab-card {
    position:relative; overflow:hidden; width:100%; max-width:440px;
    display:flex; flex-direction:column; align-items:center; gap:var(--s4);
    padding:var(--s-40) var(--s-40) var(--s-40);
    background:var(--surface-0); border:1px solid var(--line); border-radius:var(--r-28);
    box-shadow:var(--shadow-lift);
  }
  .ab-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--ember-grad); background-size:200% 100%; animation:be-flow 6s linear infinite; }

  /* Durum ikonu: 64px daire, çizgi ikon (emoji yerine) */
  .ab-state {
    --c:var(--accent); --c-soft:var(--accent-soft); --c-line:var(--accent-line);
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--c-soft); border:1px solid var(--c-line); color:var(--c);
    animation:be-pop .35s var(--ease-out) both;
  }
  .ab-state svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .ab-state--ok { --c:var(--ok); --c-soft:var(--ok-soft); --c-line:var(--ok-line); }
  .ab-state--err { --c:var(--err); --c-soft:var(--err-soft); --c-line:var(--err-line); }
  .ab-state--muted { --c:var(--fg-2); --c-soft:var(--surface-2); --c-line:var(--line-strong); }
  .ab-state--wait { background:transparent; border-color:transparent; animation:none; }
  .ab-spinner { width:40px; height:40px; border-radius:50%; border:3px solid var(--track); border-top-color:var(--accent); animation:be-spin .8s linear infinite; }

  .ab-title { font-family:var(--ff-disp); font-weight:400; font-size:var(--fs-h2); line-height:1.05; letter-spacing:-.01em; color:var(--fg); margin-top:var(--s1); }
  .ab-title:focus { outline:none; }
  .ab-text { font-size:var(--fs-body); line-height:1.6; color:var(--fg-muted); max-width:34ch; }
  .ab-err {
    width:100%; padding:var(--s3) var(--s4); border-radius:var(--r-14);
    background:var(--err-soft); border:1px solid var(--err-line); color:var(--err);
    font-family:var(--ff-mono); font-size:12px; line-height:1.6; text-align:left;
    overflow-wrap:anywhere;
  }
  .ab-card .btn { margin-top:var(--s2); }
  .ab-g { width:18px; height:18px; flex-shrink:0; }

  @media (max-width:600px) {
    .ab { justify-content:flex-start; padding-top:var(--s8); }
    .ab-card { padding:var(--s6) var(--s5); border-radius:var(--r-20); }
    .ab-card .btn { width:100%; }
  }
</style>
</head>
<body>
<main class="ab">
  <div class="ab-brand">
    <div class="ab-mark" aria-hidden="true">BE</div>
    <div class="ab-brand-text">Berkay Er Academy</div>
  </div>

  <section class="ab-card" id="card" aria-live="polite">
    <div class="ab-state ab-state--wait" aria-hidden="true"><span class="ab-spinner"></span></div>
    <h1 class="ab-title">Uygulama Girişi</h1>
    <p class="ab-text">Yükleniyor...</p>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyDX8AkwDejrkh5L4xUXQcmzKq-DYvc2E8A",
  authDomain:        "berkayeracademy.com",
  projectId:         "ableton-tutorial",
  storageBucket:     "ableton-tutorial.firebasestorage.app",
  messagingSenderId: "677640687230",
  appId:             "1:677640687230:web:8c6a2dfefbf55c69ffd22f",
})
const _auth = firebase.auth()
const _db   = firebase.firestore()

const bridgeKey = new URLSearchParams(window.location.search).get('bridge_key')
const card      = document.getElementById('card')

// ── Görünüm parçaları (emoji yerine çizgi ikonlar; Google "G" logosu marka rengiyle kalır)
const ICONS = {
  lock:  `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  ok:    `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  cancel:`<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  err:   `<svg viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2h.01"/></svg>`,
}
const GOOGLE_G = `
  <svg class="ab-g" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
    <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
  </svg>`

function stateIcon(kind) {
  if (kind === 'wait') return `<div class="ab-state ab-state--wait" aria-hidden="true"><span class="ab-spinner"></span></div>`
  const mod = { lock: '', ok: ' ab-state--ok', cancel: ' ab-state--muted', err: ' ab-state--err' }[kind]
  return `<div class="ab-state${mod}" aria-hidden="true">${ICONS[kind]}</div>`
}

// Kartı yeniden çizer; düğme varsa ona, yoksa başlığa odaklanır (ekran okuyucu + klavye)
function renderCard(html, focus) {
  card.innerHTML = html
  const btn = card.querySelector('[data-ab-action]')
  if (btn) btn.addEventListener('click', startSignIn)
  if (focus) (btn || card.querySelector('.ab-title'))?.focus({ preventScroll: true })
}

function signInButton(label) {
  return `<button class="btn btn-light btn-lg" type="button" data-ab-action>${GOOGLE_G}<span>${label}</span></button>`
}

function showSuccess() {
  renderCard(`
    ${stateIcon('ok')}
    <h1 class="ab-title" tabindex="-1">Giriş Başarılı!</h1>
    <p class="ab-text">Uygulamaya dönebilirsiniz.<br>Bu sekmeyi kapatabilirsiniz.</p>
  `, true)
  setTimeout(() => window.close(), 1800)
}

function showCancel() {
  renderCard(`
    ${stateIcon('cancel')}
    <h1 class="ab-title" tabindex="-1">İptal Edildi</h1>
    <p class="ab-text">Giriş iptal edildi.</p>
    ${signInButton('Tekrar Dene')}
  `, true)
}

function showError(msg) {
  renderCard(`
    ${stateIcon('err')}
    <h1 class="ab-title" tabindex="-1">Hata</h1>
    <p class="ab-err" role="alert"></p>
    <button class="btn btn-light btn-lg" type="button" data-ab-action>Tekrar Dene</button>
  `, true)
  // Hata metni (Firebase mesajı; bridge_key'i içerebilir) HTML olarak basılmaz
  card.querySelector('.ab-err').textContent = String(msg || '')
}

async function startSignIn() {
  renderCard(`
    ${stateIcon('wait')}
    <h1 class="ab-title" tabindex="-1">Google ile Giriş</h1>
    <p class="ab-text">Açılan Google penceresinde hesabınızı seçin...</p>
  `, true)
  try {
    const provider = new firebase.auth.GoogleAuthProvider()
    provider.addScope('email')
    provider.addScope('profile')

    let result     = await _auth.signInWithPopup(provider)
    let credential = result.credential || firebase.auth.GoogleAuthProvider.credentialFromResult(result)

    // Already signed in — credential can be null; force a fresh one via reauthenticate
    if (!credential?.idToken && result.user) {
      const reauth = await result.user.reauthenticateWithPopup(provider)
      credential = reauth.credential || firebase.auth.GoogleAuthProvider.credentialFromResult(reauth)
    }

    await _db.collection('app_bridge').doc(bridgeKey).set({
      googleIdToken: credential.idToken,
      uid:           result.user.uid,
      email:         result.user.email,
      displayName:   result.user.displayName || '',
      photoURL:      result.user.photoURL    || '',
      expiresAt:     firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 5 * 60 * 1000)),
    })

    showSuccess()
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      showCancel()
    } else {
      showError(e.message || e.code)
    }
  }
}

// Entry point — show button first (browsers block popups without a user gesture)
if (!bridgeKey) {
  window.location.href = '/'
} else {
  renderCard(`
    ${stateIcon('lock')}
    <h1 class="ab-title">Uygulama Girişi</h1>
    <p class="ab-text">Berkay Er Academy uygulaması için Google hesabınızla giriş yapın.</p>
    ${signInButton('Google ile Giriş Yap')}
  `, false)
}
</script>
</body>
</html>
