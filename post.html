.pd-aside { display:flex; flex-direction:column; gap:14px; padding-top:44px; }

  html.pd-docked .toast-wrap { bottom:calc(var(--pd-dock-h, 0px) + 12px); }

function toDate(ts) { if (!ts) return null; const d = ts.toDate ? ts.toDate() : new Date(ts); return isNaN(d) ? null : d; }
function fmtDate(ts) {
  const d = toDate(ts);
  return d ? d.toLocaleDateString(lang() === 'en' ? 'en-US' : 'tr-TR', { day:'numeric', month:'short', year:'numeric' }) : '';
}
function timeEl(ts) {
  const t = el('time', 'pd-date', fmtDate(ts));
  const d = toDate(ts); if (d) t.dateTime = d.toISOString();
  return t;
}
function renderMd(txt) {
  return (txt||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`(.+?)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
}
function profileHref(uid) { return `profile?uid=${encodeURIComponent(uid)}`; }
function goProfile(uid) { location.href = profileHref(uid); }
function initialOf(s) { s = String(s || '').trim(); return s ? s.charAt(0).toLocaleUpperCase('tr') : '•'; }

    _toastWrap.setAttribute('role', 'status'); _toastWrap.setAttribute('aria-live', 'polite');

  setTimeout(()=>{ t.style.cssText='opacity:0;transform:translateY(8px);transition:.2s;'; setTimeout(()=>t.remove(),200); }, ms);
}

function copyLink() {
  const ok = () => showToast(L('post_link_copied', `Link kopyalandı`, 'Link copied'), 'info');
  const fail = () => showToast(L('post_copy_fail', `Link kopyalanamadı`, 'Could not copy the link'), 'error');
  try { navigator.clipboard.writeText(location.href).then(ok, fail); } catch { fail(); }
}
async function shareLink() {
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url: location.href }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyLink();
}
const shareBtn = document.getElementById('pdShareBtn');

function updateAuthBar(user) {

  _notifPanelEl = null;
  if (user) {
    const wrap = document.createElement('div'); wrap.className = 'auth-user-wrap';
    const img  = document.createElement('img');  img.className = 'auth-avatar';

    const name = document.createElement('span'); name.className = 'auth-name';
    name.textContent = isAdmin(user) ? 'Admin' : (user.displayName?.split(' ')[0] || 'Üye');
    name.onclick = () => goProfile(user.uid);
    const out = document.createElement('button'); out.className = 'auth-out-btn';
    out.textContent = '✕'; out.onclick = () => auth.signOut();

    const badge = document.createElement('span'); badge.className = 'notif-badge'; badge.style.display = 'none';

function closeNotifPanel() {
  if (_notifPanelEl) _notifPanelEl.classList.remove('open');
}

function toggleNotifPanel(user) {
  if (!_notifPanelEl) return;
  const isOpen = _notifPanelEl.classList.contains('open');
  if (isOpen) { _notifPanelEl.classList.remove('open'); return; }
  _notifPanelEl.classList.add('open');
  setTimeout(() => document.addEventListener('click', closeNotifPanel, { once: true }), 0);
  markAllRead(user.uid);
}

// Bağlantılı bildirim satırı klavyeyle de açılsın (profile.html _btnify ile aynı kalıp)
function _notifBtnify(node) {
  node.setAttribute('role', 'button'); node.tabIndex = 0;
  node.addEventListener('keydown', e => { if (e.target === node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); node.click(); } });
  return node;
}
function _mergeNotifs(uid) {
  const all = [
    ..._personalNotifs.map(n => ({...n, _t:'p'})),
    ..._announcements.filter(n => !_dismissedAnns.includes(n._id)).map(n => ({...n, _t:'a'}))
  ].sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
  const annSec = _annSeenAt?.seconds || 0;
  const unread = _personalNotifs.filter(n => !n.read).length
    + _announcements.filter(n => (n.createdAt?.seconds||0) > annSec).length;
  const badge = document.querySelector('.notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.style.display = unread > 0 ? 'block' : 'none'; }
  if (_notifPanelEl) {
    const list = _notifPanelEl.querySelector('.notif-list'); if (!list) return;
    list.innerHTML = '';
    if (!all.length) { list.append(el('div', 'notif-empty', L('ui_no_notifs', `Bildirim yok`, 'No notifications'))); return; }
    all.forEach(n => {
      const isUnread = n._t==='p' ? !n.read : (n.createdAt?.seconds||0) > annSec;
      const item = document.createElement('div'); item.className = 'notif-item' + (isUnread ? ' unread' : '');
      const timeStr = n.createdAt ? n.createdAt.toDate().toLocaleDateString(lang() === 'en' ? 'en-US' : 'tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const _nt = el('div', 'notif-item-text', n.text || L('ui_new_notif', `Yeni bildirim`, 'New notification'));
      if (n._t === 'a') _nt.insertAdjacentHTML('afterbegin', '<svg class="icon notif-ann-icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-info"/></svg> ');
      item.append(_nt, el('div', 'notif-item-time', timeStr));
      if (n.postId) { item.onclick = () => { location.href = `post?id=${n.postId}`; }; _notifBtnify(item); }
      else if (n.type === 'lesson_confirm') { item.onclick = () => { location.href = '/booking#derslerim'; }; _notifBtnify(item); }
      if (n._id) {
        const del = document.createElement('button'); del.type = 'button'; del.className = 'notif-del-btn'; del.textContent = '×'; del.title = L('prof_notif_del', `Bildirimi sil`, 'Delete notification'); del.setAttribute('aria-label', del.title);
        del.onclick = e => {
          e.stopPropagation();
          if (n._t === 'p') {
            db.collection('notifications').doc(uid).collection('items').doc(n._id).delete();
          } else {
            if (!_dismissedAnns.includes(n._id)) { _dismissedAnns.push(n._id); }
            db.collection('users').doc(uid).update({ dismissedAnns: FV.arrayUnion(n._id) }).catch(() => {});
            _announcements = _announcements.filter(a => a._id !== n._id);
            _mergeNotifs(uid);
          }
        };
        item.append(del);
      }
      list.append(item);
    });
  }
}

function markAllRead(uid) {
  db.collection('notifications').doc(uid).collection('items')
    .where('read', '==', false).get().then(snap => {
      const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { read: true })); batch.commit();
    }).catch(() => {});
  db.collection('users').doc(uid).set({ announcementsSeenAt: FV.serverTimestamp() }, { merge: true }).catch(() => {});
  _annSeenAt = { seconds: Date.now() / 1000 };
  _personalNotifs = _personalNotifs.map(n => ({...n, read: true}));
  _mergeNotifs(uid);
}

function initNotifications(user) {
  if (_notifUnsub) { _notifUnsub(); _notifUnsub = null; }
  if (_annUnsub) { _annUnsub(); _annUnsub = null; }
  _personalNotifs = []; _announcements = []; _annSeenAt = null; _dismissedAnns = [];
  if (!user) return;
  db.collection('users').doc(user.uid).get().then(d => {
    _annSeenAt = d.data()?.announcementsSeenAt || null;
    _dismissedAnns = d.data()?.dismissedAnns || [];
    _mergeNotifs(user.uid);
  }).catch(() => {});
  _notifUnsub = db.collection('notifications').doc(user.uid).collection('items')
    .orderBy('createdAt', 'desc').limit(20)
    .onSnapshot(snap => {
      _personalNotifs = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (snap.docs.length > 4) snap.docs.slice(4).forEach(d => d.ref.delete());
      _mergeNotifs(user.uid);
    }, () => {});
  _annUnsub = db.collection('announcements').orderBy('createdAt', 'desc').limit(15)
    .onSnapshot(snap => { _announcements = snap.docs.map(d => ({...d.data(), _id: d.id})); _mergeNotifs(user.uid); }, () => {});
}

// ── Profiller (önbellekli; girişsizken `users` okunamaz → null) ────────
function getProfile(uid) {
  if (!uid) return Promise.resolve(null);
  if (!_profiles.has(uid)) {
    _profiles.set(uid, db.collection('users').doc(uid).get()
      .then(d => d.exists ? d.data() : null).catch(() => null));
  }
  return _profiles.get(uid);
}
const photoOf = (prof, fallback) => prof?.customPhotoURL || prof?.photoURL || fallback || null;

// Avatar: fotoğraf → baş harf (eğitmen: altın "BE"). Ada ayrıca bağlantı olduğu için
// avatar bağlantısı ekran okuyucudan ve sekme sırasından gizli.
function avatar({ photo, name, uid, cls = '', staff = false }) {
  const a = document.createElement(uid ? 'a' : 'span');
  a.className = 'pd-ava' + (cls ? ' ' + cls : '') + (staff ? ' pd-ava--staff' : '');
  if (uid) { a.href = profileHref(uid); a.tabIndex = -1; }
  a.setAttribute('aria-hidden', 'true');
  const initial = () => { a.textContent = staff ? 'BE' : initialOf(name); a.classList.add('pd-ava--initial'); };
  if (photo) {
    const img = document.createElement('img');
    img.src = photo; img.alt = ''; img.decoding = 'async';
    img.onerror = () => { img.remove(); initial(); };
    a.append(img);
  } else initial();
  return a;
}
function nameLink(cls, name, uid) {
  const n = el(uid ? 'a' : 'span', cls, name || L('post_member', `Üye`, 'Member'));
  if (uid) n.href = profileHref(uid);

// ── Mobil: sabit yanıt çubuğunun yüksekliği (sayfa alt boşluğu + toast konumu)
let _dockRO = null, _dockMeasure = null;
function watchDock(box) {
  if (_dockRO) { _dockRO.disconnect(); _dockRO = null; }
  const root = document.documentElement;
  root.classList.add('pd-docked');
  _dockMeasure = () => {
    if (!box.isConnected) return;
    const fixed = getComputedStyle(box).position === 'fixed';
    const h = fixed ? Math.max(0, Math.ceil(window.innerHeight - box.getBoundingClientRect().top)) : 0;
    root.style.setProperty('--pd-dock-h', h + 'px');
  };
  _dockMeasure();
  if ('ResizeObserver' in window) { _dockRO = new ResizeObserver(() => _dockMeasure && _dockMeasure()); _dockRO.observe(box); }
}
window.addEventListener('resize', () => { if (_dockMeasure) _dockMeasure(); });

// ── Konu ────────────────────────────────────────────────────────────────
async function renderPost() {
  if (!postId) { location.href = 'forum'; return; }
  const seq = ++_postSeq;
  let doc;
  try { doc = await db.collection('forum').doc(postId).get(); }
  catch (e) {
    if (seq !== _postSeq) return;
    renderEmpty(L('post_load_fail', `Konu yüklenemedi.`, 'Could not load the topic.'));
    return;
  }
  if (seq !== _postSeq) return;
  if (!doc.exists) { renderEmpty(L('post_not_found', `Konu bulunamadı.`, 'Topic not found.')); return; }
  const post = { id: doc.id, ...doc.data() };
  const profile = await getProfile(post.authorId);
  if (seq !== _postSeq) return;

  document.title = (post.title || 'Konu') + ' — Elektronik Müzik Topluluğu';
  _lastLang = lang();
  const anim = _animate; _animate = false;

  const content = document.getElementById('pdContent');
  content.textContent = '';
  content.append(buildArticle(post, profile, anim));
  renderAside(post, profile);
  document.getElementById('layout').setAttribute('aria-busy', 'false');
  renderReplies(content, post, anim);
}

function buildArticle(post, profile, anim) {
  const authorIsAdmin = post.authorIsAdmin === true || post.authorEmail === ADMIN_EMAIL;
  const card = el('article', 'pd-article' + (anim ? ' be-rv be-d1' : ''));
  card.setAttribute('aria-labelledby', 'pdTitle');

  // Kategori + durum
  const chips = el('div', 'pd-chips');
  if (post.category) chips.append(el('span', 'pd-chip pd-chip--cat', catLabel(post.category)));
  if (post.solved) chips.append(el('span', 'pd-chip pd-chip--ok', L('forum_is_solved', `✓ Çözüldü`, '✓ Solved')));
  else {
    const open = el('span', 'pd-chip pd-chip--open');
    open.append(el('span', 'be-dot'), document.createTextNode(L('forum_filter_open', `Açık`, 'Open')));
    chips.append(open);
  }
  card.append(chips);

  const ttl = el('h1', 'pd-title', post.title || L('post_topic', `Konu`, 'Topic')); ttl.id = 'pdTitle';
  card.append(ttl);

  // Yazar
  const author = el('div', 'pd-author');
  const ring = el('span', 'pd-ring');
  ring.append(avatar({ photo: photoOf(profile, post.authorPhotoURL), name: post.authorName, uid: post.authorId, staff: authorIsAdmin }));
  const meta = el('div', 'pd-author-meta');
  const line = el('span', 'pd-author-line');
  line.append(nameLink('pd-author-name', post.authorName, post.authorId));
  if (authorIsAdmin) line.append(el('span', 'pd-staff', L('post_staff', `EĞİTMEN`, 'INSTRUCTOR')));
  else if (titleLabel(profile?.title)) line.append(el('span', 'pd-rank', up(titleLabel(profile.title))));
  meta.append(line, timeEl(post.createdAt));
  author.append(ring, meta);
  card.append(author);

  let body = null;
  if (post.text) {
    body = el('div', 'pd-body');
    body.innerHTML = renderMd(post.text);
    card.append(body);
  }

  // Eylemler
  const actions = el('div', 'pd-actions');
  const left = el('div', 'pd-actions-l'), right = el('div', 'pd-actions-r');
  actions.append(left, right);

  // Beğeni (yerinde güncellenir)
  const likeBtn = el('button', 'pd-act pd-like'); likeBtn.type = 'button';
  likeBtn.innerHTML = HEART;
  const likeTxt = el('span', '', L('post_like', `Beğen`, 'Like'));
  const likeN = el('span', 'pd-like-n');
  likeBtn.append(likeTxt, likeN);
  const syncLike = (pop) => {
    const liked = !!(_user && (post.likedBy || []).includes(_user.uid));
    likeBtn.setAttribute('aria-pressed', liked ? 'true' : 'false');
    likeN.textContent = String(post.likeCount || 0);
    likeBtn.setAttribute('aria-label', `${L('post_like', `Beğen`, 'Like')} (${post.likeCount || 0})`);
    const svg = likeBtn.querySelector('svg');
    if (pop && liked && svg) { svg.classList.remove('be-pop-in'); void svg.getBoundingClientRect(); svg.classList.add('be-pop-in'); }
  };
  syncLike(false);
  let likeBusy = false;
  likeBtn.onclick = async () => {
    if (!_user) { showToast(L('forum_like_signin', `Beğenmek için giriş yap`, 'Sign in to like'), 'info'); return; }
    if (likeBusy) return;
    likeBusy = true; likeBtn.setAttribute('aria-busy', 'true');
    const uid = _user.uid;
    const wasLiked = (post.likedBy || []).includes(uid);
    const ref = db.collection('forum').doc(postId);
    try {
      if (wasLiked) {
        await ref.update({ likedBy: FV.arrayRemove(uid), likeCount: FV.increment(-1) });
        post.likedBy = (post.likedBy || []).filter(x => x !== uid);
        post.likeCount = Math.max(0, (post.likeCount || 0) - 1);
      } else {
        await ref.update({ likedBy: FV.arrayUnion(uid), likeCount: FV.increment(1) });
        post.likedBy = [...(post.likedBy || []), uid];
        post.likeCount = (post.likeCount || 0) + 1;
      }
      syncLike(true);
    } catch(e) { const c=errId(); showToast(`Hata (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error'); }
    finally { likeBusy = false; likeBtn.removeAttribute('aria-busy'); }
  };
  left.append(likeBtn);

  // Linki kopyala (mobilde başlıktaki Paylaş)
  const copyBtn = el('button', 'pd-act pd-act--copy'); copyBtn.type = 'button';
  copyBtn.innerHTML = ic('link');
  copyBtn.append(el('span', '', L('post_copy_link', `Linki Kopyala`, 'Copy Link')));
  copyBtn.onclick = copyLink;
  left.append(copyBtn);

  // Sahibi: konuyu düzenle (yalnız metin)
  if (_user && post.authorId === _user.uid) {
    const editBtn = el('button', 'pd-act', L('post_edit', `Düzenle`, 'Edit')); editBtn.type = 'button';
    editBtn.setAttribute('aria-expanded', 'false');
    let editWrap = null;
    const closeEdit = () => { if (editWrap) { editWrap.remove(); editWrap = null; } editBtn.setAttribute('aria-expanded', 'false'); };
    editBtn.onclick = () => {
      if (editWrap) { closeEdit(); return; }
      editWrap = el('div', 'pd-edit');
      const ta = el('textarea', 'textarea');
      ta.value = post.text || '';
      ta.placeholder = L('forum_edit_ph', `Konu içeriği...`, 'Topic content...');
      ta.setAttribute('aria-label', ta.placeholder);
      const btns = el('div', 'pd-edit-btns');
      const saveB = el('button', 'btn btn-sm btn-primary', L('post_save', `Kaydet`, 'Save')); saveB.type = 'button';
      const cancelB = el('button', 'btn btn-sm btn-ghost', L('post_cancel', `Vazgeç`, 'Cancel')); cancelB.type = 'button';
      cancelB.onclick = () => { closeEdit(); editBtn.focus(); };
      saveB.onclick = async () => {
        const newText = ta.value.trim(); if (!newText) return;
        saveB.disabled = true; saveB.textContent = '…';
        try {
          await db.collection('forum').doc(postId).update({ text: newText, editedAt: FV.serverTimestamp() });
          closeEdit();
          showToast(L('forum_post_updated', `✓ Konu güncellendi`, '✓ Post updated'));
          renderPost();
        } catch(e) {
          const c=errId(); showToast(`Hata (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error');
          saveB.disabled = false; saveB.textContent = L('post_save', `Kaydet`, 'Save');
        }
      };
      btns.append(saveB, cancelB); editWrap.append(ta, btns);
      card.insertBefore(editWrap, actions);
      editBtn.setAttribute('aria-expanded', 'true');
      ta.focus();
    };
    left.append(editBtn);
  }

  // Admin: çözüldü (iki yönlü) + sil
  if (_user && isAdmin(_user)) {
    const solveBtn = el('button', 'pd-act pd-solve'); solveBtn.type = 'button';
    if (post.solved) solveBtn.textContent = L('post_reopen', `Yeniden aç`, 'Reopen');
    else solveBtn.append(el('span', 'pd-solve-lg', L('post_mark_solved', `Çözüldü olarak işaretle`, 'Mark as solved')),
                         el('span', 'pd-solve-sm', L('forum_mark_solved', `Çözüldü işaretle`, 'Mark as solved')));
    solveBtn.setAttribute('aria-pressed', post.solved ? 'true' : 'false');
    solveBtn.onclick = async () => {
      solveBtn.setAttribute('aria-busy', 'true');
      try {
        await db.collection('forum').doc(postId).update({ solved: !post.solved });
        showToast(post.solved ? L('post_reopened', `Konu yeniden açıldı`, 'Topic reopened')
                              : L('post_marked_solved', `✓ Konu çözüldü olarak işaretlendi`, '✓ Topic marked as solved'), post.solved ? 'info' : 'success');
        renderPost();
      } catch(e) {
        const c=errId(); showToast(`Hata (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error');
        solveBtn.removeAttribute('aria-busy');
      }
    };
    right.append(solveBtn);

    const del = el('button', 'pd-act pd-act--danger', L('post_delete', `Sil`, 'Delete')); del.type = 'button';
    del.onclick = async () => {
      if (!confirm(L('post_delete_confirm', `Konuyu ve yanıtlarını sil?`, 'Delete the topic and its replies?'))) return;
      del.setAttribute('aria-busy', 'true');
      try {
        const rSnap = await db.collection('forum').doc(postId).collection('replies').get();
        const batch = db.batch();
        rSnap.docs.forEach(d => batch.delete(d.ref));
        batch.delete(db.collection('forum').doc(postId));
        await batch.commit();
        location.href = 'forum';
      } catch(e) {
        const c=errId(); showToast(`Silme hatası (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error');
        del.removeAttribute('aria-busy');
      }
    };
    right.append(del);
  }
  card.append(actions);
  return card;
}

function renderAside(post, profile) {
  const aside = document.getElementById('pdAside');
  aside.textContent = '';
  aside.setAttribute('aria-label', L('post_opened_by_aria', `Konuyu açan`, 'Started by'));
  const authorIsAdmin = post.authorIsAdmin === true || post.authorEmail === ADMIN_EMAIL;
  const card = el('div', 'pd-op');
  card.append(el('span', 'pd-op-label', L('post_opened_by', `KONUYU AÇAN`, 'STARTED BY')));
  const row = el('div', 'pd-op-row');
  row.append(avatar({ photo: photoOf(profile, post.authorPhotoURL), name: post.authorName, uid: post.authorId, cls: 'pd-ava--lg', staff: authorIsAdmin }));
  const who = el('div', 'pd-op-who');
  who.append(nameLink('pd-op-name', post.authorName, post.authorId));
  const rank = [authorIsAdmin ? L('post_staff_role', `Eğitmen`, 'Instructor') : '', titleLabel(profile?.title)].filter(Boolean).join(' · ');
  if (rank) who.append(el('span', 'pd-op-rank', rank));
  row.append(who);
  card.append(row);
  if (post.authorId) {
    const a = el('a', 'pd-op-link'); a.href = profileHref(post.authorId);
    a.append(el('span', '', L('post_view_profile', `Profili gör`, 'View profile')), el('span', '', '→'));
    a.lastChild.setAttribute('aria-hidden', 'true');
    card.append(a);
  }
  const nb = el('a', 'btn btn-light btn-lg btn-block', L('post_new_topic', `Yeni konu aç`, 'Start a new topic')); nb.href = '/new-post';
  aside.append(card, nb);
  aside.hidden = false;
}

// ── Yanıtlar ────────────────────────────────────────────────────────────
function renderReplies(content, post, anim) {
  if (_unsubReplies) { _unsubReplies(); _unsubReplies = null; }
  const sec = el('section', 'pd-replies'); sec.id = 'repliesSec';
  sec.setAttribute('aria-labelledby', 'pdRepliesH');
  const head = el('div', 'pd-replies-head' + (anim ? ' be-rv be-d2' : ''));
  const h2 = el('h2', 'pd-replies-title', L('post_replies_h', `Yanıtlar`, 'Replies')); h2.id = 'pdRepliesH';
  const n = el('span', 'pd-replies-n');
  head.append(h2, n);
  const list = el('div', 'pd-reply-list'); list.id = 'pdReplyList';
  list.setAttribute('aria-busy', 'true');
  list.append(el('span', 'sr-only', L('post_replies_loading', `Yanıtlar yükleniyor...`, 'Loading replies...')));
  for (let i = 0; i < 2; i++) { const s = el('span', 'be-sk pd-sk-reply'); s.setAttribute('aria-hidden', 'true'); list.append(s); }
  sec.append(head, list);
  content.append(sec);

  let first = true;
  _unsubReplies = db.collection('forum').doc(postId).collection('replies')
    .orderBy('createdAt','asc').limit(200)
    .onSnapshot(snap => { renderReplyCards(snap, list, n, post, first && anim); first = false; }, e => {
      list.removeAttribute('aria-busy'); list.textContent = '';
      if (e.code !== 'permission-denied') showToast('Yorumlar yüklenemedi: ' + (e.message || e.code), 'error');
    });

  const composer = buildComposer(post);
  content.append(composer);
  watchDock(composer);
}

async function renderReplyCards(snap, list, n, post, anim) {
  const seq = ++_replySeq;
  const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const profiles = await Promise.all(docs.map(r => getProfile(r.authorId)));
  if (seq !== _replySeq || !list.isConnected) return;
  n.textContent = String(docs.length);
  list.removeAttribute('aria-busy');
  list.textContent = '';
  if (!docs.length) {
    if (!post.solved) list.append(el('p', 'be-empty pd-replies-empty', L('post_no_replies', `Henüz yanıt yok. İlk yanıtı sen yaz!`, 'No replies yet. Be the first to reply!')));
    return;
  }
  docs.forEach((r, i) => list.append(buildReply(r, profiles[i], anim ? i : -1)));
}

function buildReply(r, prof, idx) {
  const staff = !!r.isAdmin;
  const card = el('article', 'pd-reply' + (staff ? ' pd-reply--staff' : '') + (idx >= 0 ? ` be-rv be-d${Math.min(3 + idx, 6)}` : ''));
  card.append(avatar({ photo: photoOf(prof, r.authorPhotoURL), name: r.authorName, uid: r.authorId, staff }));
  const head = el('div', 'pd-reply-head');
  head.append(nameLink('pd-reply-name', r.authorName, r.authorId));
  if (staff) head.append(el('span', 'pd-staff', L('post_staff', `EĞİTMEN`, 'INSTRUCTOR')));
  head.append(timeEl(r.createdAt));
  const rTxt = el('div', 'pd-reply-text'); rTxt.innerHTML = renderMd(r.text);

  const tools = el('div', 'pd-reply-tools');
  // Sahibi: kendi yanıtını düzenle
  if (_user && r.authorId === _user.uid) {
    const editB = el('button', 'pd-tool', L('post_edit', `Düzenle`, 'Edit')); editB.type = 'button';
    editB.setAttribute('aria-expanded', 'false');
    let wrap = null;
    const close = () => { if (wrap) { wrap.remove(); wrap = null; } editB.setAttribute('aria-expanded', 'false'); };
    editB.onclick = () => {
      if (wrap) { close(); return; }
      wrap = el('div', 'pd-edit');
      const ta = el('textarea', 'textarea'); ta.value = r.text || '';
      ta.setAttribute('aria-label', L('post_edit', `Düzenle`, 'Edit'));
      const btns = el('div', 'pd-edit-btns');
      const saveB = el('button', 'btn btn-sm btn-primary', L('post_save', `Kaydet`, 'Save')); saveB.type = 'button';
      const cancelB = el('button', 'btn btn-sm btn-ghost', L('post_cancel', `Vazgeç`, 'Cancel')); cancelB.type = 'button';
      cancelB.onclick = () => { close(); editB.focus(); };
      saveB.onclick = async () => {
        const t = ta.value.trim(); if (!t) return;
        saveB.disabled = true;
        try {
          await db.collection('forum').doc(postId).collection('replies').doc(r.id).update({ text: t, editedAt: FV.serverTimestamp() });
          r.text = t; rTxt.innerHTML = renderMd(t);
          close();
          showToast(L('post_reply_updated', `✓ Yanıt güncellendi`, '✓ Reply updated'));
        } catch(e) {
          showToast('Güncelleme hatası: ' + (e.message||e.code), 'error');
          saveB.disabled = false;
        }
      };
      btns.append(saveB, cancelB); wrap.append(ta, btns);
      card.append(wrap);
      editB.setAttribute('aria-expanded', 'true');
      ta.focus();
    };
    tools.append(editB);
  }
  // Admin: yanıtı sil (onaysız, eskisi gibi)
  if (_user && isAdmin(_user)) {
    const rdel = el('button', 'pd-tool pd-tool--danger', L('post_delete', `Sil`, 'Delete')); rdel.type = 'button';
    rdel.onclick = async () => {
      try {
        await db.collection('forum').doc(postId).collection('replies').doc(r.id).delete();
        await db.collection('forum').doc(postId).update({ replyCount: FV.increment(-1) });
        card.remove();
      } catch(e) { const c=errId(); showToast(`Silme hatası (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error'); }
    };
    tools.append(rdel);
  }
  if (tools.childElementCount) head.append(tools);
  card.append(head, rTxt);
  return card;
}

// ── Yanıt yazma: masaüstünde akışta, mobilde ekranın altında ─────────
function buildComposer(post) {
  if (post.solved) {
    const box = el('div', 'pd-closed', L('forum_solved_closed', `✓ Bu konu çözüldü — yanıt kapalı`, '✓ This topic is solved — replies closed'));
    box.setAttribute('role', 'status');
    return box;
  }
  if (!_user) {
    const box = el('div', 'pd-composer pd-composer--signin');
    box.append(el('p', '', L('post_signin_reply', `Yanıtlamak için giriş yap`, 'Sign in to reply')));
    const b = el('button', 'btn btn-primary', L('forum_login_btn', `Giriş Yap`, 'Sign in')); b.type = 'button';
    b.onclick = doSignIn;
    box.append(b);
    return box;
  }
  const form = el('form', 'pd-composer'); form.noValidate = true;
  form.setAttribute('aria-label', L('post_reply_write', `Yanıt Yaz`, 'Write a Reply'));
  const field = el('label', 'pd-composer-field');
  field.append(el('span', 'pd-composer-label', L('post_reply_label', `YANITIN`, 'YOUR REPLY')));
  const ta = el('textarea', 'pd-ta'); ta.rows = 2; ta.name = 'reply';
  const mq = window.matchMedia('(max-width:1024px)');
  const setPh = () => { ta.placeholder = mq.matches ? L('post_reply_ph', `Yanıtını yaz...`, 'Write your reply...')
                                                    : L('post_reply_ph_long', `Yanıtını buraya yaz… (Ctrl+Enter ile gönder)`, 'Write your reply here… (Ctrl+Enter to send)'); };
  setPh();
  if (mq.addEventListener) mq.addEventListener('change', setPh);
  ta.value = _draft;
  ta.addEventListener('input', () => { _draft = ta.value; });
  field.append(ta);
  const foot = el('div', 'pd-composer-foot');
  foot.append(el('span', 'pd-md-hint', L('post_md_hint', '**KALIN** · *İTALİK* · `KOD`', '**BOLD** · *ITALIC* · `CODE`')));
  const sub = el('button', 'btn btn-primary pd-send'); sub.type = 'submit';
  const subTxt = el('span', 'pd-send-txt', L('post_send', `Gönder`, 'Send'));
  sub.append(subTxt); sub.insertAdjacentHTML('beforeend', SEND);
  foot.append(sub);
  form.append(field, foot);
  ta.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { e.preventDefault(); send(); } });
  form.addEventListener('submit', e => { e.preventDefault(); send(); });

  async function send() {
    const txt = ta.value.trim(); if (!txt || sub.disabled) return;
    sub.disabled = true; subTxt.textContent = '…'; sub.setAttribute('aria-busy', 'true');
    try {
      await db.collection('forum').doc(postId).collection('replies').add({
        text:          txt,
        authorName:    _user.displayName?.split(' ')[0] || 'Üye',
        authorId:      _user.uid,
        authorPhotoURL:_user.photoURL || '',
        isAdmin:       isAdmin(_user),
        createdAt:     FV.serverTimestamp(),
      });
      await db.collection('forum').doc(postId).update({ replyCount: FV.increment(1) });
      db.collection('users').doc(_user.uid).collection('userReplies').add({
        postId, text: txt.slice(0, 200), createdAt: FV.serverTimestamp(),
      }).catch(() => {});
      db.collection('users').doc(_user.uid).set({
        replyCount: FV.increment(1),
      }, { merge: true }).catch(() => {});
      if (post.authorId && post.authorId !== _user.uid) {
        db.collection('notifications').doc(post.authorId).collection('items').add({
          text: `${_user.displayName?.split(' ')[0] || 'Biri'}, "${post.title || 'konuna'}" konusuna yanıt verdi`,
          postId, fromUid: _user.uid, fromName: _user.displayName?.split(' ')[0] || 'Üye',
          read: false, createdAt: FV.serverTimestamp(),
        }).catch(() => {});
      }
      ta.value = ''; _draft = '';
    } catch(e) {
      const c=errId(); showToast(`Yanıt gönderilemedi (${c}): `+(e.code||e.message||'Bilinmeyen'), 'error');
    } finally {
      sub.disabled = false; sub.removeAttribute('aria-busy'); subTxt.textContent = L('post_send', `Gönder`, 'Send');
    }
  }
  return form;
}

// Dil değişince (TR/EN) sayfa metinleri yeniden çizilir; taslak korunur
new MutationObserver(() => {
  syncStaticLabels();
  if (_lastLang && lang() !== _lastLang) renderPost();
}).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

window.bkAuth.handleRedirectResult();
auth.onAuthStateChanged(async user => {
  _user = user;
  _profiles.clear();   // girişe göre `users` okuma izni değişir
  updateAuthBar(user);
  initNotifications(user);
  await renderPost();
});
</script>
